                                    {isStale ? `⚠ Màj il y a ${mins} min` : `Màj : ${label}`}
                                </div>
                            );
                        })()}
                        <div className="flex items-center gap-2 px-3 py-1.5 bg-slate-100 text-slate-500 rounded-lg text-xs font-mono">
                           <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                           AUTO-REFRESH (5m)
                        </div>
                    </div>
                </div>

                {/* --- MARKET REPORT SECTION (NEW) --- */}
                {newsData && newsData.report && (
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {/* 1. Market Mood */}
                        <div className="bg-slate-900 rounded-xl p-6 relative overflow-hidden text-white flex flex-col justify-center items-center text-center shadow-lg">
                             <div className="absolute inset-0 bg-gradient-to-br from-indigo-900 to-slate-900 z-0"></div>
                             <div className="relative z-10">
                                 <div className="text-xs uppercase font-bold text-indigo-300 tracking-widest mb-2">Sentiment IA (Multi-Source)</div>
                                 <div className={`text-4xl font-black mb-1 ${
                                     newsData.report.market_mood === 'Bullish' ? 'text-emerald-400' : 
                                     newsData.report.market_mood === 'Bearish' ? 'text-red-400' : 'text-slate-200'
                                 }`}>
                                     {newsData.report.market_mood ? newsData.report.market_mood.toUpperCase() : 'NEUTRE'}
                                 </div>
                                 <div className="text-xs font-mono text-slate-400 mt-2 opacity-80">
                                     Basé sur l'analyse de {newsData.items ? newsData.items.length : 0} articles & tweets
                                 </div>
                             </div>
                        </div>

                        {/* 2. Top Threats / Critical News */}
                        <div className="bg-white border text-left border-slate-200 rounded-xl p-5 shadow-sm md:col-span-2 flex flex-col relative overflow-hidden">
                             <div className="border-b border-slate-100 pb-2 mb-3 flex justify-between items-center">
                                 <h3 className="font-bold text-slate-800 flex items-center gap-2">
                                     <AlertTriangle className="w-4 h-4 text-orange-500" />
                                     Points de Vigilance (Critiques)
                                 </h3>
                                 <span className="text-[10px] bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full font-bold">TOP PRIORITÉ</span>
                             </div>
                             <div className="flex-1 space-y-2 overflow-y-auto max-h-[120px] custom-scrollbar">
                                 {newsData.report.top_threats && newsData.report.top_threats.length > 0 ? (
                                     newsData.report.top_threats.slice(0, 3).map((item, i) => (
                                         <div key={i} className="flex flex-col gap-1 items-start text-sm mb-2 pb-2 border-b border-slate-50 last:border-0 last:pb-0">
                                             <div className="flex gap-2 items-start">
                                                <span className="mt-1.5 w-1.5 h-1.5 rounded-full bg-red-500 shrink-0"></span>
                                                <p className="text-slate-700 leading-snug">
                                                    <span className="font-bold text-slate-900 block md:inline">{item.title_fr || item.title}.</span> 
                                                    <span className="text-slate-500 text-xs ml-1 block md:inline">{item.summary_fr || item.summary ? (item.summary_fr || item.summary).substring(0, 80) + '...' : ''}</span>
                                                </p>
                                             </div>
                                             
                                             {/* Polymarket Odds Integration */}
                                             {item.polymarket_data && item.polymarket_data.length > 0 && (
                                                <div className="ml-3.5 mt-1 flex flex-wrap gap-2">
                                                    {item.polymarket_data.map((m, idx) => (
                                                        <a key={idx} href={m.url} target="_blank" rel="noopener noreferrer" 
                                                           className="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-md px-2 py-1 text-[10px] text-slate-600 hover:bg-slate-100 hover:text-indigo-600 hover:border-indigo-200 transition-colors no-underline">
                                                            <img src="https://polymarket.com/favicon.ico" className="w-3 h-3 opacity-80" alt="PM" />
                                                            <span className="font-bold text-slate-800">{m.probability ? Math.round(parseFloat(m.probability) * 100) + '%' : 'N/A'}</span>
                                                            <span className="opacity-75 truncate max-w-[150px]">{m.question}</span>
                                                        </a>
                                                    ))}
                                                </div>
                                             )}
                                         </div>
                                     ))
                                 ) : (
                                     <div className="text-slate-400 italic text-sm py-4">Aucune menace critique détectée.</div>
                                 )}
                             </div>
                        </div>
                    </div>
                )}


                <div className="grid grid-cols-1 xl:grid-cols-3 gap-6">
                    {/* Colonne Gauche: Bloomberg Intelligence (2/3) */}
                    <div className="xl:col-span-2 space-y-6">
                        
                        {/* Articles Grid */}
                        <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                            <h3 className="font-bold text-lg text-slate-800 mb-4 flex items-center gap-2">
                                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                Dernières Dépêches (Traduites)
                            </h3>
                            
                            {!newsData ? (
                                <div className="py-12 text-center text-slate-400">Chargement des news...</div>
                            ) : (
                                <div className="space-y-4">
                                    {newsData.items && newsData.items
                                        .sort((a,b) => (b.criticality_score||0) - (a.criticality_score||0)) // Sort by criticality
                                        .slice(0, 15).map((item, i) => (
                                        <div key={i} className={`group p-4 rounded-xl border transition-all ${
                                            (item.criticality_score || 0) >= 6 
                                                ? 'border-orange-200 bg-orange-50/30' 
                                                : 'border-slate-100 hover:border-indigo-100 hover:bg-slate-50'
                                        }`}>
                                            <div className="flex justify-between items-start gap-4">
                                                <div className="flex-1">
                                                    <div className="flex items-center gap-2 mb-1">
                                                        {/* Criticality Badge */}
                                                        {(item.criticality_score || 0) >= 6 && (
                                                            <span className="px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-orange-100 text-orange-700 flex items-center gap-1 border border-orange-200">
                                                                <Zap className="w-3 h-3" /> CRITIQUE {(item.criticality_score)}
                                                            </span>
                                                        )}
                                                        
                                                        <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${
                                                            item.sentiment_label === 'bullish' ? 'bg-emerald-100 text-emerald-700' : 
                                                            item.sentiment_label === 'bearish' ? 'bg-red-100 text-red-700' : 'bg-slate-100 text-slate-600'
                                                        }`}>
                                                            {item.sentiment_label || 'NEUTRAL'}
                                                        </span>
                                                        <span className="text-xs text-slate-400">{new Date(item.published_iso || item.published).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                                                    </div>
                                                    <a href={item.link} target="_blank" className="block font-bold text-slate-800 group-hover:text-indigo-600 transition-colors mb-2">
                                                        {item.title_fr || item.title}
                                                    </a>
                                                    <p className="text-sm text-slate-600 line-clamp-2">{item.summary_fr || item.summary || item.ai_summary}</p>
                                                    {item.ai_reasoning ? (
                                                        <div className="mt-2 text-xs text-indigo-500 italic flex items-center gap-1">
                                                            <div className="w-1 h-1 bg-indigo-500 rounded-full"></div>
                                                            IA: {item.ai_reasoning}
                                                        </div>
                                                    ) : ( isAiAnalyzing && (
                                                        <div className="mt-2 flex items-center gap-2">
                                                            <span className="w-2 h-2 bg-indigo-400 rounded-full animate-pulse"></span>
                                                            <span className="text-xs text-indigo-400 font-mono">Scanning... {scanProgress}%</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Colonne Droite: Social & Trump Feed (1/3) */}
                    <div className="xl:col-span-1 space-y-6">
                        
                        {/* Donald Trump / Truth Social Feed */}
                        <div className="bg-gradient-to-br from-[#0f172a] to-[#1e293b] rounded-2xl border border-slate-700 shadow-xl overflow-hidden flex flex-col resp-ts-feed" style={{height: 'clamp(320px, 50vh, 600px)'}}>
                            <div className="p-5 border-b border-slate-700 bg-slate-800/50 flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <div className="relative">
                                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/56/Donald_Trump_official_portrait.jpg" className="w-10 h-10 rounded-full border-2 border-red-500 object-cover" alt="DJT" />
                                        <div className="absolute -bottom-1 -right-1 bg-white rounded-full p-0.5">
                                            <img src="https://img.icons8.com/?size=100&id=p5inqTLp1xwy&format=png&color=000000" className="w-4 h-4" alt="Truth" />
                                        </div>
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-white text-sm">Donald J. Trump</h3>
                                        <p className="text-xs text-slate-400">@realDonaldTrump • Live Feed</p>
                                    </div>
                                </div>
                                <div className="w-2 h-2 bg-red-500 rounded-full animate-pulse shadow-[0_0_10px_rgba(239,68,68,0.5)]"></div>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar bg-[#0f172a]">
                                {(() => {
                                    const allSegments = newsData?.news_segments || bloombergNews?.news_segments;
                                    if (!allSegments) {
                                        return <div className="text-center py-10 text-slate-500 text-sm">Chargement du flux social...</div>;
                                    }
                                    const truthPosts = allSegments.filter(s => s.source === 'truth_social' || (s.title && (s.title.includes('TRUMP') || s.title.includes('Truth'))));
                                    if (truthPosts.length === 0) {
                                        return <div className="text-center py-10 text-slate-500 text-sm">Aucun post Truth Social disponible pour le moment.</div>;
                                    }
                                    return truthPosts.map((post, i) => (
                                            <div key={i} className="bg-slate-800/50 border border-slate-700 rounded-xl p-4 hover:bg-slate-800 transition-colors">
                                                <div className="flex items-start gap-3">
                                                    <div className="flex-1">
                                                        <div className="flex items-center gap-2 mb-1">
                                                            <span className="font-bold text-slate-200 text-sm">Donald J. Trump</span>
                                                            <img src="https://img.icons8.com/color/48/verified-account.png" className="w-3 h-3" alt="Verified" />
                                                            <span className="text-xs text-slate-500">
                                                                {post.timestamp ? new Date(post.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Live'}
                                                            </span>
                                                        </div>
                                                        <p className="text-sm text-slate-300 leading-relaxed font-sans whitespace-pre-wrap break-all mb-2">
                                                            {post.summary_fr || post.raw_text || post.ai_summary}
                                                        </p>
                                                        
                                                        {post.ai_analysis_v2 ? (
                                                            <div className={`mt-2 text-xs font-bold px-2 py-1 rounded inline-block ${
                                                                post.sentiment_label === 'bearish' ? 'bg-red-900/50 text-red-200' : 'bg-emerald-900/50 text-emerald-200'
                                                            }`}>
                                                                IMPACT: {post.sentiment_label?.toUpperCase()} ({post.criticality_score}/10)
                                                            </div>
                                                        ) : ( isAiAnalyzing && (
                                                            <div className="mt-2 flex items-center gap-2">
                                                                <span className="w-2 h-2 bg-indigo-400 rounded-full animate-pulse"></span>
                                                                <span className="text-xs text-indigo-300 font-mono">Scanning... {scanProgress}%</span>
                                                            </div>
                                                        ))}
                                                        
                                                        {/* Media: images et vidéos */}
                                                        {post.media && post.media.length > 0 && (
                                                            <div className={`mt-2 grid gap-1 ${post.media.length > 1 ? 'grid-cols-2' : 'grid-cols-1'}`}>
                                                                {post.media.map((url, mi) =>
                                                                    url && (url.endsWith('.mp4') || url.includes('/videos/') || url.includes('video')) ? (
                                                                        <video key={mi} src={url} controls muted playsInline
                                                                            className="rounded-lg w-full max-h-64 object-cover bg-black" />
                                                                    ) : url ? (
                                                                        <img key={mi} src={url} alt="media"
                                                                            className="rounded-lg w-full max-h-64 object-cover cursor-pointer"
                                                                            onClick={() => window.open(url, '_blank')} />
                                                                    ) : null
                                                                )}
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        ));
                                })()}
                            </div>
                        </div>

                    </div>
                </div>
              </div>
            )}

            {/* ─── TICKER TAPE ─── */}
            {(() => {
              const idxKeys = ['S&P_500', 'NASDAQ', 'DAX', 'CAC_40', 'Nikkei_225', 'VIX'];
              const cmdKeys = ['Gold', 'Crude_Oil_WTI', 'Silver'];
              const fxKeys  = ['EUR/USD', 'GBP/USD'];
              const labelMap = {
                'S&P_500': 'S&P 500', 'NASDAQ': 'NASDAQ', 'DAX': 'DAX',
                'CAC_40': 'CAC 40', 'Nikkei_225': 'Nikkei', 'VIX': 'VIX',
                'Gold': 'Or \u00df', 'Crude_Oil_WTI': 'Pétrole', 'Silver': 'Argent',
                'EUR/USD': 'EUR/USD', 'GBP/USD': 'GBP/USD'
              };
              const items = [];

              // Indices
              if (globalMarketData && globalMarketData.indices) {
                idxKeys.forEach(k => {
                  const d = globalMarketData.indices[k];
                  if (d && !d.error && d.price != null) {
                    const pct = d.change_pct ?? 0;
                    const positive = k === 'VIX' ? pct < 0 : pct >= 0;
                    items.push({ label: labelMap[k] || k.replace(/_/g,' '), value: Number(d.price).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}), pct, positive, isPortfolio: false });
                  }
                });
              }

              // Commodities
              if (globalMarketData && globalMarketData.commodities) {
                cmdKeys.forEach(k => {
                  const d = globalMarketData.commodities[k];
                  if (d && !d.error && d.price != null) {
                    const pct = d.change_pct ?? 0;
                    items.push({ label: labelMap[k] || k, value: Number(d.price).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}), pct, positive: pct >= 0, isPortfolio: false });
                  }
                });
              }

              // Forex
              if (globalMarketData && globalMarketData.forex) {
                fxKeys.forEach(k => {
                  const d = globalMarketData.forex[k];
                  if (d && !d.error && d.rate != null) {
                    const chg = d.change ?? 0;
                    items.push({ label: k, value: Number(d.rate).toFixed(4), pct: chg, positive: chg >= 0, isPortfolio: false });
                  }
                });
              }

              // Portfolio positions
              if (portfolioMetrics && portfolioMetrics.positions) {
                portfolioMetrics.positions.forEach(p => {
                  const lbl = p.ticker || (p.name ? p.name.split(' ')[0].substring(0,8).toUpperCase() : '—');
                  const pct = p.pnlPercent ?? 0;
                  if (p.currentPrice != null) {
                    items.push({ label: lbl, value: Number(p.currentPrice).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}), pct, positive: pct >= 0, isPortfolio: true });
                  }
                });
              }

              if (items.length === 0) return null;

              const doubled = [...items, ...items];

              return (
                <div className="fixed bottom-0 left-0 right-0 z-50 bg-[#1e293b] border-t border-[#cb3c1d]/50 overflow-hidden flex items-center select-none" style={{height:'34px'}}>
                  {/* Badge LIVE */}
                  <div className="flex-shrink-0 flex items-center gap-1.5 px-3 bg-[#cb3c1d] self-stretch z-10">
                    <span className="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                    <span className="text-white text-[10px] font-bold uppercase tracking-widest font-mono">LIVE</span>
                  </div>
                  {/* Scrolling strip */}
                  <div className="overflow-hidden flex-1 h-full relative">
                    <div className="ticker-tape h-full">
                      {doubled.map((item, i) => (
                        <span key={i} className="inline-flex items-center gap-1.5 px-3 h-full border-r border-slate-700/50 flex-shrink-0">
                          {item.isPortfolio && (
                            <span className="w-1 h-1 rounded-full bg-[#cb3c1d] flex-shrink-0"></span>
                          )}
                          <span className="text-slate-400 text-[11px] font-mono tracking-wide">{item.label}</span>
                          <span className="text-white text-[11px] font-mono font-semibold">{item.value}</span>
                          <span className={`text-[10px] font-mono font-bold ${item.positive ? 'text-emerald-400' : 'text-red-400'}`}>
                            {item.positive ? '▲' : '▼'}{Math.abs(item.pct ?? 0).toFixed(2)}%
                          </span>
                        </span>
                      ))}
                    </div>
                  </div>
                </div>
              );
            })()}


          </div>
        </div>
      );
    };

    const LoadingScreen = ({ status }) => {
      if (!status) return null;
      
      const steps = status.steps || {};
      const orderedSteps = ['database', 'wallet', 'rss', 'insiders', 'forex', 'sector_trends', 'forecasts'];
      
      return (
        <div className="fixed inset-0 bg-slate-50 z-50 flex flex-col items-center justify-center font-sans">
            <div className="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
                <div className="flex justify-center mb-8 relative">
                    <div className="modern-loader">
                        <div className="loader-core"></div>
                    </div>
                </div>
                
                <h2 className="text-2xl font-bold text-center text-slate-800 mb-2">Chargement du Terminal</h2>
                <p className="text-slate-500 text-center mb-8 text-sm">Synchronisation des données...</p>
                
                <div className="space-y-3">
                    {orderedSteps.map(key => {
                        const step = steps[key];
                        if (!step) return null;
                        
                        let icon = <div className="w-2 h-2 rounded-full bg-slate-300"></div>;
                        let colorClass = "text-slate-500";
                        let statusText = "En attente...";
                        let bgClass = "bg-slate-50 border-slate-100";
                        
                        if (step.status === 'running') {
                            icon = <div className="w-4 h-4 rounded-full border-2 border-indigo-500 border-t-transparent animate-spin"></div>;
                            colorClass = "text-indigo-600 font-medium";
                            statusText = "En cours...";
                            bgClass = "bg-indigo-50 border-indigo-100";
                        } else if (step.status === 'success') {
                            icon = <svg className="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>;
                            colorClass = "text-emerald-600";
                            statusText = "Terminé";
                            bgClass = "bg-emerald-50/50 border-emerald-100";
                        } else if (step.status === 'error') {
                            icon = <svg className="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>;
                            colorClass = "text-red-600";
                            statusText = "Erreur";
                            bgClass = "bg-red-50 border-red-100";
                        }
                        
                        return (
                            <div key={key} className={`flex items-center justify-between p-3 rounded-lg border transition-colors ${bgClass}`}>
                                <div className="flex items-center gap-3">
                                    <div className="w-6 flex justify-center items-center">{icon}</div>
                                    <span className={`text-sm ${colorClass}`}>{step.label}</span>
                                </div>
                                <span className="text-xs text-slate-400 font-mono hidden sm:block">{statusText}</span>
                            </div>
                        );
                    })}
                </div>
            </div>
        </div>
      );
    };


    // --------------- AUTOMATIC NEWS REFRESHER -------------------
    // Defined OUTSIDE of components to avoid re-creation issues
    const NewsRefresher = memo(({ onRefresh, onStart, onEnd, onProgress }) => {
        // Use refs so callbacks are always up-to-date without re-triggering the effect
        const onRefreshRef = useRef(onRefresh);
        const onStartRef   = useRef(onStart);
        const onEndRef     = useRef(onEnd);
        const onProgressRef = useRef(onProgress);
        useEffect(() => { onRefreshRef.current   = onRefresh;   }, [onRefresh]);
        useEffect(() => { onStartRef.current     = onStart;     }, [onStart]);
        useEffect(() => { onEndRef.current       = onEnd;       }, [onEnd]);
        useEffect(() => { onProgressRef.current  = onProgress;  }, [onProgress]);

        // Shared running flag via ref so concurrent invocations are blocked
        const isRunning = useRef(false);

        useEffect(() => {
            const fetchNewsLoop = async () => {
                if (isRunning.current) return;
                isRunning.current = true;

                if (onStartRef.current) onStartRef.current();

                try {
                    let done = false;
                    while (!done) {
                        const response = await fetch(API_BASE + '/api/news/analyze-sentiment', { method: 'POST' });
                        const result = await response.json();

                        if (result.status === 'success') {
                            if (result.data && onRefreshRef.current) onRefreshRef.current(result.data);
                            if (onProgressRef.current && result.progress_pct !== undefined) onProgressRef.current(result.progress_pct);

                            if (result.remaining_count > 0 && result.analyzed_count > 0) {
                                // Wait between batches to avoid overloading the server
                                await new Promise(r => setTimeout(r, 3000));
                            } else {
                                done = true;
                            }
                        } else {
                            done = true;
                        }
                    }
                } catch (e) {
                    console.error("News loop error", e);
                } finally {
                    isRunning.current = false;
                    if (onEndRef.current) onEndRef.current();
                }
            };

            // First call immediately
            fetchNewsLoop();

            // Then every 5 minutes (300 000 ms)
            const interval = setInterval(fetchNewsLoop, 300000);
            return () => clearInterval(interval);
        }, []); // Run only once on mount

        return null;
    });

    /* =====================================================================
       ACCOUNT SETTINGS MODAL — GitHub token, password change
    ===================================================================== */
    const AccountSettingsModal = ({ onClose }) => {
        const [form, setForm] = React.useState({ github_token: '', new_password: '', confirm_password: '' });
        const [loading, setLoading] = React.useState(false);
        const [msg, setMsg] = React.useState({ type: '', text: '' });

        const update = (k, v) => setForm(prev => ({ ...prev, [k]: v }));

        const handleSave = async (e) => {
            e.preventDefault();
            if (form.new_password && form.new_password !== form.confirm_password) {
                setMsg({ type: 'error', text: 'Les mots de passe ne correspondent pas.' });
                return;
            }
            setLoading(true);
            setMsg({ type: '', text: '' });
            try {
                const body = {};
                if (form.github_token) body.github_token = form.github_token;
                if (form.new_password) body.new_password = form.new_password;
                const res = await fetch(API_BASE + '/api/auth/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(body),
                });
                const data = await res.json();
                if (res.ok && data.status === 'ok') {
                    setMsg({ type: 'ok', text: 'Paramètres sauvegardés !' });
                    setForm({ github_token: '', new_password: '', confirm_password: '' });
                } else {
                    setMsg({ type: 'error', text: data.message || 'Erreur inconnue' });
                }
            } catch (err) {
                setMsg({ type: 'error', text: 'Erreur réseau' });
            } finally {
                setLoading(false);
            }
        };

        return (
            <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm"
                 onClick={e => e.target === e.currentTarget && onClose()}>
                <div style={{ width: '100%', maxWidth: 440, background: '#fff', borderRadius: 16, boxShadow: '0 25px 50px rgba(0,0,0,.2)' }} className="m-4 p-8">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-xl font-bold text-slate-900">Paramètres du compte</h2>
                        <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><X className="w-5 h-5"/></button>
                    </div>

                    <form onSubmit={handleSave} className="space-y-5">
                        {/* GitHub Token */}
                        <div>
                            <label className="block text-sm font-semibold text-slate-700 mb-1">Token GitHub (Claude AI)</label>
                            <input type="password" value={form.github_token} onChange={e => update('github_token', e.target.value)}
                                placeholder="ghp_xxxxxxxxxxxx — laisser vide pour ne pas changer"
                                className="w-full border border-slate-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                            />
                            <p className="text-xs text-slate-400 mt-1">
                                Classic PAT depuis <a href="https://github.com/settings/tokens" target="_blank" rel="noreferrer" className="text-blue-500 hover:underline">github.com/settings/tokens</a> (aucun scope requis)
                            </p>
                        </div>

                        <hr className="border-slate-100"/>

                        {/* Change password */}
                        <div>
                            <label className="block text-sm font-semibold text-slate-700 mb-1">Nouveau mot de passe</label>
                            <input type="password" value={form.new_password} onChange={e => update('new_password', e.target.value)}
                                placeholder="Laisser vide pour ne pas changer"
                                className="w-full border border-slate-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                            />
                        </div>
                        {form.new_password && (
                            <div>
                                <label className="block text-sm font-semibold text-slate-700 mb-1">Confirmer le mot de passe</label>
                                <input type="password" value={form.confirm_password} onChange={e => update('confirm_password', e.target.value)}
                                    placeholder="••••••••" required
                                    className="w-full border border-slate-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                                />
                            </div>
                        )}

                        {msg.text && (
                            <div className={`text-sm p-3 rounded-lg ${msg.type === 'ok' ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-600'}`}>
                                {msg.text}
                            </div>
                        )}

                        <button type="submit" disabled={loading}
                            className="w-full bg-slate-900 text-white rounded-lg py-3 font-semibold hover:bg-slate-800 disabled:opacity-50 transition-colors">
                            {loading ? 'Sauvegarde...' : 'Sauvegarder'}
                        </button>
                    </form>
                </div>
            </div>
        );
    };

    /* =====================================================================
       AUTH GATE — Login / Register screen shown when not authenticated
    ===================================================================== */
    const AuthGate = ({ onAuthenticated }) => {
        const [mode, setMode] = React.useState('login'); // 'login' | 'register'
        const [form, setForm] = React.useState({ username: '', password: '', confirmPassword: '', github_token: '' });
        const [loading, setLoading] = React.useState(false);
        const [error, setError] = React.useState('');

        const update = (k, v) => setForm(prev => ({ ...prev, [k]: v }));

        const handleSubmit = async (e) => {
            e.preventDefault();
            setError('');
            if (mode === 'register' && form.password !== form.confirmPassword) {
                setError('Les mots de passe ne correspondent pas.');
                return;
            }
            setLoading(true);
            try {
                const endpoint = mode === 'login' ? '/api/auth/login' : '/api/auth/register';
                const body = mode === 'login'
                    ? { username: form.username, password: form.password }
                    : { username: form.username, password: form.password, github_token: form.github_token };
                const res = await fetch(API_BASE + endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(body),
                });
                const data = await res.json();
                if (res.ok && data.status === 'ok') {
                    onAuthenticated(data);
                } else {
                    setError(data.message || 'Erreur inconnue');
                }
            } catch (err) {
                setError('Erreur réseau — le serveur est-il démarré ?');
            } finally {
                setLoading(false);
            }
        };

        return (
            <div style={{ minHeight: '100vh', background: 'linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0f172a 100%)' }}
                 className="flex items-center justify-center">
                <div style={{ width: '100%', maxWidth: 420 }} className="m-4">
                    {/* Logo / Title */}
                    <div className="text-center mb-8">
                        <div style={{ fontSize: 36 }}>💰</div>
                        <h1 style={{ color: '#f1f5f9', fontWeight: 800, fontSize: 24, letterSpacing: '-0.5px' }} className="mt-2">
                            Generational Wealth
                        </h1>
                        <p style={{ color: '#64748b', fontSize: 13 }} className="mt-1">Terminal Financier</p>
                    </div>

                    {/* Card */}
                    <div style={{ background: '#1e293b', border: '1px solid #334155', borderRadius: 16 }} className="p-8">
                        {/* Toggle */}
                        <div style={{ background: '#0f172a', borderRadius: 10, padding: 4 }} className="flex mb-6">
                            {['login', 'register'].map(m => (
                                <button key={m} onClick={() => { setMode(m); setError(''); }}
                                    style={{
                                        flex: 1, borderRadius: 8, padding: '8px 0', fontSize: 13, fontWeight: 600,
                                        background: mode === m ? '#3b82f6' : 'transparent',
                                        color: mode === m ? '#fff' : '#64748b',
                                        border: 'none', cursor: 'pointer', transition: 'all .2s'
                                    }}>
                                    {m === 'login' ? 'Connexion' : 'Créer un compte'}
                                </button>
                            ))}
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label style={{ color: '#94a3b8', fontSize: 12, fontWeight: 600, textTransform: 'uppercase', letterSpacing: 1 }}>
                                    Nom d'utilisateur
                                </label>
                                <input type="text" value={form.username} onChange={e => update('username', e.target.value)}
                                    placeholder="ex: elias"
                                    required autoFocus
                                    style={{ width: '100%', marginTop: 4, background: '#0f172a', border: '1px solid #334155',
                                             borderRadius: 8, padding: '10px 14px', color: '#f1f5f9', fontSize: 14,
                                             outline: 'none', boxSizing: 'border-box' }}
                                />
                            </div>
                            <div>
                                <label style={{ color: '#94a3b8', fontSize: 12, fontWeight: 600, textTransform: 'uppercase', letterSpacing: 1 }}>
                                    Mot de passe
                                </label>
                                <input type="password" value={form.password} onChange={e => update('password', e.target.value)}
                                    placeholder="••••••••" required
                                    style={{ width: '100%', marginTop: 4, background: '#0f172a', border: '1px solid #334155',
                                             borderRadius: 8, padding: '10px 14px', color: '#f1f5f9', fontSize: 14,
                                             outline: 'none', boxSizing: 'border-box' }}
                                />
                            </div>
                            {mode === 'register' && (
                                <>
                                    <div>
                                        <label style={{ color: '#94a3b8', fontSize: 12, fontWeight: 600, textTransform: 'uppercase', letterSpacing: 1 }}>
                                            Confirmer le mot de passe
                                        </label>
                                        <input type="password" value={form.confirmPassword} onChange={e => update('confirmPassword', e.target.value)}
                                            placeholder="••••••••" required
                                            style={{ width: '100%', marginTop: 4, background: '#0f172a', border: '1px solid #334155',
                                                     borderRadius: 8, padding: '10px 14px', color: '#f1f5f9', fontSize: 14,
                                                     outline: 'none', boxSizing: 'border-box' }}
                                        />
                                    </div>
                                    <div>
                                        <label style={{ color: '#94a3b8', fontSize: 12, fontWeight: 600, textTransform: 'uppercase', letterSpacing: 1 }}>
                                            Token GitHub (pour l'IA) <span style={{ color: '#475569', fontWeight: 400, textTransform: 'none' }}>— optionnel</span>
                                        </label>
                                        <input type="password" value={form.github_token} onChange={e => update('github_token', e.target.value)}
                                            placeholder="ghp_xxxxxxxxxxxxxxxxxxxx"
                                            style={{ width: '100%', marginTop: 4, background: '#0f172a', border: '1px solid #334155',
                                                     borderRadius: 8, padding: '10px 14px', color: '#f1f5f9', fontSize: 14,
                                                     outline: 'none', boxSizing: 'border-box' }}
                                        />
                                        <p style={{ color: '#475569', fontSize: 11, marginTop: 4 }}>
                                            Classic PAT depuis github.com/settings/tokens — nécessaire pour l'analyse Claude AI
                                        </p>
                                    </div>
                                </>
                            )}

                            {error && (
                                <div style={{ background: '#450a0a', border: '1px solid #7f1d1d', borderRadius: 8,
                                              color: '#fca5a5', padding: '10px 14px', fontSize: 13 }}>
                                    {error}
                                </div>
                            )}

                            <button type="submit" disabled={loading}
                                style={{ width: '100%', background: loading ? '#1d4ed8' : 'linear-gradient(135deg, #3b82f6, #1d4ed8)',
                                         color: '#fff', border: 'none', borderRadius: 10, padding: '12px 0',
                                         fontSize: 15, fontWeight: 700, cursor: loading ? 'not-allowed' : 'pointer',
                                         transition: 'all .2s', marginTop: 8 }}>
                                {loading ? '...' : mode === 'login' ? 'Se connecter' : 'Créer le compte'}
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        );
    };

    const RootApp = () => {
        const [loadingStatus, setLoadingStatus] = useState(null);
        const [isAppReady, setIsAppReady] = useState(false);
        const [authUser, setAuthUser] = React.useState(null);   // null = unknown, false = not authed, obj = authed
        const [authChecked, setAuthChecked] = React.useState(false);
        const [error, setError] = useState(null);

        // Check auth status first
        useEffect(() => {
            fetch(API_BASE + '/api/auth/status', { credentials: 'include' })
                .then(r => r.json())
                .then(data => {
                    if (data.status === 'authenticated') {
                        setAuthUser({ username: data.username, is_admin: data.is_admin });
                    } else {
                        setAuthUser(false);
                    }
                })
                .catch(() => setAuthUser(false))
                .finally(() => setAuthChecked(true));
        }, []);

        useEffect(() => {
            if (!authChecked || authUser === false) return;
            let isMounted = true;
            const pollLoading = async () => {
                 if (isAppReady) return;
                 try {
                     const res = await fetch(API_BASE + '/api/loading/status', { credentials: 'include' });
                     if (res.ok) {
                         const status = await res.json();
                         if (isMounted) {
                             setLoadingStatus(status);
                             if (status.complete) {
                                  setTimeout(() => {
                                      if (isMounted) setIsAppReady(true);
                                  }, 1000);
                             } else {
                                  setTimeout(pollLoading, 800);
                             }
                         }
                     } else {
                         throw new Error('Status fetch failed');
                     }
                 } catch (e) {
                     console.error("Loading check error:", e);
                     if (isMounted) {
                        setTimeout(pollLoading, 2000);
                     }
                 }
            };
            pollLoading();
            return () => { isMounted = false; };
        }, [isAppReady, authChecked, authUser]);

        // Not yet checked
        if (!authChecked) {
            return (
                <div style={{ minHeight: '100vh', background: '#0f172a', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    <div style={{ color: '#64748b', fontSize: 14 }}>Chargement...</div>
                </div>
            );
        }

        // Not authenticated
        if (authUser === false) {
            return <AuthGate onAuthenticated={(data) => setAuthUser({ username: data.username, is_admin: data.is_admin })} />;
        }

        if (!isAppReady) {
            return <LoadingScreen status={loadingStatus} />;
        }

        return <FinancialTerminal authUser={authUser} onLogout={() => {
            fetch(API_BASE + '/api/auth/logout', { method: 'POST', credentials: 'include' });
            setAuthUser(false);
            setIsAppReady(false);
        }} />;
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<RootApp />);
  </script>
</body>
</html>
