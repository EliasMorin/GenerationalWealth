                  if (a.action === 'fetch_options') return `${c.ticker}: prix ${c.current_price}, sentiment ${c.sentiment}, PCR ${c.put_call_ratio_volume}`;
                  if (a.action === 'fetch_insiders') return `${c.ticker}: ${c.total} transactions, ${c.recent_7days} récents.`;
                  if (a.action === 'fetch_calendar') return `Prochain événement: ${c.next_event ? `${c.next_event.title} (${c.next_event.date}) impact ${c.next_event.impact}` : 'N/A'}`;
                  if (a.action === 'fetch_seasonality') return `Saisonnalité: période ${c.period || 'N/A'}`;
                  return `${a.action}: résumé disponible.`;
                }).join('\n');
                setMessages(prev => [...prev, { role: 'assistant', content: parts, timestamp: new Date() }]);
              }

              // we've handled the combined request; skip the normal action-processing flow
              return;
            }

            const isPureJson = jsonObjs.length === 1 && assistantRaw.trim() === jsonObjs[0].raw;

            if (jsonObjs.length === 0) {
              // normal assistant reply -> display as-is
              const assistantMessage = { role: 'assistant', content: assistantRaw, timestamp: new Date() };
              setMessages(prev => [...prev, assistantMessage]);
            } else {
              // assistant returned one or more actions
              // If assistant included explanatory text plus JSON, display the text without the JSON blobs.
              if (!isPureJson) {
                let displayText = assistantRaw;
                for (const j of jsonObjs) displayText = displayText.replace(j.raw, '');
                displayText = displayText.trim();
                if (displayText) setMessages(prev => [...prev, { role: 'assistant', content: displayText, timestamp: new Date() }]);
              }

              // Function to compact an action result
              const makeCompactResult = (actionObj, actionResult) => {
                try {
                  if (!actionResult) return { summary: null };

                  if (actionObj.action === 'refresh_insiders') {
                    const payload = actionResult.data || actionResult;
                    const tickersProcessed = payload.tickers_processed || (payload.data ? Object.keys(payload.data) : []);
                    const dataMap = payload.data || payload;
                    const summary = { tickers_processed, tickers: {} };
                    for (const t of tickersProcessed) {
                      const info = dataMap[t] || dataMap[t.toUpperCase()] || dataMap[t.toLowerCase()] || {};
                      const allArr = info.all || [];
                      const recent = info.recent_7days || info.recent || [];
                      summary.tickers[t] = {
                        total_transactions: allArr.length,
                        recent_7days_count: recent.length,
                        recent_samples: recent.slice(0,3)
                      };
                    }
                    return { summary };
                  }

                  if (actionObj.action === 'fetch_options') {
                    const payload = actionResult.data || actionResult;
                    const d = payload.data || payload;
                    const compact = {
                      ticker: d.ticker || d.symbol || actionObj.ticker || actionObj.t,
                      current_price: d.current_price || d.last_trade || (d.metadata && d.metadata.last_trade_price) || null,
                      sentiment: d.sentiment_marche?.sentiment || (d.sentiment || null),
                      put_call_ratio_volume: d.sentiment_marche?.put_call_ratio_volume || null,
                      top_calls: (d.top_strikes_volume && d.top_strikes_volume.calls) ? d.top_strikes_volume.calls.slice(0,3) : (d.most_active_calls || []).slice(0,3),
                      top_puts: (d.top_strikes_volume && d.top_strikes_volume.puts) ? d.top_strikes_volume.puts.slice(0,3) : (d.most_active_puts || []).slice(0,3)
                    };
                    return { summary: compact };
                  }

                  // Fallback
                  return { summary: { info: 'result_present', size_hint: JSON.stringify(actionResult).length } };
                } catch (e) {
                  return { summary: null };
                }
              };

              // Execute actions sequentially and gather results
              const actionResults = [];
              for (const j of jsonObjs) {
                const actionObj = j.obj;
                try {
                  const res = await performAiAction(actionObj);
                  actionResults.push({ action: actionObj, result: res });
                } catch (e) {
                  actionResults.push({ action: actionObj, result: { error: e.message || String(e) } });
                }
              }

              // Build combined compact summary
              const compactSummaries = actionResults.map(ar => ({ action: ar.action, compact: makeCompactResult(ar.action, ar.result) }));

              // Prepare follow-up messages: include each assistant action JSON then one ACTION_RESULT_SUMMARY
              const followMessages = [ { role: 'system', content: systemPrompt }, { role: 'user', content: inputMessage } ];
              for (const ar of actionResults) followMessages.push({ role: 'assistant', content: JSON.stringify(ar.action) });
              followMessages.push({ role: 'user', content: `ACTION_RESULT_SUMMARY: ${JSON.stringify(compactSummaries)}` });

              // Send single follow-up to the model summarizing all action results
              try {
                const followData = await callGroqApi({ model: 'llama-3.3-70b-versatile', messages: followMessages, temperature: 0.7, max_tokens: 1500 });
                const followAssistant = { role: 'assistant', content: followData.choices[0].message.content, timestamp: new Date() };
                setMessages(prev => [...prev, followAssistant]);
              } catch (e) {
                // If follow-up fails, synthesize concise local reply from compacts
                try {
                  const parts = [];
                  for (const cs of compactSummaries) {
                    const a = cs.action;
                    const c = cs.compact && cs.compact.summary;
                    if (!c) continue;
                    if (a.action === 'fetch_options') {
                      const t = c.ticker || (a.ticker || a.t);
                      const price = c.current_price ?? 'N/A';
                      const sentiment = c.sentiment || 'N/A';
                      const pcr = c.put_call_ratio_volume ?? 'N/A';
                      const calls = (c.top_calls || []).slice(0,3).map(x=>`${x.strike}@${x.volume}`).join(', ') || 'N/A';
                      const puts = (c.top_puts || []).slice(0,3).map(x=>`${x.strike}@${x.volume}`).join(', ') || 'N/A';
                      parts.push(`${t}: prix actuel ${price}, sentiment ${sentiment}. PCR(vol): ${pcr}. Top calls: ${calls}. Top puts: ${puts}.`);
                    } else if ((a.action === 'fetch_insiders' || a.action === 'refresh_insiders') && c) {
                      // c.summary.tickers or direct mapping
                      const tickMap = c.summary ? c.summary.tickers : c.tickers || {};
                      for (const tk of Object.keys(tickMap)) {
                        const info = tickMap[tk];
                        const ex = (info.recent_samples || info.recent_samples || info.recent_samples || []).slice(0,3).map(e=>`${e.date} ${e.insider} ${e.transaction} ${e.shares || ''}`).join(' ; ');
                        parts.push(`${tk}: ${info.total_transactions || info.total || 0} transactions au total, ${info.recent_7days_count || info.recent_7days || 0} dans les 7 derniers jours. Exemples: ${ex || 'aucun exemple récent'}`);
                      }
                    } else {
                      parts.push(`Action ${a.action}: résultat disponible.`);
                    }
                  }
                  if (parts.length) setMessages(prev => [...prev, { role: 'assistant', content: parts.join('\n'), timestamp: new Date() }]);
                } catch (synthErr) {
                  setMessages(prev => [...prev, { role: 'assistant', content: `Erreur lors de l'exécution des actions: ${e.message || e}`, timestamp: new Date() }]);
                }
              }
            }
          } catch (error) {
            console.error('Erreur API:', error);

            // Fallback: if the user specifically requested insiders and the model API failed,
            // attempt to fetch insiders locally and present a concise assistant reply.
            try {
              const lower = inputMessage.toLowerCase();
              const asksInsiders = lower.includes('insider') || lower.includes("transactions d'insider") || lower.includes('insiders');
              const asksOptions = lower.includes('option') || lower.includes('options') || lower.includes("chaîne d'options") || lower.includes('options de');
              const asksNextEvent = (lower.includes('prochain') || lower.includes('prochaine')) && (lower.includes('év') || lower.includes('événement') || lower.includes('evenement') || lower.includes('event'));

              // If the user asked for the next event, answer from local context immediately
              if (asksNextEvent) {
                try {
                  const ctx = buildContextData();
                  // Prefer forexEvents (calendar) then seasonality calendar
                  const fe = ctx.forexEvents || [];
                  if (fe && fe.length > 0) {
                    // assume list ordered by date; show first non-empty
                    const ev = fe[0];
                    const line = `${ev.title || ev.event || 'Événement'} — ${ev.country || ''} — ${ev.date || ''} — impact: ${ev.impact || 'N/A'}`;
                    setMessages(prev => [...prev, { role: 'assistant', content: `Prochain événement: ${line}`, timestamp: new Date() }]);
                    setIsLoading(false);
                    return;
                  }

                  // Fallback to seasonality/calendar summary if present
                  const cal = ctx.calendar;
                  if (cal && cal.period) {
                    const idxs = cal.indices || [];
                    const idx = idxs[0] || 'S&P 500';
                    const best = (cal.best_months && cal.best_months[idx]) ? cal.best_months[idx].slice(0,2).join(', ') : null;
                    const msg = `Calendrier (${cal.period}) — Indice: ${idx}. Meilleurs mois: ${best || 'N/A'}.`;
                    setMessages(prev => [...prev, { role: 'assistant', content: msg, timestamp: new Date() }]);
                    setIsLoading(false);
                    return;
                  }

                  // Nothing local — respond with missing data marker
                  setMessages(prev => [...prev, { role: 'assistant', content: 'Données manquantes: calendar_summary', timestamp: new Date() }]);
                  setIsLoading(false);
                  return;
                } catch (e) {
                  console.warn('Next event fallback failed', e);
                }
              }

              // Prefer handling options requests first if both keywords appear
              if (asksOptions) {
                // extract ticker(s) from the message
                let tickers = [];
                const mOpt = inputMessage.match(/options?\s*(?:de|pour)?\s*([A-Za-z0-9,\s]+)/i);
                if (mOpt && mOpt[1]) {
                  tickers = mOpt[1].split(/[,\s]+/).map(s => s.trim()).filter(Boolean).map(t => t.toUpperCase());
                }
                if (tickers.length === 0) {
                  const tokens = inputMessage.match(/\b([A-Z]{2,5})\b/g);
                  if (tokens) tickers = tokens.map(t => t.toUpperCase());
                }

                if (tickers.length > 0) {
                  const parts = [];
                  for (const tk of tickers) {
                    try {
                      const actionRes = await performAiAction({ action: 'fetch_options', ticker: tk });
                      const payload = actionRes && (actionRes.data || actionRes);
                      if (payload) {
                        const d = payload.data || payload;
                        const tickerName = d.ticker || tk;
                        const price = d.current_price || d.last_trade || (d.metadata && d.metadata.last_trade_price) || 'N/A';
                        const sentiment = d.sentiment_marche?.sentiment || d.sentiment || 'N/A';
                        const emoji = d.sentiment_marche?.emoji || '';
                        const pcr = d.sentiment_marche?.put_call_ratio_volume ?? d.put_call_ratio_volume ?? 'N/A';
                        const topCallsArr = (d.top_strikes_volume && d.top_strikes_volume.calls) ? d.top_strikes_volume.calls : (d.most_active_calls || []);
                        const topPutsArr = (d.top_strikes_volume && d.top_strikes_volume.puts) ? d.top_strikes_volume.puts : (d.most_active_puts || []);
                        const topCalls = topCallsArr.slice(0,3).map(c => `${c.strike}@${c.volume}`).join(', ') || 'N/A';
                        const topPuts = topPutsArr.slice(0,3).map(p => `${p.strike}@${p.volume}`).join(', ') || 'N/A';

                        parts.push(`${tickerName}: prix actuel ${price}, sentiment ${sentiment} ${emoji}. PCR(vol): ${pcr}. Top calls: ${topCalls}. Top puts: ${topPuts}.`);
                      } else {
                        parts.push(`${tk}: pas de données options disponibles.`);
                      }
                    } catch (e) {
                      parts.push(`${tk}: erreur récupération options.`);
                    }
                  }
                  const assistantMessage = { role: 'assistant', content: parts.join('\n'), timestamp: new Date() };
                  setMessages(prev => [...prev, assistantMessage]);
                  setIsLoading(false);
                  return;
                }
              }

              if (asksInsiders) {
                // try to extract ticker(s) from the message: look for patterns like "insiders de AAPL" or standalone uppercase tickers
                let tickers = [];
                const m = inputMessage.match(/insiders?\s*(?:de|pour)?\s*([A-Za-z0-9,\s]+)/i);
                if (m && m[1]) {
                  tickers = m[1].split(/[,\s]+/).map(s => s.trim()).filter(Boolean).map(t => t.toUpperCase());
                }
                // fallback: extract any uppercase symbol-like tokens (2-5 letters)
                if (tickers.length === 0) {
                  const tokens = inputMessage.match(/\b([A-Z]{2,5})\b/g);
                  if (tokens) tickers = tokens.map(t => t.toUpperCase());
                }

                if (tickers.length > 0) {
                  const actionRes = await performAiAction({ action: 'fetch_insiders', tickers });
                  if (actionRes && actionRes.summary) {
                    // build human-friendly message using the summary
                    const parts = [];
                    for (const t of Object.keys(actionRes.summary)) {
                      const s = actionRes.summary[t];
                      if (!s.found) {
                        parts.push(`${t}: pas de données trouvées.`);
                      } else {
                        const ex = (s.examples || []).map(e => `${e.date} ${e.insider} ${e.transaction} ${e.shares || ''}`).join(' ; ');
                        parts.push(`${t}: ${s.total} transactions au total, ${s.recent_7days} dans les 7 derniers jours. Exemples: ${ex || 'aucun exemple récent'}`);
                      }
                    }
                    const assistantMessage = { role: 'assistant', content: parts.join('\n'), timestamp: new Date() };
                    setMessages(prev => [...prev, assistantMessage]);
                    setIsLoading(false);
                    return;
                  }
                }
              }
            } catch (fallbackErr) {
              console.warn('Fallback insiders fetch failed', fallbackErr);
            }

            const errorMessage = {
              role: 'assistant',
              content: 'Désolé, une erreur s\'est produite lors de la communication avec l\'API. Veuillez réessayer.',
              timestamp: new Date()
            };
            setMessages(prev => [...prev, errorMessage]);
          } finally {
            setIsLoading(false);
          }
        };

        const handleKeyPress = (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSendMessage();
          }
        };

        if (!isOpen) return null;

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4 animate-in fade-in duration-200">
            <div className="w-full max-w-4xl h-[90vh] md:h-[85vh] bg-white border border-slate-200 rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-in zoom-in-95 duration-200 resp-chat-modal">
              {/* En-tête */}
              <div className="bg-slate-50 border-b border-slate-200 p-4 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-500 to-indigo-600 flex items-center justify-center shadow-md shadow-indigo-200">
                    <Sparkles className="w-6 h-6 text-white" />
                  </div>
                  <div>
                    <h3 className="text-lg font-bold text-slate-800">Assistant AI</h3>
                    <p className="text-xs text-slate-500">Analyse financière intelligente</p>
                  </div>
                </div>
                <button 
                  onClick={onClose}
                  className="p-2 hover:bg-slate-200 rounded-lg transition-colors group"
                >
                  <X className="w-5 h-5 text-slate-400 group-hover:text-slate-600" />
                </button>
              </div>

              {/* Messages */}
              <div className="flex-1 overflow-y-auto p-6 space-y-6 bg-slate-50/50">
                {messages.map((message, idx) => (
                  <div 
                    key={idx} 
                    className={`flex ${message.role === 'user' ? 'justify-end' : 'justify-start'}`}
                  >
                    <div className={`max-w-[85%] ${
                      message.role === 'user' 
                        ? 'bg-indigo-50 border border-indigo-200 rounded-2xl rounded-tr-sm shadow-sm' 
                        : 'bg-white border border-slate-200 rounded-2xl rounded-tl-sm shadow-sm'
                    } p-4`}>
                      {message.role === 'assistant' && (
                        <div className="flex items-center gap-2 mb-2 border-b border-slate-100 pb-2">
                          <Sparkles className="w-4 h-4 text-indigo-500" />
                          <span className="text-xs font-semibold text-indigo-700">AI Assistant</span>
                        </div>
                      )}
                      <p className="text-sm text-slate-700 whitespace-pre-wrap leading-relaxed">
                        {message.content}
                      </p>
                      <div className="text-xs text-slate-400 mt-2 text-right">
                        {message.timestamp.toLocaleTimeString('fr-FR', { 
                          hour: '2-digit', 
                          minute: '2-digit' 
                        })}
                      </div>
                    </div>
                  </div>
                ))}
                
                {isLoading && (
                  <div className="flex justify-start">
                    <div className="bg-white border border-slate-200 rounded-2xl rounded-tl-sm p-4 shadow-sm">
                      <div className="flex items-center gap-2">
                        <Sparkles className="w-4 h-4 text-indigo-400 animate-pulse" />
                        <span className="text-xs text-indigo-600">AI réfléchit...</span>
                      </div>
                      <div className="flex gap-1.5 mt-3 ml-1">
                        <div className="w-2 h-2 bg-indigo-400 rounded-full animate-bounce" style={{ animationDelay: '0ms' }}></div>
                        <div className="w-2 h-2 bg-indigo-400 rounded-full animate-bounce" style={{ animationDelay: '150ms' }}></div>
                        <div className="w-2 h-2 bg-indigo-400 rounded-full animate-bounce" style={{ animationDelay: '300ms' }}></div>
                      </div>
                    </div>
                  </div>
                )}
                
                <div ref={messagesEndRef} />
              </div>

              {/* Input */}
              <div className="border-t border-slate-200 p-4 bg-white">
                <div className="flex gap-3">
                  <div className="flex-1 relative">
                    <textarea
                      value={inputMessage}
                      onChange={(e) => setInputMessage(e.target.value)}
                      onKeyPress={handleKeyPress}
                      placeholder="Posez une question sur votre portfolio, les marchés..."
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/20 resize-none transition-all"
                      rows="2"
                      disabled={isLoading}
                    />
                    <div className="absolute right-3 bottom-3 text-[10px] text-slate-400">
                      ⏎ Entrée
                    </div>
                  </div>
                  <button
                    onClick={handleSendMessage}
                    disabled={!inputMessage.trim() || isLoading}
                    className={`px-6 rounded-xl flex items-center justify-center transition-all ${
                      inputMessage.trim() && !isLoading
                        ? 'bg-[#cb3c1d] hover:bg-[#b03419] text-white shadow-lg shadow-orange-500/20'
                        : 'bg-slate-100 text-slate-400 cursor-not-allowed border border-slate-200'
                    }`}
                  >
                    <Send className="w-6 h-6" />
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      };

      /* =============== COMPOSANT RECHERCHE OPTIONS =============== */
      const OptionsSearchForm = ({ onSearch, isLoading }) => {
        const [ticker, setTicker] = useState('GOOG');
        const [suggestions] = useState(['GOOG', 'AAPL', 'MSFT', 'NVDA', 'TSLA', 'META', 'AMZN', 'AMD']);

        const handleSubmit = (e) => {
          e.preventDefault();
          if (ticker.trim()) onSearch(ticker.trim().toUpperCase());
        };

        return (
          <div className="w-full max-w-3xl mx-auto mb-8">
            <form onSubmit={handleSubmit} className="relative group z-10">
              <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <Search className={`h-5 w-5 ${isLoading ? 'text-indigo-400 animate-pulse' : 'text-slate-400'}`} />
              </div>
              <input
                type="text"
                value={ticker}
                onChange={(e) => setTicker(e.target.value.toUpperCase())}
                placeholder="Rechercher un ticker (ex: NVDA)..."
                className="block w-full pl-12 pr-32 py-4 bg-white border border-slate-200 rounded-2xl text-lg text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#E8541E]/20 focus:border-[#E8541E] transition-all shadow-sm font-mono tracking-wide"
                disabled={isLoading}
              />
              <div className="absolute inset-y-2 right-2">
                <button
                  type="submit"
                  disabled={isLoading || !ticker.trim()}
                  className={`h-full px-6 rounded-xl font-medium transition-all flex items-center gap-2 ${
                    isLoading 
                      ? 'bg-slate-100 text-slate-400 cursor-wait' 
                      : 'bg-[#cb3c1d] hover:bg-[#b03419] text-white shadow-lg shadow-orange-500/20'
                  }`}
                >
                  {isLoading ? '...' : 'Analyser'}
                </button>
              </div>
            </form>
            
            <div className="flex flex-wrap justify-center gap-2 mt-4">
              {suggestions.map((sugg) => (
                <button
                  key={sugg}
                  onClick={() => { setTicker(sugg); onSearch(sugg); }}
                  className="px-3 py-1.5 text-xs font-medium bg-white hover:bg-slate-50 text-slate-600 hover:text-indigo-600 border border-slate-200 rounded-lg transition-all shadow-sm"
                >
                  {sugg}
                </button>
              ))}
            </div>
          </div>
        );
      };

      /* =============== COMPOSANT AFFichage DERIVES (INTÉGRÉ) =============== */
      const DerivativesList = ({ derivatives, name, isin }) => {
        const categories = Object.keys(derivatives);
        if (categories.length === 0) return null;

        return (
          <div className="grid grid-cols-1 gap-4 h-full">
            {categories.map((category) => {
              const items = derivatives[category] || [];
              if (items.length === 0) return null;

              // Trier par levier décroissant
              const sortedItems = [...items].sort((a, b) => {
                const levA = parseFloat(a.tags?.find(t => t.type === 'leverage')?.value || 0);
                const levB = parseFloat(b.tags?.find(t => t.type === 'leverage')?.value || 0);
                return levB - levA;
              });

              const isTurbo = category === 'Turbos';

              return (
                <div key={category} className="bg-white border border-slate-200 rounded-2xl overflow-hidden flex flex-col shadow-sm">
                  <div className="px-4 py-3 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
                    <div className="flex items-center gap-2">
                      <span className={`text-lg ${isTurbo ? 'text-indigo-400' : 'text-pink-400'}`}>
                        {isTurbo ? '🚀' : '✖️'}
                      </span>
                      <h4 className="font-bold text-slate-800 text-sm">{category}</h4>
                    </div>
                    <span className="text-[10px] bg-slate-100 px-2 py-0.5 rounded text-slate-500 border border-slate-200">
                      {items.length}
                    </span>
                  </div>
                  
                  <div className="overflow-y-auto custom-scrollbar max-h-[300px] p-2 space-y-1">
                    {sortedItems.map((item, idx) => {
                      const leverageTag = item.tags?.find(t => t.type === 'leverage');
                      const optionTypeTag = item.tags?.find(t => t.type === 'optionType');
                      const strike = item.tags?.find(t => t.type === 'strike')?.value;
                      
                      const isCall = optionTypeTag?.value === 'call' || item.name.includes('Long');
                      const isPut = optionTypeTag?.value === 'put' || item.name.includes('Short');
                      const leverage = leverageTag ? parseFloat(leverageTag.value).toFixed(1) : null;
                      
                      return (
                        <a 
                          key={idx}
                          href={`https://app.traderepublic.com/instrument/${item.isin}`}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="block group relative overflow-hidden bg-slate-50 hover:bg-slate-100 border border-slate-200 hover:border-slate-300 rounded-lg p-2 transition-all"
                        >
                          <div className={`absolute left-0 top-0 bottom-0 w-0.5 ${isCall ? 'bg-emerald-500' : isPut ? 'bg-red-500' : 'bg-slate-400'}`}></div>
                          <div className="flex items-center justify-between pl-2 gap-2">
                            <div className="min-w-0">
                              <div className="flex items-center gap-1.5">
                                <span className={`text-[9px] font-bold uppercase px-1 rounded ${
                                  isCall ? 'bg-emerald-100 text-emerald-600 border border-emerald-200' : 
                                  isPut ? 'bg-red-100 text-red-600 border border-red-200' : 'bg-slate-200 text-slate-600'
                                }`}>
                                  {isCall ? 'L' : isPut ? 'S' : 'N'}
                                </span>
                                <span className="text-[10px] font-mono text-slate-500">{item.isin}</span>

          }
        }, 10000);

        try {
          const response = await fetch(API_BASE + '/api/bloomberg-live/status');

          // Si le flux s'est arrêté côté backend, mettre à jour l'UI
          if (!status.running && aiFeedEnabled) {

          const tmp = document.createElement('div');
          tmp.innerHTML = post.content || '';
          let text = tmp.textContent || tmp.innerText || '';

          if (!text.trim()) {
            const media = post.media_attachments || [];
            if (media.some(m => m.type === 'video' || m.type === 'gifv')) text = '🎥';
            else if (media.length > 0) text = '';
            else text = '[Post sans texte]';

            title: 'TRUTH SOCIAL: ' + (post.account?.display_name || 'Donald J. Trump'),
            main_title: 'TRUTH SOCIAL: ' + (post.account?.display_name || 'Donald J. Trump'),
            ai_summary: text,

        const TS_BASE = 'https://truthsocial.com';
        const TS_URL  = TS_BASE + TS_PATH;

        // Ordered list of fetch strategies
        const strategies = [
          // 1. Direct (works on residential IPs, no CORS issue since TruthSocial allows it)
          async () => {
            const r = await fetch(TS_URL, { headers: { 'Accept': 'application/json' }, signal: AbortSignal.timeout(12000) });
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
          },
          // 2. corsproxy.io
          async () => {
            const r = await fetch(`https://corsproxy.io/?${encodeURIComponent(TS_URL)}`, { signal: AbortSignal.timeout(12000) });
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
          },

            const wrapper = await r.json();
            return JSON.parse(wrapper.contents);

                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(storePosts)

                media: post.media || [],

          id: Date.now() + Math.random(),
          title,
          message,
          severity,
          timestamp: new Date(),
          read: false,
          isPopup
        };
        setNotifications(prev => [newNotif, ...prev].slice(0, 50));
        playNotificationSound();
      };

      // Vérification Horaires Marchés
      useEffect(() => {
        const checkMarketHours = () => {
          const now = new Date();
          const markets = [
            { name: "New York", timezone: "America/New_York", open: "09:30", close: "16:00" },
            { name: "Londres", timezone: "Europe/London", open: "08:00", close: "16:30" },
            { name: "Tokyo", timezone: "Asia/Tokyo", open: "09:00", close: "15:00" },
            { name: "Francfort", timezone: "Europe/Berlin", open: "09:00", close: "17:30" }
          ];

          markets.forEach(market => {
            try {
              const timeString = now.toLocaleTimeString('en-US', { 
                timeZone: market.timezone, 
                hour12: false, 
                hour: '2-digit', 
                minute: '2-digit' 
              });
              
              const dateStr = now.toLocaleDateString('en-US', { timeZone: market.timezone });
              const openKey = `${market.name}-OPEN-${dateStr}`;
              const closeKey = `${market.name}-CLOSE-${dateStr}`;

              if (timeString === market.open && !marketStatus[openKey]) {
                addNotification(
                  `🔔 Ouverture ${market.name}`,
                  `Le marché ${market.name} est maintenant OUVERT`,
                  'info',
                  true
                );
                setMarketStatus(prev => ({...prev, [openKey]: true}));
              }

              if (timeString === market.close && !marketStatus[closeKey]) {
                addNotification(
                  `🌙 Fermeture ${market.name}`,
                  `Le marché ${market.name} est maintenant FERMÉ`,
                  'info',
                  true
                );
                setMarketStatus(prev => ({...prev, [closeKey]: true}));
              }
            } catch (e) {
              console.error(`Erreur check marché ${market.name}`, e);
            }
          });
        };

        const timer = setInterval(checkMarketHours, 1000 * 60);
        checkMarketHours();
        
        return () => clearInterval(timer);
      }, [marketStatus]);

      // Vérification événements Forex
      useEffect(() => {
        if (!forexData || forexData.length === 0) return;

        const now = new Date();
        const checkInterval = setInterval(() => {
          forexData.forEach(event => {
            if (event.impact !== 'High' && event.impact !== 'Medium') return;
            
            const eventDate = new Date(event.date);
            const diffMinutes = (eventDate.getTime() - now.getTime()) / (1000 * 60);
            const eventKey = `${event.date}-${event.title}`;

            // Alerte 20 minutes avant
            if (diffMinutes <= 20 && diffMinutes > 19 && !checkedEvents.has(`${eventKey}-20`)) {
              addNotification(
                `⏰ Événement ${event.impact} dans 20 minutes`,
                `${event.country} - ${event.title}`,
                event.impact === 'High' ? 'high' : 'medium'
              );
              setCheckedEvents(prev => new Set([...prev, `${eventKey}-20`]));
            }

            // Alerte 5 minutes avant
            if (diffMinutes <= 5 && diffMinutes > 4 && !checkedEvents.has(`${eventKey}-5`)) {
              addNotification(
                `🚨 Événement ${event.impact} dans 5 minutes!`,
                `${event.country} - ${event.title}`,
                'critical'
              );
              setCheckedEvents(prev => new Set([...prev, `${eventKey}-5`]));
            }
          });
        }, 30000); // Vérifier toutes les 30 secondes

        return () => clearInterval(checkInterval);
      }, [forexData, checkedEvents]);

      // Vérification nouveaux insiders
      useEffect(() => {
        if (!insiderData || !portfolioTickers || portfolioTickers.size === 0) return;

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        portfolioTickers.forEach(ticker => {
          const tickerData = insiderData[ticker];
          if (!tickerData?.recent7days) return;

          tickerData.recent7days.forEach(tx => {
            if (!tx.date || tx.transaction === 'Proposed Sale') return;

            const dateMatch = tx.date.match(/^([A-Za-z]{3})\s(\d{2})\s'(\d{2})$/);
            if (!dateMatch) return;

            const monthMap = {
              'Jan': 0, 'Feb': 1, 'Mar': 2, 'Apr': 3, 'May': 4, 'Jun': 5,
              'Jul': 6, 'Aug': 7, 'Sep': 8, 'Oct': 9, 'Nov': 10, 'Dec': 11
            };

            const txDate = new Date(
              2000 + parseInt(dateMatch[3]),
              monthMap[dateMatch[1]],
              parseInt(dateMatch[2])
            );
            txDate.setHours(0, 0, 0, 0);

            const insiderKey = `${ticker}-${tx.date}-${tx.insider}-${tx.transaction}`;

            if (txDate.getTime() === today.getTime() && !checkedInsiders.has(insiderKey)) {
              const isBuy = tx.transaction === 'Buy';
              addNotification(
                `📊 Nouveau mouvement insider: ${ticker}`,
                `${tx.insider} (${tx.relationship}) - ${tx.transaction} ${tx.shares?.toLocaleString('fr-FR')} actions à $${tx.cost?.toFixed(2)}`,
                isBuy ? 'high' : 'medium'
              );
              setCheckedInsiders(prev => new Set([...prev, insiderKey]));
            }
          });
        });
      }, [insiderData, portfolioTickers, checkedInsiders]);

      // Vérification niveaux anormaux options - MODIFIÉ POUR PORTFOLIO UNIQUEMENT
      useEffect(() => {
        if (!optionsData || !optionsData.sentiment_marche || !optionsData.ticker) return;
        
        // NOUVEAU: Vérifier si le ticker fait partie du portfolio
        const isInPortfolio = portfolioTickers && portfolioTickers.has(optionsData.ticker);
        if (!isInPortfolio) return; // Ne notifier que pour les tickers du portfolio

        const checkOptionsAnomalies = () => {
          const { put_call_ratio_volume } = optionsData.sentiment_marche;
          const ticker = optionsData.ticker;
          
          // Clés uniques pour éviter les doublons
          const highPutsKey = `${ticker}-high-puts-${put_call_ratio_volume.toFixed(2)}`;
          const highCallsKey = `${ticker}-high-calls-${put_call_ratio_volume.toFixed(2)}`;
          const unusualKey = `${ticker}-unusual-${optionsData.activite_inhabituelle?.calls?.length || 0}-${optionsData.activite_inhabituelle?.puts?.length || 0}`;
          const institutionalKey = `${ticker}-institutional-${optionsData.flux_institutionnels?.expiration_dominante}`;
          
          // Put/Call ratio très élevé (>2)
          if (put_call_ratio_volume > 2 && !lastOptionsCheck.has(highPutsKey)) {
            addNotification(
              `⚠️ Activité anormale sur les PUTS - ${ticker}`,
              `Ratio P/C volume: ${put_call_ratio_volume.toFixed(2)} - Sentiment très baissier détecté`,
              'high'
            );
            setLastOptionsCheck(prev => new Set([...prev, highPutsKey]));
          } 
          // Put/Call ratio très bas (<0.5)
          else if (put_call_ratio_volume < 0.5 && !lastOptionsCheck.has(highCallsKey)) {
            addNotification(
              `⚠️ Activité anormale sur les CALLS - ${ticker}`,
              `Ratio P/C volume: ${put_call_ratio_volume.toFixed(2)} - Sentiment très haussier détecté`,
              'high'
            );
            setLastOptionsCheck(prev => new Set([...prev, highCallsKey]));
          }

          // Activité inhabituelle détectée
          if (optionsData.activite_inhabituelle) {
            const totalUnusual = (optionsData.activite_inhabituelle.calls?.length || 0) + 
                                (optionsData.activite_inhabituelle.puts?.length || 0);
            
            if (totalUnusual >= 5 && !lastOptionsCheck.has(unusualKey)) {
              addNotification(
                `🔥 Activité inhabituelle détectée - ${ticker}`,
                `${totalUnusual} strikes avec volume > open interest`,
                'high'
              );
              setLastOptionsCheck(prev => new Set([...prev, unusualKey]));
            }
          }

          // Flux institutionnels
          if (optionsData.flux_institutionnels?.signal_detecte && !lastOptionsCheck.has(institutionalKey)) {
            addNotification(
              `🏦 Flux institutionnel détecté - ${ticker}`,
              `Concentration de ${optionsData.flux_institutionnels.concentration_pct?.toFixed(1)}% sur ${optionsData.flux_institutionnels.expiration_dominante}`,
              'medium'
            );
            setLastOptionsCheck(prev => new Set([...prev, institutionalKey]));
          }
        };

        checkOptionsAnomalies();
      }, [optionsData, lastOptionsCheck, portfolioTickers]);

      const dismissNotification = (id) => {
        setNotifications(prev => prev.filter(n => n.id !== id));
      };

      const clearAllNotifications = () => {
        setNotifications([]);
      };

      const markAsRead = (id) => {
        setNotifications(prev => 
          prev.map(n => n.id === id ? { ...n, read: true } : n)
        );
      };

      return {
        notifications,
        dismissNotification,
        clearAllNotifications,
        markAsRead,
        addNotification
      };
    };

    /* ------------------- PORTFOLIO LOADER ------------------- */
    const PortfolioLoader = ({ isOpen, steps, currentStepIndex }) => {
      if (!isOpen) return null;

      // Logo Trade Republic (Simplified Circle Arc concept or similar)
      const TRLogo = ({className}) => (

      return (

               <div className="relative w-20 h-20 mb-6 group">
                  <div className="absolute inset-0 border-4 border-slate-100 rounded-full"></div>
                  <div className="absolute inset-0 border-4 border-slate-900 border-t-transparent rounded-full animate-spin"></div>
                  <div className="absolute inset-0 flex items-center justify-center p-2">
                     {/* TR Logo */}
                     <img 
                        src="https://cdn.brandfetch.io/id5mURhE1s/w/400/h/400/theme/dark/icon.jpeg?c=1bxid64Mup7aczewSAYMX&t=1695070241793"
                        alt="Trade Republic"
                        className="w-full h-full rounded-full object-cover"
                     />
                  </div>
               </div>
               <h3 className="text-xl font-bold text-slate-800">Synchronisation</h3>
               <p className="text-slate-500 text-sm mt-1">Connexion sécurisée Trade Republic</p>
            </div>

            <div className="space-y-4">
              {steps.map((step, idx) => {
                 const isCompleted = idx < currentStepIndex;
                 const isCurrent = idx === currentStepIndex;
                 const isPending = idx > currentStepIndex;
                 
                 return (
                   <div key={idx} className={`flex items-center gap-4 transition-all duration-500 ${isPending ? 'opacity-40' : 'opacity-100'}`}>
                      <div className={`w-8 h-8 rounded-full flex items-center justify-center border transition-all duration-300
                         ${isCompleted ? 'bg-emerald-500 border-emerald-500 text-white' : 
                           isCurrent ? 'bg-slate-900 border-slate-900 text-white shadow-lg shadow-slate-900/30' : 
                           'bg-slate-50 border-slate-200 text-slate-400'}
                      `}>
                         {isCompleted ? (
                           <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" /></svg>
                         ) : (
                           <span className="text-xs font-bold">{idx + 1}</span>
                         )}
                      </div>
                      <div className="flex-1">
                        <div className={`text-sm font-medium ${isCurrent ? 'text-slate-900' : 'text-slate-500'}`}>{step}</div>
                        {isCurrent && (
                           <div className="h-1 w-full bg-slate-100 rounded-full mt-2 overflow-hidden">
                              <div className="h-full bg-slate-900 rounded-full animate-progress"></div>
                           </div>
                        )}
                      </div>
                   </div>
                 );
              })}
            </div>
          </div>
          <style>{`
            @keyframes progress {
               0% { width: 0% }
               50% { width: 70% }
               100% { width: 100% }
            }
            .animate-progress { animation: progress 2s infinite ease-in-out; }
          `}</style>
        </div>
      );
    };

    const ArrowRight = ({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14 5l7 7m0 0l-7 7m7-7H3" />
      </svg>
    );

    /* --------------- Composant Login --------------- */
    const LoginScreen = ({ onLoginSuccess }) => {
      const [step, setStep] = useState(1);
      const [isLoading, setIsLoading] = useState(false);
      const [formData, setFormData] = useState({
        firstName: '',
        lastName: '',
        phone: '', 
        pin: ''
      });
      const [code, setCode] = useState('');
      const [processId, setProcessId] = useState(null);
      const [error, setError] = useState('');

      // Charger les données mémorisées au démarrage
      useEffect(() => {
          const loadRemembered = async () => {
              try {
                  const res = await fetch(API_BASE + '/api/auth/remembered');
                  const data = await res.json();
                  if (data.phone) {
                      setFormData({
                          firstName: data.firstName || '',
                          lastName: data.lastName || '',
                          phone: data.phone || '',
                          pin: data.pin || ''
                      });
                  } else {
                      // Fallback sur localStorage si le backend n'a rien
                      const stored = localStorage.getItem('user_profile');
                      if (stored) {
                          const parsed = JSON.parse(stored);
                          setFormData(prev => ({
                              ...prev,
                              firstName: parsed.firstName || '',
                              lastName: parsed.lastName || '',
                              phone: parsed.phone || ''
                          }));
                      }
                  }
              } catch (err) {
                  console.error("Erreur lors du chargement des données mémorisées", err);
              }
          };
          loadRemembered();
      }, []);

      const saveUser = () => {
          localStorage.setItem('user_profile', JSON.stringify({
              firstName: formData.firstName,
              lastName: formData.lastName,
              phone: formData.phone
          }));
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setIsLoading(true);
        setError('');
        
        try {
            const res = await fetch(API_BASE + '/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    phone: formData.phone, 
                    pin: formData.pin,
                    firstName: formData.firstName,
                    lastName: formData.lastName
                })
            });
            const data = await res.json();
            
            if (data.processId) { 
                setProcessId(data.processId);
                setStep(2);
            } else if (data.loggedIn || data.success) { // Déjà connecté ou success direct
                 saveUser();
                 onLoginSuccess();
            } else {
                setError(data.error || "Échec de connexion");
            }
        } catch (err) {
            console.error(err);
            setError("Erreur serveur ou connexion refusée.");
        } finally {
            setIsLoading(false);
        }
      };

      const handleVerify = async (e) => {
          e.preventDefault();
          setIsLoading(true);
          try {
              const res = await fetch(API_BASE + '/api/auth/verify', {
                  method: 'POST',
                  headers: {'Content-Type': 'application/json'},
                  body: JSON.stringify({ processId, code })
              });
              const data = await res.json();
              if (data.success) {
                  saveUser();
                  onLoginSuccess();
              } else {
                  setError("Code incorrect");
              }
          } catch(e) {
              setError("Erreur de verification");
          } finally {
              setIsLoading(false);
          }
      };

      return (
        <div className="min-h-screen flex items-center justify-center bg-[#f7f9fc] p-4 relative overflow-hidden">
           {/* Background Decorations */}
           <div className="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none">
              <div className="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-indigo-50 rounded-full blur-3xl opacity-60 animate-pulse"></div>
              <div className="absolute top-[20%] right-[10%] w-[30%] h-[30%] bg-emerald-50 rounded-full blur-3xl opacity-60 animate-pulse" style={{animationDelay: '1s'}}></div>
           </div>

           <div className="glass-panel w-full max-w-md p-8 rounded-2xl shadow-xl border-slate-100 relative z-10 section-enter">
              <div className="text-center mb-8">
                 <div className="w-16 h-16 bg-white border border-slate-200 rounded-2xl flex items-center justify-center shadow-lg mx-auto mb-4">
                   <Activity className="w-8 h-8 text-[#cb3c1d]" />
                 </div>
                 <h1 className="text-2xl font-bold text-slate-900 mb-1">Bienvenue</h1>
                 <p className="text-slate-500 text-sm">Connectez votre compte pour accéder au terminal</p>
              </div>

              {step === 1 ? (
                <form onSubmit={handleLogin} className="space-y-5">
                   <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Prénom</label>
                        <input 
                          type="text" 
                          required
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#cb3c1d] transition-all"
                          placeholder="John"
                          value={formData.firstName}
                          onChange={e => setFormData({...formData, firstName: e.target.value})}
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Nom</label>
                        <input 
                          type="text" 
                          required
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#cb3c1d] transition-all"
                          placeholder="Doe"
                          value={formData.lastName}
                          onChange={e => setFormData({...formData, lastName: e.target.value})}
                        />
                      </div>
                   </div>
                   
                   <div className="relative">
                      <div className="absolute inset-0 flex items-center" aria-hidden="true">
                        <div className="w-full border-t border-slate-200"></div>
                      </div>
                      <div className="relative flex justify-center">
                        <span className="bg-white px-2 text-xs text-slate-400 uppercase tracking-widest">Trade Republic</span>
                      </div>
                   </div>

                   <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Numéro de mobile</label>
                      <input 
                        type="tel" 
                        required
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#cb3c1d] transition-all font-mono"
                        placeholder="+33 6 12 34 56 78"
                        value={formData.phone}
                        onChange={e => setFormData({...formData, phone: e.target.value})}
                      />
                   </div>

                   <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Code PIN</label>
                      <input 
                        type="password" 
                        required
                        maxLength={4}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#cb3c1d] transition-all font-mono tracking-widest text-center text-lg"
                        placeholder="••••"
                        value={formData.pin}
                        onChange={e => setFormData({...formData, pin: e.target.value})}
                      />
                   </div>

                   {error && <div className="text-red-600 text-xs text-center bg-red-50 p-2 rounded-lg">{error}</div>}

                   <button 
                      type="submit" 
                      disabled={isLoading}
                      className="w-full bg-[#1e293b] text-white font-bold py-4 rounded-xl shadow-lg shadow-slate-900/20 hover:bg-[#0f172a] hover:scale-[1.02] active:scale-[0.98] transition-all duration-300 flex items-center justify-center gap-2"
                   >
                     {isLoading ? (
                        <><div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"/> Connexion...</>
                     ) : (
                        <>Accéder au Terminal <ArrowRight className="w-5 h-5"/></>
                     )}
                   </button>
                </form>
              ) : (
                <form onSubmit={handleVerify} className="space-y-6 animate-fadeIn">
                   <div className="text-center">
                      <h3 className="text-lg font-bold text-slate-900">Vérification 2FA</h3>
                      <p className="text-slate-500 text-xs mt-1">Entrez le code envoyé au {formData.phone}</p>
                   </div>

                   <div>
                      <input 
                        type="text" 
                        required
                        maxLength={4}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-6 text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#cb3c1d] transition-all font-mono tracking-[1em] text-center text-2xl"
                        placeholder="0000"
                        value={code}
                        onChange={e => setCode(e.target.value)}
                        autoFocus
                      />
                   </div>

                   {error && <div className="text-red-600 text-xs text-center bg-red-50 p-2 rounded-lg">{error}</div>}

                   <button 
                      type="submit" 
                      disabled={isLoading}
                      className="w-full bg-[#cb3c1d] text-white font-bold py-4 rounded-xl shadow-lg shadow-orange-900/20 hover:bg-[#b03419] hover:scale-[1.02] active:scale-[0.98] transition-all duration-300 flex items-center justify-center gap-2"
                   >
                     {isLoading ? <div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"/> : "Valider"}
                   </button>
                   
                   <button 
                     type="button"
                     onClick={() => setStep(1)}
                     className="w-full text-slate-400 text-xs hover:text-slate-600 transition-colors"
                   >
                     Retour
                   </button>
                </form>
              )}
           </div>
           
           <div className="absolute bottom-6 text-center w-full text-slate-400 text-[10px] uppercase tracking-widest font-medium">
             Generational Wealth • Terminal v2.0
           </div>
        </div>
      );
    };

    /**
     * Composant de recherche globale
     * Permet de rechercher un stock spécifique via son nom ou ticker
     */
    const StockSearch = ({ sectorTrends, onSelect, isLoading, query, setQuery }) => {
        const [suggestions, setSuggestions] = useState([]);
        const [showSuggestions, setShowSuggestions] = useState(false);
        const wrapperRef = useRef(null);

        // Construction de la liste de recherche à plat (memoized)
        const searchIndex = useMemo(() => {
            if (!sectorTrends) return [];
            const list = [];
            const seen = new Set();
            Object.entries(sectorTrends).forEach(([sector, data]) => {
                if (data?.details) {
                    data.details.forEach(s => {
                        // Support ISIN or Ticker as unique ID
                        const id = s.isin || s.ticker;
                        if (id && !seen.has(id)) {
                            list.push({ ...s, sector });
                            seen.add(id);
                        }
                    });
                }
            });
            return list;
        }, [sectorTrends]);

        useEffect(() => {
            const handleClickOutside = (event) => {
                if (wrapperRef.current && !wrapperRef.current.contains(event.target)) {
                    setShowSuggestions(false);
                }
            };
            document.addEventListener("mousedown", handleClickOutside);
            return () => document.removeEventListener("mousedown", handleClickOutside);
        }, [wrapperRef]);

        const handleInput = (e) => {
            const val = e.target.value;
            setQuery(val);
            if (val.length > 1) {
                const lower = val.toLowerCase();
                const filtered = searchIndex.filter(s => 
                    (s.name && s.name.toLowerCase().includes(lower)) || 
                    (s.ticker && s.ticker.toLowerCase().includes(lower)) || 
                    (s.isin && s.isin.toLowerCase().includes(lower))
                ).slice(0, 8); // Top 8 suggestions
                setSuggestions(filtered);
                setShowSuggestions(true);
            } else {
                setSuggestions([]);
                setShowSuggestions(false);
            }
        };

        const handleSelect = (stock) => {
            setQuery(stock.name || stock.ticker || stock.isin);
            setShowSuggestions(false);
            // Send ISIN if ticker is missing, backend will handle resolution
            onSelect(stock.ticker || stock.isin); 
        };

        const handleManualSubmit = (e) => {
            e.preventDefault();
            if (query.length > 0) {
                // Si l'utilisateur tape un ticker direct qui n'est pas dans la liste
                // On envoie brut (le backend gérera ou échouera)
                onSelect(query.toUpperCase());
                setShowSuggestions(false);
            }
        };

        return (
            <div ref={wrapperRef} className="relative w-full max-w-md z-50">
                <form onSubmit={handleManualSubmit} className="relative group">
                  <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                      <Search className="h-4 w-4 text-slate-400 group-focus-within:text-indigo-500 transition-colors" />
                  </div>
                  <input
                      type="text"
                      className="block w-full pl-10 pr-4 py-2 bg-white border border-slate-300 rounded-xl text-sm placeholder-slate-400 text-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all font-mono shadow-sm"
                      placeholder="Rechercher (ticker/nom)..."
                      value={query}
                      onChange={handleInput}
                      onFocus={() => query.length > 1 && setShowSuggestions(true)}
                  />
                  {isLoading && (
                      <div className="absolute inset-y-0 right-0 pr-3 flex items-center">
                          <div className="animate-spin h-3 w-3 border-2 border-indigo-500 rounded-full border-t-transparent"></div>
                      </div>
                  )}
                </form>
                
                {showSuggestions && suggestions.length > 0 && (
                    <div className="absolute mt-2 w-full bg-white border border-slate-200 rounded-xl shadow-xl overflow-hidden max-h-60 overflow-y-auto custom-scrollbar z-50">
                        {suggestions.map((s, i) => (
                            <div 
                              key={i} 
                              onClick={() => handleSelect(s)}
                              className="px-4 py-3 hover:bg-slate-50 cursor-pointer border-b border-slate-100 last:border-0 flex justify-between items-center group transition-colors"
                            >
                                <div>
                                    <div className="text-sm font-bold text-slate-800 group-hover:text-indigo-700">{s.name}</div>
                                    <div className="text-[10px] text-slate-500 font-mono tracking-wide">{s.ticker} • {s.sector}</div>
                                </div>
                                {s.month_change_pct && (
                                    <div className={`text-xs font-mono font-bold ${s.month_change_pct > 0 ? 'text-emerald-600' : 'text-red-600'}`}>
                                        {s.month_change_pct > 0 ? '+' : ''}{parseFloat(s.month_change_pct).toFixed(1)}%
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                )}
            </div>
        );
    };

    /**

     */

                   {/* Carte 2 : Target Analyste */}

                {stock.metrics && (

    /* --------------- Analyse 360° du Portefeuille — Vision Complète Multi-Sources --------------- */
    const Analysis360 = ({ portfolioMetrics, globalMarketData, bloombergNews, earningsData, sectorTrends, bankForecasts }) => {
        const [result, setResult] = React.useState(null);
        const [loading, setLoading] = React.useState(false);
        const [lastScanned, setLastScanned] = React.useState(null);
        const [showModal, setShowModal] = React.useState(false);

        const runAnalysis = async () => {
            setLoading(true);
            try {
                const res = await fetch(API_BASE + '/api/analysis/360', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();
                if (data.status === 'success') {
                    setResult(data.data);
                    setLastScanned(new Date());
                    setShowModal(true);
                }
            } catch(e) { console.error('Analyse 360 error:', e); }
            setLoading(false);
        };

        const hcMap = {
            emerald: { bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-200', bar: 'bg-emerald-500' },
            blue:    { bg: 'bg-blue-50',    text: 'text-blue-700',    border: 'border-blue-200',    bar: 'bg-blue-500' },
            amber:   { bg: 'bg-amber-50',   text: 'text-amber-700',   border: 'border-amber-200',   bar: 'bg-amber-500' },
            orange:  { bg: 'bg-orange-50',  text: 'text-orange-700',  border: 'border-orange-200',  bar: 'bg-orange-500' },
            red:     { bg: 'bg-red-50',     text: 'text-red-700',     border: 'border-red-200',     bar: 'bg-red-500' },
        };

        const fmtValue = (v) => {
            if (v == null) return '—';
            if (Math.abs(v) >= 1e9) return `${(v/1e9).toFixed(1)}B`;
            if (Math.abs(v) >= 1e6) return `${(v/1e6).toFixed(0)}M`;
            if (Math.abs(v) >= 1e3) return `${(v/1e3).toFixed(0)}K`;
            return String(v);
        };

        return (
            <div className="space-y-5">

                {/* ── HEADER BANNER ── */}
                <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm relative overflow-hidden">
                    <div className="absolute right-0 top-0 p-6 opacity-[0.03] pointer-events-none">
                        <Activity className="w-32 h-32 text-slate-900" />
                    </div>
                    <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-5 relative z-10">
                        <div className="space-y-1.5">
                            <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-[#cb3c1d]/10 border border-[#cb3c1d]/20 text-[#cb3c1d] text-xs font-bold uppercase tracking-wider">
                                <span className="w-1.5 h-1.5 rounded-full bg-[#cb3c1d] animate-pulse"></span>
                                Analyse IA — 8 Sources de Données
                            </span>
                            <h3 className="text-2xl font-bold text-slate-900">Analyse du Portefeuille</h3>
                            <p className="text-slate-500 text-sm max-w-2xl leading-relaxed">
                                Diagnostic complet :
                                <span className="text-slate-700 font-semibold"> Technique</span> ·
                                <span className="text-slate-700 font-semibold"> Insiders SEC</span> ·
                                <span className="text-slate-700 font-semibold"> Short Interest</span> ·
                                <span className="text-slate-700 font-semibold"> Options Flow</span> ·
                                <span className="text-slate-700 font-semibold"> Trimestriels</span> ·
                                <span className="text-slate-700 font-semibold"> EPS Surprise</span> ·
                                <span className="text-slate-700 font-semibold"> Macro</span> ·
                                <span className="text-slate-700 font-semibold"> News Bloomberg</span>
                            </p>
                        </div>
                        <div className="flex items-center gap-4 shrink-0">
                            {lastScanned && (
                                <div className="text-xs text-slate-400 font-mono text-right hidden md:block">
                                    <div>Dernière analyse</div>
                                    <div className="text-slate-600 font-semibold">{lastScanned.toLocaleTimeString('fr-FR')}</div>
                                </div>
                            )}
                            <button
                                onClick={runAnalysis}
                                disabled={loading}
                                className="px-7 py-3 bg-[#cb3c1d] hover:bg-[#b03419] text-white rounded-xl font-bold transition-all shadow-md shadow-orange-200/40 disabled:opacity-60 disabled:cursor-not-allowed flex items-center gap-2 text-sm"
                            >
                                {loading ? (
                                    <><div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div> Scan en cours...</>
                                ) : (
                                    <><Activity className="w-4 h-4" /> Lancer le Diagnostic Complet</>
                                )}
                            </button>
                        </div>
                    </div>
                </div>

                {/* ── RESULTS MODAL ── */}
                {result && showModal && (() => {
                    const macro = result.macro_snapshot || {};
                    const hc = result.health_color || 'blue';
                    const colors = hcMap[hc] || hcMap.blue;
                    const bd = result.health_breakdown || {};
                    const vixBadge = { emerald: 'bg-emerald-100 text-emerald-700', amber: 'bg-amber-100 text-amber-700', orange: 'bg-orange-100 text-orange-600', red: 'bg-red-100 text-red-700' };
                    const vixTxt   = { emerald: 'text-emerald-600', amber: 'text-amber-600', orange: 'text-orange-600', red: 'text-red-600' };

                    // Collect upcoming events across all positions
                    const allEvents = [];
                    (result.positions_analysis || []).forEach(pos => {
                        if (pos.upcoming_earnings) allEvents.push({ ticker: pos.ticker, isin: pos.isin, type: 'earnings', date: pos.upcoming_earnings, eps_estimate: pos.eps_estimate });
                        if (pos.upcoming_dividend) allEvents.push({ ticker: pos.ticker, isin: pos.isin, type: 'dividend', date: pos.upcoming_dividend, amount: pos.dividend_amount });
                    });
                    allEvents.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
                    const upcoming = allEvents.slice(0, 12);

                    return ReactDOM.createPortal(
                        <div
                            className="fixed inset-0 z-[9999] bg-black/60 backdrop-blur-sm flex items-start justify-center p-4 md:p-6 overflow-y-auto"
                            onClick={(e) => { if (e.target === e.currentTarget) setShowModal(false); }}
                        >
                            <div className="relative w-full max-w-6xl my-4 space-y-4">

                                {/* ── Modal Close Bar ── */}
                                <div className="flex items-center justify-between bg-white border border-slate-200 rounded-2xl px-5 py-3 shadow-sm">
                                    <div className="flex items-center gap-3">
                                        <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-[#cb3c1d]/10 text-[#cb3c1d] text-xs font-bold uppercase tracking-wider">
                                            <span className="w-1.5 h-1.5 rounded-full bg-[#cb3c1d]"></span>
                                            Analyse 360°
                                        </span>
                                        {lastScanned && (
                                            <span className="text-xs text-slate-400 font-mono hidden md:inline">
                                                Généré le {lastScanned.toLocaleString('fr-FR')}
                                            </span>
                                        )}
                                    </div>
                                    <button
                                        onClick={() => setShowModal(false)}
                                        className="flex items-center gap-1.5 px-4 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 hover:text-slate-900 rounded-xl text-sm font-semibold transition-colors"
                                    >
                                        <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                        Fermer
                                    </button>
                                </div>

                            <div className="bg-[#f7f9fc] rounded-2xl p-4 space-y-4">

                            {/* ── ROW 1: HEALTH SCORE + VIX ── */}
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">

                                {/* Health Score */}
                                <div className={`lg:col-span-2 bg-white border rounded-2xl p-6 shadow-sm ${colors.border}`}>
                                    <div className="flex items-start justify-between mb-5">
                                        <div>
                                            <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Score Santé Portfolio</div>
                                            <div className={`text-7xl font-black leading-none ${colors.text}`}>{result.health_score}</div>
                                            <div className="text-slate-400 text-sm font-mono mt-0.5">/100</div>
                                        </div>
                                        <span className={`px-3 py-1.5 rounded-full text-sm font-bold border ${colors.bg} ${colors.text} ${colors.border}`}>{result.health_label}</span>
                                    </div>
                                    <div className="space-y-2.5">
                                        {[
                                            { label: 'Technique',  value: bd.technicals, bar: 'bg-indigo-500' },
                                            { label: 'News',       value: bd.news,       bar: 'bg-sky-500' },
                                            { label: 'Macro',      value: bd.macro,      bar: 'bg-amber-500' },
                                            { label: 'Insiders',   value: bd.insiders,   bar: 'bg-purple-500' },
                                            { label: 'Anti-Short', value: bd.short,      bar: 'bg-slate-500' },
                                        ].map(item => (
                                            <div key={item.label}>
                                                <div className="flex justify-between text-xs mb-1">
                                                    <span className="text-slate-500 font-medium">{item.label}</span>
                                                    <span className="font-mono font-bold text-slate-700">{item.value ?? '—'}%</span>
                                                </div>
                                                <div className="h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                                    <div className={`h-full ${item.bar} rounded-full transition-all duration-700`} style={{width: `${item.value || 0}%`}}></div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    {result.scanned_at && (
                                        <div className="mt-4 pt-3 border-t border-slate-100 text-[10px] text-slate-400 font-mono">
                                            Généré: {new Date(result.scanned_at).toLocaleString('fr-FR')}
                                        </div>
                                    )}
                                </div>

                                {/* VIX Only */}
                                <div className="bg-white border border-slate-200 rounded-xl p-5 shadow-sm flex flex-col justify-center">
                                    <div className="text-[10px] text-slate-400 uppercase font-bold tracking-wider mb-2">VIX — Volatilité</div>

                            {/* ── ROW 4: TENDANCES SECTORIELLES (filtrées par secteur des actifs) ── */}

                                                    <div key={i} className={`rounded-xl p-2.5 border text-center relative ${

                                                                    pos.options_bias === 'bearish' ? 'bg-red-50 text-red-600' : 'bg-slate-50 text-slate-500'

                                                                    </div>

                                                            </div>

                                                                pos.insider_signal === 'bearish' ? 'bg-red-50 text-red-600 border-red-200' :
                                                                'bg-slate-100 text-slate-500 border-slate-200'

                                                    {ins.length > 0 ? (
                                                        <div className="space-y-0 divide-y divide-slate-50">
                                                            {ins.map((t, ti) => (

                                                                        <div className="text-[10px] text-slate-400">{t.date}</div>
                                                                    </div>
                                                                    <div className="text-right shrink-0">
                                                                        <span className={`text-[11px] font-bold px-2 py-0.5 rounded ${
                                                                            t.transaction && t.transaction.toLowerCase().includes('buy') ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-600'
                                                                        }`}>{t.transaction}</span>
                                                                        {t.value && <div className="text-[10px] text-slate-400 font-mono mt-0.5">${Number(t.value / 1000).toFixed(0)}K</div>}
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    ) : <p className="text-xs text-slate-300 italic">Aucune activité récente</p>}
                                                </div>

                                                {/* ─ EPS + Trimestriels ─ */}
                                                <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
                                                    <h5 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                                                        <span className="text-base">📊</span> Résultats Trimestriels &amp; EPS
                                                        {pos.eps_beat_rate != null && (
