                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    });

    /* --------------- PortfolioPerformanceChart (legacy alias) --------------- */
    const PortfolioPerformanceChart = TRPortfolioChart;

    const SpendingBreakdownChart = ({ data }) => {
        const chartRef = useRef(null);
        
        useEffect(() => {
            if (!data || data.length === 0) return;
            
            const ctx = chartRef.current?.getContext('2d');
            if (!ctx) return;
            
            if (chartRef.current._chartInstance) {
                chartRef.current._chartInstance.destroy();
            }

            const colors = {
                'Shopping': '#ec4899', 'Groceries': '#10b981', 'Transport': '#f59e0b',
                'Food & Drink': '#ef4444', 'Entertainment': '#8b5cf6', 'Travel': '#0ea5e9',
                'Utilities': '#64748b', 'Tech': '#3b82f6', 'Health': '#14b8a6',
                'Home': '#f97316', 'Finance': '#6366f1', 'Other': '#94a3b8'
            };

            const chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: data.map(d => d.category),
                    datasets: [{
                        data: data.map(d => d.amount),
                        backgroundColor: data.map(d => colors[d.category] || colors['Other']),
                        borderWidth: 2,
                        borderColor: '#fff',
                        hoverOffset: 10
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: { padding: 20 },
                    plugins: {
                        legend: { position: 'right', labels: { font: { family: "'Plus Jakarta Sans', sans-serif", size: 10, weight: '600' }, boxWidth: 8, padding: 15, color: '#475569' } },
                        tooltip: {
                            backgroundColor: 'rgba(255, 255, 255, 0.95)',
                            titleColor: '#1e293b',
                            bodyColor: '#475569',
                            borderColor: '#e2e8f0',
                            borderWidth: 1,
                            padding: 12,
                            boxPadding: 4,
                            callbacks: {
                                label: (ctx) => ` ${ctx.label}: ${Math.round(ctx.parsed)}€ (${data[ctx.dataIndex].percent}%)`
                            }
                        }
                    },
                    cutout: '65%',
                    radius: '90%'
                }
            });
            
            chartRef.current._chartInstance = chart;
            
            return () => {
                if (chartRef.current._chartInstance) chartRef.current._chartInstance.destroy();
            };
        }, [data]);

        return (
            <div className="relative h-[250px] w-full">
                <canvas ref={chartRef}></canvas>
                <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                    <span className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Dépenses</span>
                    <span className="text-2xl font-bold text-slate-800 tracking-tight">
                        {data ? (data.reduce((a, b) => a + b.amount, 0)).toFixed(0) + '€' : ''}
                    </span>
                </div>
            </div>
        );
    };

    /* --------------- Expenses Pie Chart Component --------------- */
    const ExpensesPieChart = ({ transactions, period }) => {
        const chartRef = useRef(null);
        
        // Filter transactions based on period
        const breakdown = useMemo(() => {
            if (!transactions) return [];
            const now = new Date();
            let limitDate = new Date();
            
            // Period logic
            if (period === '1m') limitDate.setMonth(now.getMonth() - 1);
            else if (period === '2m') limitDate.setMonth(now.getMonth() - 2);
            else if (period === '3m') limitDate.setMonth(now.getMonth() - 3);
            else if (period === 'ytd') limitDate = new Date(now.getFullYear(), 0, 1);
            else limitDate = new Date(0); // All time

            // Filter Expenses (amount < 0) and Date
            const filtered = transactions.filter(t => {
                const tDate = new Date(t.date);
                return tDate >= limitDate && t.amount < 0;
            });

            // Group by Category
            const groups = {};
            let total = 0;
            filtered.forEach(t => {
                const cat = t.category || 'Autre';
                const amt = Math.abs(t.amount);
                groups[cat] = (groups[cat] || 0) + amt;
                total += amt;
            });
            
            return Object.keys(groups).map(k => ({
                category: k,
                amount: groups[k],
                percentage: total ? ((groups[k] / total) * 100).toFixed(1) : 0
            })).sort((a, b) => b.amount - a.amount);
        }, [transactions, period]);

        useEffect(() => {
           const ctx = chartRef.current?.getContext('2d');
           if (!ctx) return;
           
           if (chartRef.current._chartInstance) {
               chartRef.current._chartInstance.destroy();
           }

           if (breakdown.length === 0) return;

           const chart = new Chart(ctx, {
               type: 'doughnut',
               data: {
                   labels: breakdown.map(b => `${b.category} (${b.percentage}%)`),
                   datasets: [{
                       data: breakdown.map(b => b.amount),
                       backgroundColor: [
                           '#6366f1', '#8b5cf6', '#ec4899', '#f43f5e', '#f97316', 
                           '#eab308', '#22c55e', '#06b6d4', '#3b82f6', '#64748b'
                       ],
                       borderWidth: 2,
                       borderColor: '#ffffff',
                       hoverOffset: 4
                   }]
               },
               options: { 
                   responsive: true,
                   maintainAspectRatio: false,
                   cutout: '65%', 
                   plugins: { 
                       legend: { 
                           position: 'right',
                           labels: {
                               usePointStyle: true,
                               font: { family: "'Plus Jakarta Sans', sans-serif", size: 11 }
                           }
                       },
                       tooltip: {
                           callbacks: {
                               label: function(context) {
                                   let label = context.label || '';
                                   if (label) {
                                       label = label.split(' (')[0] + ': ';
                                   }
                                   if (context.parsed !== null) {
                                       label += new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(context.parsed);
                                   }
                                   return label;
                               }
                           }
                       }
                   } 
               }
           });
           chartRef.current._chartInstance = chart;
           
           return () => {
               if (chartRef.current && chartRef.current._chartInstance) {
                   chartRef.current._chartInstance.destroy();
               }
           };
        }, [breakdown]);

        if (!transactions || transactions.length === 0) return <div className="text-center text-slate-400 py-10">Aucune transaction</div>;
        if (breakdown.length === 0) return <div className="text-center text-slate-400 py-10">Aucune dépense sur cette période ({period})</div>;

        return <div className="h-64 relative"><canvas ref={chartRef} /></div>;
    }

    /* --------------- Cash Flow Chart Component --------------- */
    const CashFlowChart = ({ data }) => {
        const chartRef = useRef(null);
        
        useEffect(() => {
            if (!data?.cash_flow || data.cash_flow.length === 0) return;
            
            const ctx = chartRef.current?.getContext('2d');
            if (!ctx) return;
            
            if (chartRef.current._chartInstance) {
                chartRef.current._chartInstance.destroy();
            }

            const cf = data.cash_flow;
            // Limit to last 12 months for cleanliness if too much data
            const viewData = cf.slice(-12);
            
            const labels = viewData.map(x => x.month);
            const income = viewData.map(x => x.income);
            const expense = viewData.map(x => x.expense);
            const savings = viewData.map(x => x.savings); // Use computed savings (inc - exp)

            const chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                         {
                            label: 'Epargne Nette',
                            data: savings,
                            type: 'line',
                            borderColor: '#8b5cf6', // Violet
                            backgroundColor: (context) => {
                                const ctx = context.chart.ctx;
                                const gradient = ctx.createLinearGradient(0, 0, 0, 300);
                                gradient.addColorStop(0, 'rgba(139, 92, 246, 0.5)');
                                gradient.addColorStop(1, 'rgba(139, 92, 246, 0.0)');
                                return gradient;
                            },
                            borderWidth: 3,
                            pointBackgroundColor: '#fff',
                            pointBorderColor: '#8b5cf6',
                            pointRadius: 4,
                            pointHoverRadius: 6,
                            pointBorderWidth: 2,
                            tension: 0.4,
                            fill: true,
                            order: 1,
                            yAxisID: 'y'
                        },
                        { 
                            label: 'Revenus', 
                            data: income, 
                            backgroundColor: '#10b981', 
                            hoverBackgroundColor: '#059669',
                            borderRadius: 6,
                            barThickness: 16,
                            order: 2,
                            stack: 'stack1',
                            yAxisID: 'y'
                        },
                        { 
                            label: 'Dépenses', 
                            data: expense.map(x => -x), // Show negative on chart?? No, better keep positive for comparison or mirrored? 
                            // Let's keep them positive but stacked if we want total volume, but user usually wants to see burn rate.
                            // Stacking them is tricky visually if one consumes the other.
                            // Let's do side by side for bars.
                            data: expense,
                            backgroundColor: '#f43f5e', 
                            hoverBackgroundColor: '#e11d48',
                            borderRadius: 6,
                            barThickness: 16,
                            order: 3,
                            stack: 'stack2',
                            yAxisID: 'y'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: { 
                        y: { 
                            beginAtZero: true, 
                            grid: { color: '#f1f5f9', borderDash: [4, 4] },
                            ticks: { 
                                font: { size: 10, family: "'Plus Jakarta Sans', sans-serif" }, 
                                color: '#94a3b8',
                                callback: (value) => value >= 1000 ? (value/1000) + 'k' : value 
                            },
                            border: { display: false }
                        }, 
                        x: { 
                            grid: { display: false },
                            ticks: { font: { size: 10, family: "'Plus Jakarta Sans', sans-serif" }, color: '#94a3b8' },
                            border: { display: false }
                        } 
                    },
                    plugins: { 
                        legend: { 
                            position: 'top', 
                            align: 'end', 
                            labels: { usePointStyle: true, boxWidth: 6, font: { size: 11, weight: '600' }, color: '#64748b', padding: 20 } 
                        },
                        tooltip: {
                            backgroundColor: '#ffffff',
                            titleColor: '#0f172a',
                            bodyColor: '#475569',
                            borderColor: '#e2e8f0',
                            borderWidth: 1,
                            padding: 16,
                            boxPadding: 6,
                            usePointStyle: true,
                            titleFont: { size: 14, weight: 'bold', family: "'Plus Jakarta Sans', sans-serif" },
                            bodyFont: { size: 13, family: "'Plus Jakarta Sans', sans-serif" },
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    if (context.parsed.y !== null) {
                                        label += new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(context.parsed.y);
                                    }
                                    return label;
                                }
                            },
                            displayColors: true,
                        }
                    }
                }
            });
            chartRef.current._chartInstance = chart;
            
            return () => {
                if (chartRef.current?._chartInstance) {
                    chartRef.current._chartInstance.destroy();
                }
            };
        }, [data]);

        return (
            <div className="flex-1 relative min-h-[350px] w-full">
                <canvas ref={chartRef}></canvas>
            </div>
        );
    };

    /* ------------------- GESTION D'ÉTAT CENTRALISÉE (REDUCER) ------------------- */
    const initialState = {
        // --- DONNÉES MÉTIER ---
        activeTab: 'portfolio',
        portfolioData: null,
        globalMarketData: null,
        cashAnalysis: null,
        insiderData: null,
        newsData: null,
        bloombergNews: null,
        forexData: null,
        optionsData: null,
        derivativesData: null,
        seasonalityData: null,
        senatorTradesData: null,

        // --- AUTHENTIFICATION ---
        auth: {
            isLoggedIn: false,
            userProfile: null,
            showUserMenu: false,
            showLoginModal: false,
            authChecked: false
        },

        // --- ÉTAT UI / Chargement ---
        searchQuery: '',
        loading: true,
        error: null,
        newsError: null,
        isRefreshingPortfolio: false,
        currentRefreshStep: 0,
        aiFeedEnabled: false,
        isChatOpen: false,
        
        // --- CHARGEURS SPÉCIFIQUES ---
        loadingSteps: {
            global: { status: 'pending', label: 'Portfolio & Transactions Insiders' },
            news: { status: 'pending', label: 'Flux Actualités & Bloomberg News' },
            earnings: { status: 'pending', label: 'Calendrier des Earnings' },
            sectors: { status: 'pending', label: 'Tendances Sectorielles' },
            forecasts: { status: 'pending', label: 'Prévisions Bancaires' },
            analyses: { status: 'pending', label: 'Analyses de Marché' }
        },
        senatorTrades: {
            loading: false,
            error: null,
            selectedTicker: null,
            searchResults: [],
            searchQuery: ''
        }
    };

    const terminalReducer = (state, action) => {
        switch (action.type) {
            // Navigation
            case 'SET_TAB': return { ...state, activeTab: action.payload };
            case 'SET_SEARCH': return { ...state, searchQuery: action.payload };
            
            // Data Setters
            case 'SET_PORTFOLIO': return { ...state, portfolioData: action.payload };
            case 'SET_MARKET': return { ...state, globalMarketData: action.payload };
            case 'SET_CASH_ANALYSIS': return { ...state, cashAnalysis: action.payload };
            case 'SET_NEWS': return { ...state, newsData: action.payload };
            case 'SET_BLOOMBERG': return { ...state, bloombergNews: action.payload };
            case 'SET_INSIDERS': return { ...state, insiderData: action.payload };
            
            // Auth
            case 'SET_AUTH_STATE': return { ...state, auth: { ...state.auth, ...action.payload } };
            
            // Loading & Errors
            case 'SET_LOADING': return { ...state, loading: action.payload };
            case 'SET_ERROR': return { ...state, error: action.payload };
            case 'SET_LOADING_STEP': 
                 return {
                    ...state,
                    loadingSteps: {
                        ...state.loadingSteps,
                        [action.step]: { ...state.loadingSteps[action.step], status: action.status }
                    }
                };
            
            // Senators
            case 'SET_SENATORS': return { ...state, senatorTradesData: action.payload };
            case 'SET_SENATOR_UI': return { ...state, senatorTrades: { ...state.senatorTrades, ...action.payload } };

      // UI Toggles
            case 'TOGGLE_CHAT': return { ...state, isChatOpen: action.payload };
            
            // Default fallback for quick migration (use sparingly)
            case 'PATCH_STATE': return { ...state, ...action.payload };
            
            default: return state;
        }
    };

    /* --------------- Composant principal --------------- */
    const FinancialTerminal = ({ authUser, onLogout }) => {
      const [txFilterMonth, setTxFilterMonth] = useState('ALL');
      const [showAllTx, setShowAllTx] = useState(false);
      
      // --- NEW FINANCIAL CONFIG STATE ---
      const [userFinancialConfig, setUserFinancialConfig] = useState({
        budget: 0,
        savings_goal: 0,
        subscriptions: []
      });
      const [expensePeriod, setExpensePeriod] = useState('1m');
      const [newSub, setNewSub] = useState({ name: '', amount: '', frequency: 'Monthly', next_date: '' });

      // --- AI NEWS ANALYSIS STATE ---
      const [aiAnalysisMode, setAiAnalysisMode] = useState('sector'); // 'sector' or 'news'
      const [isAiAnalyzing, setIsAiAnalyzing] = useState(false);
      const [scanProgress, setScanProgress] = useState(0); // Add Progress State
      const [newsRecommendations, setNewsRecommendations] = useState([]);
      const [newsRecsLoading, setNewsRecsLoading] = useState(false);
      
      // --- POLYMARKET PORTFOLIO PREDICTIONS ---
      const [portfolioPredictions, setPortfolioPredictions] = useState(null);
      const [predictionsLoading, setPredictionsLoading] = useState(false);
      const [expandedPredictions, setExpandedPredictions] = useState(new Set());

      const fetchPortfolioPredictions = async () => {
          setPredictionsLoading(true);
          try {
              const res = await fetchWithRetry(API_BASE + '/api/predictions/portfolio');
              const data = await res.json();
              if (data.status === 'success') {
                  setPortfolioPredictions(data.results);
              }
          } catch(e) {
              console.error("Polymarket fetch error", e);
          } finally {
              setPredictionsLoading(false);
          }
      };

      // Load predictions on mount (or when portfolio changes ideally, but mount is fine for now)
      useEffect(() => {
          fetchPortfolioPredictions();
      }, []);

      const fetchNewsRecommendations = async () => {
          setNewsRecsLoading(true);
          try {
              const res = await fetchWithRetry(API_BASE + '/api/ai/news-recommendations');
              const data = await res.json();
              if (data.status === 'success') {
                  setNewsRecommendations(data.data);
              } else {
                  addNotification("Erreur analyse News AI: " + data.message, "error");
              }
          } catch(e) {
              console.error(e);
              addNotification("Erreur connexion AI News", "error");
          } finally {
              setNewsRecsLoading(false);
          }
      };


      useEffect(() => {
          fetch(API_BASE + '/api/user/financial-config')
            .then(r => r.json())
            .then(d => {
                setUserFinancialConfig({
                    budget: d.budget || 0,
                    savings_goal: d.savings_goal || 0,
                    subscriptions: d.subscriptions || [] 
                });
            })
            .catch(e => console.error("Config load error", e));
      }, []);

      const saveFinancialConfig = async (newConfig) => {
          try {
              const res = await fetch(API_BASE + '/api/user/financial-config', {
                  method: 'POST',
                  headers: {'Content-Type': 'application/json'},
                  body: JSON.stringify(newConfig)
              });
              if (res.ok) {
                  const saved = await res.json();
                  setUserFinancialConfig(saved.data);
                  addNotification("Configuration sauvegardée", "success");
              }
          } catch (e) { addNotification("Erreur sauvegarde", "error"); }
      };

      const handleAddSubscription = () => {
          if (!newSub.name || !newSub.amount) return;
          const updatedSubs = [...userFinancialConfig.subscriptions, {
              ...newSub,
              amount: parseFloat(newSub.amount),
              logo: null,
              confidence: 100
          }];
          const newConfig = { ...userFinancialConfig, subscriptions: updatedSubs };
          saveFinancialConfig(newConfig);
          setNewSub({ name: '', amount: '', frequency: 'Monthly', next_date: '' });
      };

      const handleRemoveSubscription = (idx) => {
          const updatedSubs = userFinancialConfig.subscriptions.filter((_, i) => i !== idx);
          const newConfig = { ...userFinancialConfig, subscriptions: updatedSubs };
          saveFinancialConfig(newConfig);
      };

      const [state, dispatch] = useReducer(terminalReducer, initialState);

      // --- DESTRUCTURATION DE L'ÉTAT GLOBAL ---

      
      const { 
          activeTab, portfolioData, globalMarketData, cashAnalysis, 
          searchQuery, insiderData, newsData, bloombergNews, 
          loading, error, newsError, loadingSteps, auth, 
          isRefreshingPortfolio, currentRefreshStep
      } = state;

      const { isLoggedIn, userProfile, showUserMenu, showLoginModal, authChecked } = auth;
      const { senatorTradesData, senatorTrades } = state; // Expanded below if needed

      // --- SHIMS DE COMPATIBILITÉ (Pour éviter de casser tout le code existant) ---
      const setActiveTab = (v) => dispatch({type: 'SET_TAB', payload: v});
      const setPortfolioData = (v) => dispatch({type: 'SET_PORTFOLIO', payload: v});
      const setSearchQuery = (v) => dispatch({type: 'SET_SEARCH', payload: v});
      const setGlobalMarketData = (v) => dispatch({type: 'SET_MARKET', payload: v});
      const setCashAnalysis = (v) => dispatch({type: 'SET_CASH_ANALYSIS', payload: v});
      const setNewsData = (v) => dispatch({type: 'SET_NEWS', payload: v});
      const setBloombergNews = (v) => dispatch({type: 'SET_BLOOMBERG', payload: typeof v === 'function' ? v(state.bloombergNews) : v});
      const setInsiderData = (v) => dispatch({type: 'SET_INSIDERS', payload: v});
      
      // Shims Auth
      const setIsLoggedIn = (v) => dispatch({type: 'SET_AUTH_STATE', payload: {isLoggedIn: v}});
      const setUserProfile = (v) => dispatch({type: 'SET_AUTH_STATE', payload: {userProfile: v}});
      const setShowUserMenu = (v) => dispatch({type: 'SET_AUTH_STATE', payload: {showUserMenu: v}});
      const setShowLoginModal = (v) => dispatch({type: 'SET_AUTH_STATE', payload: {showLoginModal: v}});
      const setAuthChecked = (v) => dispatch({type: 'SET_AUTH_STATE', payload: {authChecked: v}});

      // Account settings modal state
      const [showAccountSettings, setShowAccountSettings] = React.useState(false);

      // Shims Loading
      const setLoading = (v) => dispatch({type: 'SET_LOADING', payload: v});
      const setLoadingSteps = (v) => {
         // This one is tricky because original was object replacement or function
         // Ignoring complex updates for now, assuming standard usage
         // If v is a function (setState pattern), we can't easily support it without current state access
         // But for now let's assume direct set or simple object merge needs.
         // Actually, most usages are specific step updates.
         dispatch({type: 'PATCH_STATE', payload: { loadingSteps: typeof v === 'function' ? v(state.loadingSteps) : v }}); 
      };
      
      // Helper for step update which was used via setLoadingSteps(prev => ...)
      const updateLoadingStep = (step, status) => dispatch({type: 'SET_LOADING_STEP', step, status});
      
      // Shims for Refresh Portfolio State
      const setIsRefreshingPortfolio = (v) => dispatch({type: 'PATCH_STATE', payload: { isRefreshingPortfolio: v }});
      const setCurrentRefreshStep = (v) => dispatch({type: 'PATCH_STATE', payload: { currentRefreshStep: v }});
      
      // Stable handler to prevent infinite loops in NewsRefresher
      const handleNewsUpdate = useCallback((data) => {
          setNewsData(data);
          if(data.news_segments) {
              setBloombergNews(prev => {
                  const merged = {...prev};
                  merged.news_segments = data.news_segments;
                  return merged;
              });
          }
      }, []);

      
      /* --- Market Helpers --- */
      
      const loadGlobalMarketData = async (retry = true) => {

                if (allDataReq.ok) {
                    const allData = await allDataReq.json();
                    
                    // Dispatch des données reçues avec sécurité (Optional Chaining)
                    if(allData.forex) {
                       const filteredEvents = (allData.forex?.events || [])
                        .filter(e => e.impact === 'High' || e.impact === 'Medium')
                        .slice(0, 15);
                       setForexData(filteredEvents);
                    }
                    
                    if(allData.insiders) {
                        const insidersToSet = allData.insiders.data || allData.insiders;
                        if (insidersToSet && Object.keys(insidersToSet).length > 0) {
                            setInsiderData(insidersToSet);
                        }
                    }
                    
                    if(allData.news) setNewsData(allData.news);
                    if(allData.bloomberg_live) setBloombergNews(allData.bloomberg_live);
                    if(allData.options) setOptionsData(allData.options);
                    if(allData.seasonality) setSeasonalityData(allData.seasonality);
                    if(allData.sector_trends) {
                        setSectorTrends(allData.sector_trends);
                        setSectorsPerformance(allData.sector_trends);
                    }
                    if(allData.bank_forecasts) {
                        setBankForecasts(allData.bank_forecasts);
                        
                        // FIX: Auto-Analyze Bank Forecasts if missing analyses
                        if (!allData.bank_analyses || allData.bank_analyses.length === 0) {
                             if (!isBackground) { // Only do this on main load, not every 10s background check
                                 fetch(API_BASE + '/api/bank-forecasts/analyze', {method: 'POST'})
                                    .then(r => r.json())
                                    .then(d => {
                                        if(d.analyses && Array.isArray(d.analyses)) setBankAnalyses(d.analyses);
                                    }) 
                                    .catch(e => console.error("Auto-analyze bank forecasts failed", e));
                             }
                        }
                    }
                    if(allData.bank_analyses) setBankAnalyses(allData.bank_analyses);
                    if(allData.macro_data) setMacroData(allData.macro_data);
                    if(allData.earnings) setEarningsData(allData.earnings?.data || allData.earnings || []);

                    const portfolioJson = allData.portfolio || {};
                    // if(portfolioJson) setPortfolioData(portfolioJson); <-- Supprimé car provoque un crash si positions manque
                    let cash = 0;
                    if (portfolioJson.availableCash) cash = portfolioJson.availableCash.amount || 0;
                    else if (portfolioJson.available_cash) {
                         if (portfolioJson.available_cash.amount !== undefined) cash = portfolioJson.available_cash.amount;
                         else if (Array.isArray(portfolioJson.available_cash) && portfolioJson.available_cash.length > 0) cash = portfolioJson.available_cash[0].amount;
                    }

                    let positions = [];
                    if (portfolioJson.positions) {
                        positions = portfolioJson.positions.map(pos => ({
                           isin: pos.isin,
                           name: pos.name,
                           qty: parseFloat(pos.qty || pos.quantity || pos.netSize || 0),
                           avgPrice: parseFloat(pos.avgPrice || pos.buy_price || pos.averageBuyIn || 0),
                           currentPrice: parseFloat(pos.currentPrice || pos.current_price || pos.buy_price || 0),
                           totalValue: parseFloat(pos.totalValue || pos.total_value || 0),
                           pnl: parseFloat(pos.pnl || 0),
                           pnlPercent: parseFloat(pos.pnlPercent || pos.pnl_percent || 0),
                           logo: pos.logo,
                           instrumentType: pos.instrumentType || pos.instrument_type,
                           ticker: pos.ticker,
                           sector: pos.sector, 
                           country: pos.country,
                           reference_index_name: pos.reference_index_name
                        }));
                    } else if (portfolioJson.positions_detailed) {
                         positions = portfolioJson.positions_detailed.map(pos => ({
                          isin: pos.isin,
                          name: pos.name,
                          qty: parseFloat(pos.qty || pos.quantity || 0),
                          avgPrice: parseFloat(pos.avgPrice || pos.buy_price || 0),
                          currentPrice: parseFloat(pos.currentPrice || pos.current_price || 0)
                        }));
                    }
                    
                    setPortfolioData({
                        cash: parseFloat(cash),
                        positions: positions,
                        totalValue: positions.reduce((acc, p) => acc + (p.qty * p.currentPrice), 0) + parseFloat(cash),
                        dayChange: 0,
                        dayChangePct: 0
                    });

                    if (!isBackground) setLoadingSteps(prev => ({ 
                        ...prev, 
                        global: { ...prev.global, status: 'success' }, 
                        news: { ...prev.news, status: 'success' },
                        earnings: { ...prev.earnings, status: 'success' }, // Assume success if provided in allData
                        sectors: { ...prev.sectors, status: 'success' },
                        forecasts: { ...prev.forecasts, status: 'success' },
                        analyses: { ...prev.analyses, status: 'success' }
                    }));
                } else {
                    if (!isBackground) setLoadingSteps(prev => {
                        const newSteps = { ...prev };
                        Object.keys(newSteps).forEach(k => newSteps[k] = { ...newSteps[k], status: 'running', label: k === 'global' ? 'Chargement en cours...' : newSteps[k].label });
                        return newSteps;
                    });
                     // Retry logic implicit via auto-refresh loop
                }
            } catch(e) { 
                console.error("Erreur chargement global:", e); 
                if (!isBackground) setLoadingSteps(prev => {
                    const newSteps = { ...prev };
                    Object.keys(newSteps).forEach(k => newSteps[k] = { ...newSteps[k], status: 'running', label: k === 'global' ? 'Chargement en cours...' : newSteps[k].label });
                    return newSteps;
                });
            }

            // Les fetchers individuels sont conservés en tâche de fond ou si manquants
            // ... (rest of code)
          } catch (error) {
            console.error('Erreur globale refresh:', error);
            if (!isBackground) {
                setError("Impossible de charger les données du terminal.");
                addNotification("Erreur de chargement", "Vérifiez que le backend est lancé.", "error");
            }
          } finally {
             if (!isBackground) setLoading(false);
          }
      }, []);


      // Suggestions d'investissement
      const investmentSuggestions = useMemo(() => {
        
        // 1. SELECTION UTILISATEUR (Best Sectors)
        if (selectedSector && sectorsPerformance && sectorsPerformance[selectedSector]) {
             const sectorData = sectorsPerformance[selectedSector];
             if (sectorData.stocks && sectorData.stocks.length > 0) {
                 return sectorData.stocks.map(s => ({
                    ...s,
                    sector: selectedSector,
                    reason: `Focus Secteur: ${selectedSector}`,
                    score: 0 // Sera calculé par le backend
                }));
             }
        }

        // Si aucun secteur n'est sélectionné, ne retourner aucune suggestion
        if (!selectedSector) return [];

        if (!sectorTrends) return [];
        
        // Mode LISTE GLOBALE (PDF/Discovery)
        if (sectorTrends["Global Universe"]) {
            const allItems = sectorTrends["Global Universe"].details || [];
            const currentIsins = new Set(portfolioData?.positions?.map(p => p.isin) || []);
            
            // On filtre ceux déjà en portefeuille
            const candidates = allItems.filter(s => s.isin && !currentIsins.has(s.isin));

            if (candidates.length > 0) {
                // Shuffle et Pick pour analyse "Découverte" large
                // UPDATE: L'utilisateur veut TOUT le marché. On envoie tout.
                // Attention: Cela peut prendre du temps côté Backend.
                const shuffled = [...candidates].sort(() => 0.5 - Math.random());
                return shuffled.map(s => ({
                    ...s,
                    sector: s.sector || 'Discovery',
                    reason: 'Market Scan',
                    score: 0
                }));
            }
            return [];
        }

        const allSuggestions = [];
        
        Object.entries(sectorTrends).forEach(([sector, data]) => {
          if (data && data.details && Array.isArray(data.details)) {
              // On élargit la sélection : TOUS les candidats positifs
              if (data.monthly_trend > 0) {
                 data.details
                  .filter(s => (s.month_change_pct || s.change_pct || 0) > 0) // Filtre de base (compat old/new)
                  .forEach(stock => {
                      const perf = stock.month_change_pct || stock.change_pct || 0;
                      allSuggestions.push({
                          ...stock,
                          sector: sector,
                          reason: `Sector Trend`,
                          score: perf // Score temporaire
                      });
                  });
              }
          }
        });

        // Filtrer ceux déjà en portefeuille et déduplication
        const currentIsins = new Set(portfolioData?.positions?.map(p => p.isin) || []);
        const uniqueTickers = new Set();
        
        return allSuggestions
            .filter(s => {
                if (!s.isin) return false;
                if (currentIsins.has(s.isin)) return false;
                if (s.ticker && uniqueTickers.has(s.ticker)) return false;
                if (s.ticker) uniqueTickers.add(s.ticker);
                return true; 
            })
            // Plus de limite slice ici, le backend fera le tri
            .sort((a, b) => b.score - a.score);
      }, [sectorTrends, portfolioData, selectedSector, sectorsPerformance]);

      // Validation des suggestions par le backend

      // Validation Fondamentale des Suggestions
      const lastValidatedTickers = useRef("");

      useEffect(() => {
        if (investmentSuggestions.length > 0) {
            // Créer une signature unique pour la liste actuelle de suggestions
            const currentTickers = investmentSuggestions
                .map(s => s.ticker || s.isin)
                .sort()
                .join(',');

            // Si la liste des tickers n'a pas changé, on ne relance pas l'analyse
            if (currentTickers === lastValidatedTickers.current) {
                return;
            }
            
            lastValidatedTickers.current = currentTickers;

            const validateStocks = async () => {
                setSuggestionsLoading(true);
                setValidatedSuggestions([]); // Clear previous
                setAnalysisDone(false);
                
                // Animation par étapes simulées
                setLoadingStep("Initialisation de l'analyse IA...");
                
                // Timers pour simuler la progression des étapes pendant l'attente
                const timers = [];
                timers.push(setTimeout(() => setLoadingStep("Résolution des ISINs & Récupération Market Data..."), 1500));
                timers.push(setTimeout(() => setLoadingStep("Analyse Technique Multi-Timeframes (1W, 1M, 6M)..."), 4500));
                timers.push(setTimeout(() => setLoadingStep("Calcul des Scores Fondamentaux (Value, Quality, Growth)..."), 8000));
                timers.push(setTimeout(() => setLoadingStep("Filtrage & Validation Finale..."), 12000));

                try {
                    // Préparer les tickers pour l'API (Ticker ou ISIN)
                    const validCandidates = investmentSuggestions; 
                    const tickersToValidate = validCandidates.map(s => s.ticker || s.isin).filter(Boolean);

                    if (tickersToValidate.length === 0) {
                         setSuggestionsLoading(false);
                         setAnalysisDone(true);
                         timers.forEach(clearTimeout);
                         return;
                    }

                    // Envoi de TOUS les candidats au backend
                    const response = await fetch(API_BASE + '/api/analyze-fundamentals', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ tickers: tickersToValidate })
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        // Merger les résultats validés
                        const methodicallyValidated = [];
                        
                        data.results.forEach(res => {
                            // Tentative de retrouver l'original pour garder les métadonnées (ex: reason)
                            // res.symbol est le Ticker final.
                            const original = validCandidates.find(s => s.ticker === res.symbol || s.isin === res.symbol);
                            
                            methodicallyValidated.push({
                                ...(original || {}),
                                ...res,
                                finalScore: res.score // Score du backend (mixte tech + funda)
                            });
                        });
                        
                        // Afficher tous les résultats retournés par le backend (qui a déjà filtré les meilleurs)
                        setValidatedSuggestions(methodicallyValidated);
                    }
                } catch (e) {
                    console.error("Erreur validation suggestions:", e);
                } finally {
                    timers.forEach(clearTimeout);
                    setSuggestionsLoading(false);
                    setLoadingStep('');
                    setAnalysisDone(true);
                }
            };
            
            // Debounce un peu plus long car la liste est grosse
            const timeoutId = setTimeout(validateStocks, 1500);
            return () => clearTimeout(timeoutId);
        } else {
            setValidatedSuggestions([]);
            setAnalysisDone(false);
        }
      }, [investmentSuggestions]);


      // Rafraîchir Bloomberg News périodiquement (5 min) - seulement si actif
      useEffect(() => {
        let refreshInterval = null;
        
        const handleVisibilityChange = () => {
          if (document.hidden) {
            // Page cachée - arrêter le refresh
            if (refreshInterval) {
              clearInterval(refreshInterval);
              refreshInterval = null;
            }
          } else {
            // Page active - démarrer le refresh
            if (!refreshInterval) {
              console.log('[TIMER] Démarrage du refresh Bloomberg News (5 min)');
              refreshInterval = setInterval(() => {
                console.log('[TIMER] Refresh Bloomberg News...');
                loadBloombergNewsWithCache();
              }, 5 * 60 * 1000); // 5 minutes
            }
          }
        };
        
        // Ajouter listener pour la visibilité
        document.addEventListener('visibilitychange', handleVisibilityChange);
        
        // Démarrer le refresh au montage
        console.log('[TIMER] Démarrage du refresh Bloomberg News (5 min)');
        refreshInterval = setInterval(() => {
          console.log('[TIMER] Refresh Bloomberg News...');
          loadBloombergNewsWithCache();
        }, 5 * 60 * 1000); // 5 minutes
        
        return () => {
          if (refreshInterval) clearInterval(refreshInterval);
          document.removeEventListener('visibilitychange', handleVisibilityChange);
        };
      }, []);

      // Helpers
      const getImpactColor = (impact) => {
        switch(impact) {
          case 'High': return 'bg-red-50 text-red-700 border-red-200';
          case 'Medium': return 'bg-yellow-50 text-yellow-700 border-yellow-200';
          case 'Low': return 'bg-indigo-50 text-indigo-700 border-indigo-200';
          case 'Holiday': return 'bg-purple-50 text-purple-700 border-purple-200';
          default: return 'bg-slate-50 text-slate-600 border-slate-200';
        }
      };

      // --- LOGIC MANUAL SEARCH ---
      const [manualSearchLoading, setManualSearchLoading] = useState(false);

      // --- ASSETS TAB GLOBAL SEARCH ---
      const [assetsSearchQuery, setAssetsSearchQuery] = useState('');
      const [currentAssetData, setCurrentAssetData] = useState(null);
      const [assetsLoading, setAssetsLoading] = useState(false);
      const [aiAnalysisData, setAiAnalysisData] = useState(null);
      const [aiAnalysisLoading, setAiAnalysisLoading] = useState(false);
      const [aiAnalysisError, setAiAnalysisError] = useState(null);
      const [aiActiveTab, setAiActiveTab] = useState('study');
      const aiChartRef = React.useRef(null);
      const aiChartInstance = React.useRef(null);

      const handleAssetsGlobalSearch = async (tickerInput) => {
          if (!tickerInput) return;
          const ticker = tickerInput.trim().toUpperCase();
          setAssetsLoading(true);
          setCurrentAssetData(null);
          setAiAnalysisData(null);
          setAiAnalysisError(null);
          
          try {
              // 1. Fetch Insiders (from global cache or specific if needed)
              let insiderList = [];
              // Try cache first
              if (insiderData && insiderData[ticker]) {
                  insiderList = insiderData[ticker].all || [];
              } else {
                  // Fallback: Refresh
                  try {
                      const r = await fetch(API_BASE + '/api/refresh/insiders', {
                          method: 'POST',
                          headers: {'Content-Type': 'application/json'},
                          body: JSON.stringify({ tickers: [ticker] })
                      });
                      const d = await r.json();
                      if (d.data && d.data[ticker]) {
                          insiderList = d.data[ticker].all || [];
                      }
                  } catch (e) { console.error("Insiders fetch error", e); }
              }

              // 2. Fetch Senators
              let senatorList = [];
              try {
                  const searchRes = await fetch(`${API_BASE}/api/senator-trades/search?q=${ticker}`);
                  const searchJson = await searchRes.json();
                  if (searchJson && searchJson.results && searchJson.results.length > 0) {
                      const issuerId = searchJson.results[0].issuer_id;
                      const tradesRes = await fetch(`${API_BASE}/api/senator-trades?issuer_id=${issuerId}`);
                      const tradesJson = await tradesRes.json();
                      // FIX: accèder à data.trades car la réponse est encapsulée dans { data: { trades: ... } }
                      if (tradesJson.data && tradesJson.data.trades) {
                          senatorList = tradesJson.data.trades;
                      } else if (tradesJson.trades) {
                          // Fallback au cas où l'API change
                          senatorList = tradesJson.trades;
                      }
                  }
              } catch (e) { console.error("Senators fetch error", e); }
              
              // 3. Institutional (Holders + 13F + generic)
              let instData = {};
              try {
                  const instRes = await fetch(`${API_BASE}/api/institutional/stock/${ticker}`);
                  const res = await instRes.json();
                  // Extract 'data' property because API returns { status: 'success', data: { ... } }
                  instData = res.data || {};
              } catch(e) { console.error("Institutional fetch error", e); }

              // Adapt structure for UI (Mapping flat backend response to nested UI expectations)
              const adaptedInstData = {
                  ...instData,
                  // Ensure both flat and nested access works
                  yahoo_holders: instData.yahoo_holders || [],
                  mutual_funds: instData.mutual_funds || [],
                  ownership: {
                      yahoo_holders: instData.yahoo_holders || [],
                      mutual_funds: instData.mutual_funds || []
                  },
                  // Placeholder for 13F if missing
                  f13: instData.f13 || [] 
              };

              setCurrentAssetData({
                  ticker,
                  insiders: insiderList.sort((a,b) => new Date(a.date) - new Date(b.date)), // Date croissante
                  senators: senatorList,
                  institutional: adaptedInstData,
                  enriched: null  // will be filled by parallel fetch below
              });

              // 4. Enriched data (sentiment, annual returns, momentum, financials) — fetch async
              fetch(`${API_BASE}/api/assets/enriched/${ticker}`)
                  .then(r => r.json())
                  .then(enriched => setCurrentAssetData(prev => prev && prev.ticker === ticker ? { ...prev, enriched } : prev))
                  .catch(e => console.warn("Enriched fetch error:", e));

          } catch (error) {
              console.error("Global Asset Search Error:", error);
              addNotification("Erreur lors de l'analyse de l'actif", "error");
          } finally {
              setAssetsLoading(false);
          }
      };

      const fetchAiAnalysis = async (ticker) => {
          if (!ticker) return;
          setAiAnalysisLoading(true);
          setAiAnalysisData(null);
          setAiAnalysisError(null);
          setAiActiveTab('study');
          try {
              const res = await fetch(`${API_BASE}/api/assets/ai-analysis/${ticker.trim().toUpperCase()}`);
              const data = await res.json();
              if (data.status === 'success') {
                  setAiAnalysisData(data);
              } else {
                  setAiAnalysisError(data.message || 'Erreur inconnue');
              }
          } catch (e) {
              setAiAnalysisError(`Erreur réseau : ${e.message}`);
          } finally {
              setAiAnalysisLoading(false);
          }
      };

      // Render AI price chart when data arrives
      React.useEffect(() => {
          if (!aiAnalysisData?.price_history?.length || !aiChartRef.current) return;
          if (aiChartInstance.current) { aiChartInstance.current.destroy(); aiChartInstance.current = null; }
          const labels = aiAnalysisData.price_history.map(p => p.date);
          const prices = aiAnalysisData.price_history.map(p => p.price);
          const ctx = aiChartRef.current.getContext('2d');
          const gradient = ctx.createLinearGradient(0, 0, 0, 220);
          gradient.addColorStop(0, 'rgba(203,60,29,0.18)');
          gradient.addColorStop(1, 'rgba(203,60,29,0.01)');
          aiChartInstance.current = new Chart(ctx, {
              type: 'line',
              data: {
                  labels,
                  datasets: [{
                      label: aiAnalysisData.ticker,
                      data: prices,
                      borderColor: '#cb3c1d',
                      borderWidth: 2.5,
                      backgroundColor: gradient,
                      fill: true,
                      tension: 0.35,
                      pointRadius: 3,
                      pointBackgroundColor: '#cb3c1d',
                      pointHoverRadius: 5,
                  }]
              },
              options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: {
                      legend: { display: false },
                      tooltip: {
                          callbacks: {
                              label: ctx => `${ctx.parsed.y.toFixed(2)} ${aiAnalysisData.currency || ''}`
                          }
                      }
                  },
                  scales: {
                      x: { grid: { display: false }, ticks: { font: { size: 10 }, maxTicksLimit: 6 } },
                      y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 }, callback: v => `${v.toFixed(0)}` } }
                  }
              }
          });
          return () => { if (aiChartInstance.current) { aiChartInstance.current.destroy(); aiChartInstance.current = null; } };
      }, [aiAnalysisData, aiActiveTab]);

      const renderAiText = (text) => {
          if (!text) return null;
          // Convert bold **text** and bullet points to JSX
          const lines = text.split('\n');
          return lines.map((line, i) => {
              if (!line.trim()) return React.createElement('div', { key: i, className: 'h-2' });
              // Heading lines (all caps or starts with emoji + uppercase)
              if (/^[A-Z\s\d\u{1F300}-\u{1FFFF}]{4,}$/u.test(line.trim()) || /^\d+\.\s+[A-Z]/.test(line.trim())) {
                  return React.createElement('div', { key: i, className: 'text-xs font-bold text-slate-700 uppercase tracking-wider mt-3 mb-1 border-b border-slate-100 pb-1' }, line);
              }
              // Bullet points
              if (line.trim().startsWith('-') || line.trim().startsWith('•') || line.trim().startsWith('*')) {
                  const content = line.trim().replace(/^[-•*]\s*/, '');
                  // Parse **bold** inline
                  const parts = content.split(/(\*\*[^*]+\*\*)/g).map((part, j) =>
                      part.startsWith('**') ? React.createElement('strong', { key: j, className: 'text-slate-800' }, part.slice(2, -2)) : part
                  );
                  return React.createElement('div', { key: i, className: 'flex gap-2 text-xs text-slate-600 leading-relaxed' },
                      React.createElement('span', { className: 'text-[#cb3c1d] mt-0.5 shrink-0' }, '▸'),
                      React.createElement('span', null, ...parts)
                  );
              }
              // Regular line with **bold** parsing
              const parts = line.split(/(\*\*[^*]+\*\*)/g).map((part, j) =>
                  part.startsWith('**') ? React.createElement('strong', { key: j, className: 'text-slate-800' }, part.slice(2, -2)) : part
              );
              return React.createElement('p', { key: i, className: 'text-xs text-slate-600 leading-relaxed' }, ...parts);
          });
      };
      
      const handleExecuteSearch = async (tickerInput) => {
          if (!tickerInput) return;
          setManualSearchLoading(true);
          try {
              // Nettoyage ticker
              let ticker = tickerInput.trim().toUpperCase();
              
              // Call API
              const response = await fetch(API_BASE + '/api/analyze-fundamentals', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ tickers: [ticker] }) // Single item array
              });
              
              if (response.ok) {
                  const data = await response.json();
                  if (data.results && data.results.length > 0) {
                      // On ouvre la modale avec le résultat
                      const result = data.results[0];
                      // Il faut adapter si des champs manquent par rapport à ce que la modale attend
                      // La modale attend: name, ticker, isin (optionnel logo), sector, month_change_pct (perfs ?), score, validations...
                      // L'API renvoie 'perfs' {1w, 1m...}. On peut mapper perfs.1m sur month_change_pct pour affichage
                      
                      const adaptedStock = {
                          ...result,
                          ticker: result.symbol,
                          name: result.name || result.symbol, // Backend updated pour renvoyer name
                          month_change_pct: result.perfs ? (result.perfs['1m']*100).toFixed(2) : 0, // Fallback
                          // score et validations sont déjà dedans
                      };
                      
                      setSelectedStockDetails(adaptedStock);
                  } else {
                      // Pas de résultat (ticker invalide ?)
                      alert(`Aucune donnée trouvée pour ${ticker}. Vérifiez le symbole (ex: AAPL, MC.PA).`);
                  }
              }
          } catch (e) {
              console.error("Search error:", e);
              alert("Erreur lors de la recherche.");
          } finally {
              setManualSearchLoading(false);
          }
      };

      const formatDate = (dateStr) => {
        const date = new Date(dateStr);
        return date.toLocaleDateString('fr-FR', {
          day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
        });
      };
      
      const filteredInsiders = useMemo(() => {
        if (!insiderData) return [];
        
        const onlyValidRows = (rows) => (rows || []).filter(tx => {
          const okType = ['Sale','Buy','Proposed Sale'].includes(tx.transaction);
          const okDate = typeof tx.date === 'string' && tx.date.length > 0;
          return okType && okDate;
        });

        // Use portfolioTickers if available, otherwise use all available tickers in insiderData
        const tickersToUse = (portfolioTickers && portfolioTickers.size > 0) 
          ? Array.from(portfolioTickers) 
          : Object.keys(insiderData);

        const result = [];
        tickersToUse.forEach(ticker => {
          const block = insiderData[ticker];
          if (!block) return;
          const all = onlyValidRows(block.all || block);
          const recent7 = onlyValidRows(block.recent_7days || block.recent7days || []);
          if (all.length > 0) {
            result.push({ ticker, all, recent7 });
          }
        });
        
        result.sort((a,b) => a.ticker.localeCompare(b.ticker));
        return result;
      }, [insiderData, portfolioTickers]);

      // Ref pour suivre les tickers déjà demandés pour éviter les boucles infinies
      const requestedInsidersRef = useRef(new Set());

      // Auto-refresh missing insiders for tickers present in the portfolio.
      useEffect(() => {
        let mounted = true;
        const doRefreshMissing = async () => {
          try {
            if (!portfolioTickers || portfolioTickers.size === 0) return;
            
            // compute which tickers are missing from the insider cache AND haven't been requested yet
            const missing = Array.from(portfolioTickers).filter(t => 
                (!insiderData || !insiderData[t]) && !requestedInsidersRef.current.has(t)
            );
            
            if (missing.length === 0) return;
            
            // Mark them as requested so we don't try again repeatedly
            missing.forEach(t => requestedInsidersRef.current.add(t));

            setInsidersLoading(true);
            // request refresh for missing tickers
            try {
              await fetch(API_BASE + '/api/refresh/insiders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tickers: missing })
              });
            } catch (e) {
              console.warn('auto refresh insiders call failed', e);
            }

            // always fetch cache afterwards and update local state
            try {
              const cacheResp = await fetch(API_BASE + '/api/data/insiders');
              if (cacheResp.ok) {
                const cacheJson = await cacheResp.json();
                if (!mounted) return;
                setInsiderData(cacheJson);
              }
            } catch (e) {
              console.warn('auto fetch insiders cache failed', e);
            }
          } finally {
            if (mounted) setInsidersLoading(false);
          }
        };

        doRefreshMissing();
        return () => { mounted = false };
      }, [portfolioTickers, insiderData]);

      // Charger les bank forecasts et analyses au démarrage
      // Toujours re-fetche au rechargement de page — si le backend signale un refresh
      // en cours, re-fetche automatiquement après 40s pour afficher les nouveaux articles.
      useEffect(() => {
        let mounted = true;
        let retryTimer = null;

        const loadBankData = async ({ isRetry = false } = {}) => {
          try {
            if (!isRetry) setBankForecastsLoading(true);
            // Charger les forecasts
            const forecastsResponse = await fetch(API_BASE + '/api/bank-forecasts');
            if (forecastsResponse.ok) {
              const forecastsData = await forecastsResponse.json();
              if (mounted && forecastsData) {
                const items = Array.isArray(forecastsData)
                  ? forecastsData
                  : (forecastsData.results || []);
                setBankForecasts(items);
                setBankRefreshing(forecastsData.refreshing === true);

                // Si le backend indique qu'un re-scrape est en cours, on re-fetche dans 40s
                if (forecastsData.refreshing && !isRetry) {
                  console.log('[BankForecasts] Re-scrape en cours, retry dans 40s...');
                  retryTimer = setTimeout(() => {
                    if (mounted) loadBankData({ isRetry: true });
                  }, 40000);
                } else {
                  setBankRefreshing(false);
                }
              }
            }
            
            // Charger les analyses
            const analysesResponse = await fetch(API_BASE + '/api/bank-analyses');
            if (analysesResponse.ok) {
              const analysesData = await analysesResponse.json();
              if (mounted && analysesData) {
                if (Array.isArray(analysesData)) {
                  setBankAnalyses(analysesData);
                } else if (analysesData.results) {
                  setBankAnalyses(analysesData.results);
                }
              }
            }
          } catch (e) {
            console.warn('Erreur chargement bank forecasts:', e);
          } finally {
            if (mounted && !isRetry) setBankForecastsLoading(false);
          }
        };
        
        loadBankData();
        return () => { mounted = false; if (retryTimer) clearTimeout(retryTimer); };
      }, []);

      // --- DATA LOADING & ACTIONS ---
      
      const loadSectorTrends = async () => {
        try {
          // Utilisation du endpoint spécifique pour les tendances mensuelles
          const resp = await fetch(API_BASE + '/api/sector-trends?t=' + Date.now());
          if (resp.ok) {
            const data = await resp.json();
            setSectorTrends(data);
          }
        } catch (e) {
          console.warn('Erreur chargement sector trends:', e);
        }
      };

      const refreshSectorTrends = async () => {
        setSectorRefreshLoading(true);
        try {
          await fetch(API_BASE + '/api/sector-trends/refresh', { method: 'POST' });
          addNotification("Mise à jour des secteurs lancée en arrière-plan...", "info");
          // Re-fetch après un délai pour laisser le scraping démarrer
          setTimeout(async () => {
            await loadSectorTrends();
            setSectorRefreshLoading(false);
          }, 6000);
        } catch (e) {
          console.warn('Erreur refresh sector trends:', e);
          setSectorRefreshLoading(false);
        }
      };

      const refreshPdfData = async () => {
          try {
              addNotification("Téléchargement et analyse du PDF en cours...", "info");
              const response = await fetch(API_BASE + '/api/pdf/refresh', { method: 'POST' });
              const result = await response.json();
              if (response.ok) {
                  addNotification(result.message, "success");
                  loadSectorTrends(); // Reload data
              } else {
                  addNotification("Erreur lors de la mise à jour PDF: " + result.message, "error");
              }
          } catch (e) {
              console.error("Erreur refresh PDF", e);
              addNotification("Erreur système lors du refresh PDF", "error");
          }
      };

      // Charger les tendances sectorielles (Empêcher le polling infini si vide)
      useEffect(() => {
        // if (sectorTrends && Object.keys(sectorTrends).length > 0) return; // <-- CAUSE DE LA BOUCLE: Si vide, ça relance.
        let mounted = true;
        
        // On charge une seule fois au montage, ou explicitement via bouton refresh
        const initLoad = async () => {
             await loadSectorTrends();
        };
        
        initLoad();
        
        return () => { mounted = false };
      }, []); // Empty dependency array = Run once on mount

      // Auto-refresh sector trends if data is older than 4h
      useEffect(() => {
        if (!sectorTrends || sectorAutoRefreshedRef.current || sectorRefreshLoading) return;
        const lastUpdates = Object.values(sectorTrends)
          .map(d => d.last_updated).filter(Boolean).map(d => new Date(d));
        if (lastUpdates.length === 0) return;
        const mostRecent = new Date(Math.max(...lastUpdates));
        const hoursSince = (Date.now() - mostRecent.getTime()) / (1000 * 60 * 60);
        if (hoursSince >= 4) {
          console.log(`[Secteurs] Données vieilles de ${hoursSince.toFixed(1)}h — relance automatique`);
          sectorAutoRefreshedRef.current = true;
          refreshSectorTrends();
        }
      }, [sectorTrends]); // eslint-disable-line react-hooks/exhaustive-deps

      // Keep-alive : ping TR toutes les 10 minutes pour maintenir la session HTTP côté serveur
      useEffect(() => {
        const ping = () => fetch(API_BASE + '/api/tr/keepalive', { method: 'POST' })
          .then(r => r.json())
          .then(d => console.log('[Keepalive] TR session ping:', d.status))
          .catch(() => {});
        ping(); // Ping immédiat au montage
        const id = setInterval(ping, 10 * 60 * 1000); // Toutes les 10 min
        return () => clearInterval(id);
      }, []);

      // --- API FETCHERS ---
      // (Supposé que tout est géré localement dans les useEffect)

      const BankDetailsModal = ({ forecast, analyses, onClose }) => {
        if (!forecast) return null;
        const analysis = analyses ? analyses.find(a => a.bank === forecast.bank) : null;
        const bankIcons = {
            'JPMorgan':        'https://logo.clearbit.com/jpmorganchase.com',
            'BNP Paribas':     'https://logo.clearbit.com/bnpparibas.com',
            'Société Générale':'https://logo.clearbit.com/societegenerale.com',
            'Deloitte':        'https://logo.clearbit.com/deloitte.com',
            'McKinsey':        'https://logo.clearbit.com/mckinsey.com',
            'Barclays':        'https://logo.clearbit.com/barclays.com',
            'BlackRock':       'https://logo.clearbit.com/blackrock.com',
            'Goldman Sachs':   'https://logo.clearbit.com/goldmansachs.com',
            'Morgan Stanley':  'https://logo.clearbit.com/morganstanley.com',
            'UBS':             'https://logo.clearbit.com/ubs.com',
            'Deutsche Bank':   'https://logo.clearbit.com/db.com',
            'HSBC':            'https://logo.clearbit.com/hsbc.com',
            'Credit Suisse':   'https://logo.clearbit.com/credit-suisse.com',
            'Citi':            'https://logo.clearbit.com/citigroup.com',
        };
        const logoUrl = bankIcons[forecast.bank];
        const bankPalette = ['#1e40af','#065f46','#6d28d9','#92400e','#1e3a5f','#7f1d1d','#064e3b','#312e81'];
        const bankColor = bankPalette[forecast.bank.charCodeAt(0) % bankPalette.length];
        const bankInitials = forecast.bank.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();

        return (
          <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-400/50 backdrop-blur-sm" onClick={onClose}>
            <div className="bg-white border border-slate-200 w-full max-w-4xl rounded-2xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col" onClick={e => e.stopPropagation()}>
               {/* Header */}
               <div className="relative p-6 border-b border-slate-200 bg-slate-50/50 flex items-center justify-between">
                  <div className="flex items-center gap-4">
                     <div className="w-16 h-16 rounded-xl overflow-hidden border border-slate-200 shadow-sm flex-shrink-0">
                        {logoUrl
                          ? <img src={logoUrl} alt={forecast.bank} className="w-full h-full object-cover"
                              onError={e=>{ e.target.style.display='none'; e.target.parentElement.style.background=bankColor; e.target.parentElement.innerHTML=`<span style='color:#fff;font-weight:700;font-size:1.25rem;display:flex;align-items:center;justify-content:center;width:100%;height:100%'>${bankInitials}</span>`; }} />
                          : <div style={{background:bankColor}} className="w-full h-full flex items-center justify-center"><span className="text-white font-bold text-xl">{bankInitials}</span></div>
                        }
                     </div>
                     <div>
                        <h2 className="text-2xl font-bold text-slate-800">{forecast.bank}</h2>
                        <div className="text-sm text-slate-500 font-mono">
                           Mise à jour: {new Date(forecast.timestamp).toLocaleDateString()}
                        </div>
                     </div>
                  </div>
                  <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-lg text-slate-400 hover:text-slate-600">
                     <X className="w-6 h-6" />
                  </button>
               </div>
               
               <div className="p-8 overflow-y-auto custom-scrollbar flex-1">
                  {/* Analysis Box */}
                  <div className="bg-purple-50 rounded-xl p-6 border border-purple-100 mb-8 relative">
                     <div className="flex items-center gap-2 mb-4">
                        <Sparkles className="w-5 h-5 text-purple-600" />
                        <h3 className="font-bold text-purple-800 uppercase tracking-wider text-sm">Analyse IA Synthétisée</h3>
                     </div>
                     {analysis ? (
                       <div className="prose prose-sm prose-purple max-w-none text-slate-700 leading-relaxed whitespace-pre-line">
                          {analysis.analysis_text || analysis.summary || "Contenu de l'analyse non disponible."}
                          {analysis.interpretation && (
                              <div className="mt-4 pt-4 border-t border-purple-200">
                                  <strong>Interprétation :</strong> {analysis.interpretation}
                              </div>
                          )}
                       </div>
                     ) : (
                       <div className="text-slate-400 italic">Aucune analyse synthétique disponible pour le moment.</div>
                     )}
                  </div>

                  {/* Reports & Titles */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                     <div>
                        <h4 className="font-bold text-slate-800 mb-4 flex items-center gap-2">
                           <span className="w-1 h-6 bg-indigo-500 rounded-full"></span>
                           Sujets & Titres Récents
                        </h4>
                        <ul className="space-y-3">
                           {forecast.titles && forecast.titles.map((t, i) => (
                              <li key={i} className="flex gap-3 items-start p-3 bg-slate-50 rounded-lg border border-slate-100">
                                 <span className="mt-1.5 w-1.5 h-1.5 rounded-full bg-slate-400 flex-shrink-0"></span>
                                 <span className="text-sm text-slate-700">{t}</span>
                              </li>
                           ))}
                        </ul>
                     </div>
                     <div>
                        <h4 className="font-bold text-slate-800 mb-4 flex items-center gap-2">
                           <span className="w-1 h-6 bg-emerald-500 rounded-full"></span>
                           Sources & Rapports
                        </h4>
                        <div className="flex flex-col gap-3">
                           {forecast.reports && forecast.reports.map((r, i) => (
                              <a key={i} href={r} target="_blank" className="flex items-center gap-3 p-4 bg-white border border-slate-200 rounded-xl hover:border-emerald-300 hover:shadow-md transition-all group">
                                 <div className="w-10 h-10 bg-emerald-50 rounded-full flex items-center justify-center group-hover:bg-emerald-100 transition-colors">
                                    <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                                 </div>
                                 <div className="flex-1 min-w-0">
                                    <div className="text-sm font-medium text-slate-900 truncate">Rapport PDF / Source {i+1}</div>
                                    <div className="text-xs text-slate-400 truncate">{r}</div>
                                 </div>
                                 <div className="text-slate-300 group-hover:text-emerald-500">→</div>
                              </a>
                           ))}
                           <a href={forecast.url} target="_blank" className="flex items-center gap-3 p-4 bg-white border border-slate-200 rounded-xl hover:border-indigo-300 hover:shadow-md transition-all group">
                                 <div className="w-10 h-10 bg-indigo-50 rounded-full flex items-center justify-center group-hover:bg-indigo-100 transition-colors">
                                    <Globe className="w-5 h-5 text-indigo-600" />
                                 </div>
                                 <div className="flex-1 min-w-0">
                                    <div className="text-sm font-medium text-slate-900 truncate">Page Source Principale</div>
                                    <div className="text-xs text-slate-400 truncate">{forecast.url}</div>
                                 </div>
                                 <div className="text-slate-300 group-hover:text-indigo-500">→</div>
                           </a>
                        </div>
                     </div>
                  </div>
               </div>
            </div>
          </div>
        );
      };

      const handleInstitutionalSearch = async (e) => {
          e.preventDefault();
          if (!institutionalQuery) return;
          setInstitutionalLoading(true);
          setInstitutionalAnalysis(null);
          
          const ticker = institutionalQuery.toUpperCase().trim();
          
          try {
              const [cotRes, f13Res, stockRes] = await Promise.all([
                  fetch(`${API_BASE}/api/institutional/cot/${ticker}`),
                  fetch(`${API_BASE}/api/institutional/13f/${ticker}`),
                  fetch(`${API_BASE}/api/institutional/stock/${ticker}`)
              ]);
              
              const cotData = cotRes.ok ? await cotRes.json() : {data:null};
              const f13Data = f13Res.ok ? await f13Res.json() : {data:null};
              const stockData = stockRes.ok ? await stockRes.json() : {data:null};
              
              setInstitutionalAnalysis({
                  ticker,
                  cot: cotData.data,
                  f13: f13Data.data,
                  ownership: stockData.data
              });
              addNotification("Analyse Institutionnelle", `Données chargées pour ${ticker}`, "success");
          } catch (err) {
              console.error(err);
              addNotification("Erreur Analysis Inst.", "Impossible de récupérer les données", "error");
          } finally {
              setInstitutionalLoading(false);
          }
      };

      // Loading / Error
      // 1. Initial Auth Check Loading
      if (!authChecked) {
         return (
             <div className="loading-container">
               <div className="modern-loader"><div className="loader-core"></div></div>
               <div className="loading-text">Vérification de sécurité...</div>
             </div>
         );
      }
      
      // 2. Login Screen (if not logged in)
      if (!isLoggedIn) {
          return <LoginScreen onLoginSuccess={handleLoginSuccess} />;
      }

      // 3. Loading screen (while fetching initial data OR if portfolio is missing)
      if ((loading || !portfolioData || !portfolioMetrics) && !error) {
        return (
          <div className="fixed inset-0 bg-slate-50 z-50 flex flex-col items-center justify-center font-sans">
              <div className="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
                  <div className="flex justify-center mb-8 relative">
                      <div className="modern-loader">
                          <div className="loader-core"></div>
                      </div>
                  </div>
                  
                  <h2 className="text-2xl font-bold text-center text-slate-800 mb-2">Chargement du Terminal</h2>
                  <p className="text-slate-500 text-center mb-8 text-sm">Synchronisation des données...</p>
