                                                            <span className={`ml-2 text-[10px] font-bold px-2 py-0.5 rounded font-mono ${
                                                                pos.eps_beat_rate >= 70 ? 'bg-emerald-50 text-emerald-700' :
                                                                pos.eps_beat_rate >= 50 ? 'bg-amber-50 text-amber-700' : 'bg-red-50 text-red-600'
                                                            }`}>Beat {pos.eps_beat_rate}%</span>
                                                        )}
                                                    </h5>
                                                    {qt.length > 0 ? (
                                                        <div className="space-y-2">
                                                            {qt.map((q, qi) => (
                                                                <div key={qi} className="flex items-center justify-between p-2.5 bg-slate-50 rounded-xl border border-slate-100">
                                                                    <span className="text-xs font-bold text-slate-500">{q.q}</span>
                                                                    <span className="text-sm font-mono font-bold text-slate-700">{fmtValue(q.rev)}</span>
                                                                    {q.growth != null && (
                                                                        <span className={`text-xs font-bold font-mono ${
                                                                            q.growth >= 0 ? 'text-emerald-600' : 'text-red-500'
                                                                        }`}>{q.growth >= 0 ? '+' : ''}{q.growth}%</span>
                                                                    )}
                                                                </div>
                                                            ))}
                                                            {pos.eps_last != null && (
                                                                <div className="pt-1.5 text-xs text-slate-500">Dernière surprise EPS: <span className={`font-bold ${ pos.eps_last >= 0 ? 'text-emerald-600' : 'text-red-500'}`}>{pos.eps_last >= 0 ? '+' : ''}{pos.eps_last}%</span></div>
                                                            )}
                                                        </div>
                                                    ) : <p className="text-xs text-slate-300 italic">Données non disponibles</p>}
                                                </div>
                                            </div>

                                            {/* Events + News full-width */}
                                            {(pos.upcoming_earnings || pos.upcoming_dividend || pos.news_count > 0) && (
                                                <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
                                                    <h5 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                                                        <span className="text-base">📅</span> Événements &amp; Actualités
                                                    </h5>
                                                    <div className="flex flex-col gap-3">
                                                        {(pos.upcoming_earnings || pos.upcoming_dividend) && (
                                                            <div className="flex flex-wrap gap-2">
                                                                {pos.upcoming_earnings && (
                                                                    <span className="text-sm bg-purple-50 border border-purple-200 text-purple-700 px-3 py-1.5 rounded-xl font-medium">
                                                                        📊 Résultats {pos.upcoming_earnings}{pos.eps_estimate ? ` · Est. $${pos.eps_estimate}` : ''}
                                                                    </span>
                                                                )}
                                                                {pos.upcoming_dividend && (
                                                                    <span className="text-sm bg-amber-50 border border-amber-200 text-amber-700 px-3 py-1.5 rounded-xl font-medium">
                                                                        💰 Dividende {pos.upcoming_dividend}{pos.dividend_amount ? ` · $${pos.dividend_amount}` : ''}
                                                                    </span>
                                                                )}
                                                            </div>
                                                        )}
                                                        {pos.news_count > 0 && (
                                                            <div>
                                                                <div className={`text-xs font-bold mb-1.5 ${
                                                                    pos.news_sentiment === 'positive' ? 'text-emerald-600' :
                                                                    pos.news_sentiment === 'negative' ? 'text-red-500' : 'text-slate-500'
                                                                }`}>{pos.news_count} article{pos.news_count > 1 ? 's' : ''} · {pos.news_sentiment === 'positive' ? '↑ Positif' : pos.news_sentiment === 'negative' ? '↓ Négatif' : 'Neutre'}{pos.news_score ? ` · Criticité ${pos.news_score}/10` : ''}</div>
                                                                <div className="space-y-1.5">
                                                                    {(pos.top_news || []).map((n, ni) => (
                                                                        <div key={ni} className={`text-xs p-2 rounded-lg border ${
                                                                            n.sentiment === 'positive' ? 'bg-emerald-50 border-emerald-100 text-emerald-800' :
                                                                            n.sentiment === 'negative' ? 'bg-red-50 border-red-100 text-red-800' :
                                                                            'bg-slate-50 border-slate-100 text-slate-600'
                                                                        }`}>{n.title}</div>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    );
                                }

                                // ── MULTI ASSET: Compact grid ────────────────────────
                                return (
                                    <div>
                                    <h4 className="text-sm font-bold text-slate-700 uppercase tracking-wider mb-4 flex items-center gap-2">
                                        <span className="p-1.5 bg-[#cb3c1d]/10 rounded-lg"><Activity className="w-4 h-4 text-[#cb3c1d]" /></span>
                                        Analyse Détaillée par Position
                                        <span className="ml-2 text-xs font-normal text-slate-400 normal-case">8 sources de données par actif</span>
                                    </h4>
                                    <div className="grid grid-cols-1 xl:grid-cols-2 2xl:grid-cols-3 gap-4">
                                        {result.positions_analysis.map((pos, idx) => {
                                            const si = pos.short_interest || {};
                                            const qt = pos.quarterly_trend || [];
                                            const ins = pos.insiders || [];
                                            const buyCount  = ins.filter(i => i.transaction && i.transaction.toLowerCase().includes('buy')).length;
                                            const sellCount = ins.filter(i => i.transaction && (i.transaction.toLowerCase().includes('sale') || i.transaction.toLowerCase().includes('sell'))).length;
                                            const latestQs  = qt.slice(0, 3);

                                            return (
                                                <div key={idx} className="bg-white border border-slate-200 rounded-2xl shadow-sm hover:shadow-md transition-shadow overflow-hidden">
                                                    
                                                    {/* ── Card Header ── */}
                                                    <div className="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/60">
                                                        <div className="flex items-center gap-3">
                                                            <StockLogo isin={pos.isin || ''} name={pos.ticker} />
                                                            <div>
                                                                <div className="font-bold text-slate-900 text-base leading-tight">{pos.ticker}</div>
                                                                <div className="text-[11px] text-slate-400 truncate max-w-[130px]">{pos.name}</div>
                                                            </div>
                                                        </div>
                                                        <div className="text-right">
                                                            <div className={`text-lg font-black font-mono ${(pos.pnl_percent || 0) >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>
                                                                {(pos.pnl_percent || 0) >= 0 ? '+' : ''}{(pos.pnl_percent || 0).toFixed(2)}%
                                                            </div>
                                                            {pos.annual_perf_1y != null && (
                                                                <div className={`text-[10px] font-mono ${pos.annual_perf_1y >= 0 ? 'text-emerald-500' : 'text-red-400'}`}>
                                                                    1Y {pos.annual_perf_1y >= 0 ? '+' : ''}{pos.annual_perf_1y}%
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>

                                                    {/* ── Card Body ── */}
                                                    <div className="p-4 space-y-3">

                                                        {/* 1. TECHNIQUE */}
                                                        <div className="flex items-start gap-2">
                                                            <div className="shrink-0 w-5 text-center text-sm">📈</div>
                                                            <div className="flex-1 min-w-0">
                                                                <div className="flex items-center gap-1.5 flex-wrap">
                                                                    <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full border ${
                                                                        pos.trend === 'Bullish' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' :
                                                                        pos.trend === 'Bearish' ? 'bg-red-50 text-red-700 border-red-200' :
                                                                        'bg-slate-100 text-slate-500 border-slate-200'
                                                                    }`}>{pos.trend === 'Bullish' ? '▲ Haussier' : pos.trend === 'Bearish' ? '▼ Baissier' : '— Neutre'}</span>
                                                                    {pos.rsi != null && (
                                                                        <span className={`text-[11px] font-mono px-1.5 py-0.5 rounded border font-bold ${pos.rsi < 30 ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : pos.rsi > 70 ? 'bg-red-50 text-red-700 border-red-200' : 'bg-slate-50 text-slate-600 border-slate-200'}`}>
                                                                            RSI {pos.rsi}
                                                                        </span>
                                                                    )}
                                                                    {pos.sma_cross != null && (
                                                                        <span className={`text-[10px] font-mono ${pos.sma_cross ? 'text-emerald-600' : 'text-red-500'}`}>
                                                                            {pos.sma_cross ? 'MA50>MA200' : 'MA50<MA200'}
                                                                        </span>
                                                                    )}
                                                                </div>
                                                                {pos.alerts && pos.alerts.length > 0 && (
                                                                    <div className="mt-1 flex flex-wrap gap-1">
                                                                        {pos.alerts.slice(0, 2).map((alert, ai) => (
                                                                            <span key={ai} className={`text-[10px] leading-tight ${alert.color === 'red' ? 'text-red-500' : alert.color === 'green' ? 'text-emerald-600' : 'text-sky-600'}`}>
                                                                                • {alert.message}
                                                                            </span>
                                                                        ))}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </div>

                                                        {/* 2. INSIDERS */}
                                                        <div className="flex items-start gap-2">
                                                            <div className="shrink-0 w-5 text-center text-sm">👥</div>
                                                            <div className="flex-1 min-w-0">
                                                                <div className="flex items-center gap-2 flex-wrap">
                                                                    {ins.length > 0 ? (
                                                                        <>
                                                                            <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full border ${
                                                                                pos.insider_signal === 'bullish' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' :
                                                                                pos.insider_signal === 'bearish' ? 'bg-red-50 text-red-600 border-red-200' :
                                                                                'bg-slate-50 text-slate-500 border-slate-200'
                                                                            }`}>
                                                                                {pos.insider_signal === 'bullish' ? '↑ Insiders Buy' : pos.insider_signal === 'bearish' ? '↓ Insiders Sell' : '↔ Insiders Mix'}
                                                                            </span>
                                                                            <span className="text-[10px] text-slate-400 font-mono">{buyCount}B / {sellCount}V</span>
                                                                        </>
                                                                    ) : (
                                                                        <span className="text-[11px] text-slate-400 italic">Aucune activité récente</span>
                                                                    )}
                                                                </div>
                                                                {ins.slice(0, 2).map((t, ti) => (
                                                                    <div key={ti} className="text-[10px] text-slate-500 mt-0.5 truncate">
                                                                        <span className={`font-bold ${t.transaction && t.transaction.toLowerCase().includes('buy') ? 'text-emerald-600' : 'text-red-500'}`}>
                                                                            {t.transaction}
                                                                        </span>
                                                                        {' · '}{t.name}
                                                                        {t.value ? ` · $${Number(t.value / 1000).toFixed(0)}K` : ''}
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>

                                                        {/* 3. SHORT INTEREST */}
                                                        {si.pct_float != null && (
                                                            <div className="flex items-center gap-2">
                                                                <div className="shrink-0 w-5 text-center text-sm">📉</div>
                                                                <div className="flex items-center gap-2 flex-wrap flex-1 min-w-0">
                                                                    <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full border font-mono ${
                                                                        si.pct_float > 20 ? 'bg-red-50 text-red-600 border-red-200' :
                                                                        si.pct_float > 10 ? 'bg-amber-50 text-amber-700 border-amber-200' :
                                                                        'bg-emerald-50 text-emerald-700 border-emerald-200'
                                                                    }`}>Short {si.pct_float}%</span>
                                                                    {si.ratio != null && <span className="text-[10px] text-slate-400 font-mono">{si.ratio}j cover</span>}
                                                                    {si.change_pct != null && (
                                                                        <span className={`text-[10px] font-mono font-bold ${si.change_pct > 0 ? 'text-red-500' : 'text-emerald-600'}`}>
                                                                            {si.change_pct > 0 ? '▲' : '▼'} {Math.abs(si.change_pct)}%
                                                                        </span>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        )}

                                                        {/* 4. OPTIONS */}
                                                        {pos.options_bias && (
                                                            <div className="flex items-center gap-2">
                                                                <div className="shrink-0 w-5 text-center text-sm">🎯</div>
                                                                <div className="flex items-center gap-2 flex-wrap flex-1 min-w-0">
                                                                    <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full border ${
                                                                        pos.options_bias === 'bullish' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' :
                                                                        pos.options_bias === 'bearish' ? 'bg-red-50 text-red-600 border-red-200' :
                                                                        'bg-slate-50 text-slate-500 border-slate-200'
                                                                    }`}>
                                                                        Options {pos.options_bias === 'bullish' ? '↑ Calls' : pos.options_bias === 'bearish' ? '↓ Puts' : '↔ Neutre'}
                                                                    </span>
                                                                    {pos.options_pc != null && <span className="text-[10px] text-slate-400 font-mono">P/C {pos.options_pc}</span>}
                                                                    {pos.options_call_oi != null && (
                                                                        <span className="text-[10px] text-slate-400 font-mono">
                                                                            {fmtValue(pos.options_call_oi)}C / {fmtValue(pos.options_put_oi)}P
                                                                        </span>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        )}

                                                        {/* 5. TRIMESTRIELS */}
                                                        {latestQs.length > 0 && (
                                                            <div className="flex items-start gap-2">
                                                                <div className="shrink-0 w-5 text-center text-sm">📊</div>
                                                                <div className="flex-1 min-w-0">
                                                                    <div className="flex gap-2 overflow-x-auto">
                                                                        {latestQs.map((q, qi) => (
                                                                            <div key={qi} className="shrink-0 bg-slate-50 border border-slate-100 rounded-lg p-2 min-w-[80px]">
                                                                                <div className="text-[9px] text-slate-400 font-bold mb-0.5">{q.q}</div>
                                                                                <div className="text-[11px] font-mono font-bold text-slate-700">{fmtValue(q.rev)}</div>
                                                                                {q.growth != null && (
                                                                                    <div className={`text-[10px] font-bold ${q.growth >= 0 ? 'text-emerald-600' : 'text-red-500'}`}>
                                                                                        {q.growth >= 0 ? '+' : ''}{q.growth}%
                                                                                    </div>
                                                                                )}
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        )}

                                                        {/* 6. EPS */}
                                                        {(pos.eps_beat_rate != null || pos.eps_last != null) && (
                                                            <div className="flex items-center gap-2">
                                                                <div className="shrink-0 w-5 text-center text-sm">⚡</div>
                                                                <div className="flex items-center gap-2 flex-wrap flex-1 min-w-0">
                                                                    {pos.eps_beat_rate != null && (
                                                                        <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full border font-mono ${
                                                                            pos.eps_beat_rate >= 70 ? 'bg-emerald-50 text-emerald-700 border-emerald-200' :
                                                                            pos.eps_beat_rate >= 50 ? 'bg-amber-50 text-amber-700 border-amber-200' :
                                                                            'bg-red-50 text-red-600 border-red-200'
                                                                        }`}>EPS beat {pos.eps_beat_rate}%</span>
                                                                    )}
                                                                    {pos.eps_last != null && (
                                                                        <span className={`text-[10px] font-mono font-bold ${pos.eps_last >= 0 ? 'text-emerald-600' : 'text-red-500'}`}>
                                                                            Dernier {pos.eps_last >= 0 ? '+' : ''}{pos.eps_last}%
                                                                        </span>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        )}

                                                        {/* 7. UPCOMING EVENTS */}
                                                        {(pos.upcoming_earnings || pos.upcoming_dividend) && (
                                                            <div className="flex items-start gap-2">
                                                                <div className="shrink-0 w-5 text-center text-sm">📅</div>
                                                                <div className="flex flex-wrap gap-1.5 flex-1 min-w-0">
                                                                    {pos.upcoming_earnings && (
                                                                        <span className="text-[11px] bg-purple-50 border border-purple-200 text-purple-700 px-2 py-0.5 rounded-lg font-medium">
                                                                            Résultats {pos.upcoming_earnings}{pos.eps_estimate ? ` · Est. $${pos.eps_estimate}` : ''}
                                                                        </span>
                                                                    )}
                                                                    {pos.upcoming_dividend && (
                                                                        <span className="text-[11px] bg-amber-50 border border-amber-200 text-amber-700 px-2 py-0.5 rounded-lg font-medium">
                                                                            Dividende {pos.upcoming_dividend}{pos.dividend_amount ? ` · $${pos.dividend_amount}` : ''}
                                                                        </span>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        )}

                                                        {/* 8. NEWS */}
                                                        {pos.news_count > 0 && (
                                                            <div className="flex items-start gap-2">
                                                                <div className="shrink-0 w-5 text-center text-sm">📰</div>
                                                                <div className="flex-1 min-w-0">
                                                                    <div className="flex items-center gap-1.5 flex-wrap">
                                                                        <span className={`text-[11px] font-bold ${pos.news_sentiment === 'positive' ? 'text-emerald-600' : pos.news_sentiment === 'negative' ? 'text-red-500' : 'text-slate-500'}`}>
                                                                            {pos.news_count} article{pos.news_count > 1 ? 's' : ''} · {pos.news_sentiment === 'positive' ? '↑ Positif' : pos.news_sentiment === 'negative' ? '↓ Négatif' : 'Neutre'}
                                                                        </span>
                                                                        {pos.news_score && <span className="text-[10px] text-slate-400 font-mono">{pos.news_score}/10</span>}
                                                                    </div>
                                                                    {pos.top_news && pos.top_news[0] && (
                                                                        <div className="text-[10px] text-slate-500 mt-0.5 line-clamp-1">{pos.top_news[0].title}</div>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        )}

                                                        {/* ── Fundamental (bottom strip) ── */}
                                                        {pos.fundamental && (pos.fundamental.consensus || pos.fundamental.peg) && (
                                                            <div className="pt-2 mt-1 border-t border-slate-100 flex gap-3 text-xs">
                                                                {pos.fundamental.consensus && (
                                                                    <div><span className="text-slate-400">Consensus: </span><span className="font-bold text-slate-700">{pos.fundamental.consensus}</span></div>
                                                                )}
                                                                {pos.fundamental.peg && (
                                                                    <div><span className="text-slate-400">PEG: </span><span className={`font-bold ${pos.fundamental.peg < 1 ? 'text-emerald-600' : 'text-slate-700'}`}>{pos.fundamental.peg}</span></div>
                                                                )}
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                                );
                            })()}
                            </div>
                            </div>
                        </div>,
                        document.body
                    );
                })()}
            </div>
        );
    };



    /* --------------- Portfolio Drivers (Risk Radar) --------------- */
    const AssetsDeepDive = ({ portfolio, onClose }) => {
        const [deepAnalysis, setDeepAnalysis] = useState(null);
        const [loading, setLoading] = useState(true);

        useEffect(() => {
            const fetchAnalysis = async () => {
                setLoading(true);
                try {
                    // Get tickers from portfolio passed in props
                    // portfolio.positions is array
                    const tickers = portfolio?.positions?.map(p => p.ticker || p.symbol).filter(t => t) || [];
                    if(tickers.length === 0) {
                        setLoading(false);
                        return;
                    }
                    
                    const res = await fetch(API_BASE + '/api/analysis/assets_deep', {
                       method: 'POST',
                       headers: {'Content-Type': 'application/json'},
                       body: JSON.stringify({ tickers })
                    });
                    const data = await res.json();
                    if(data.status === 'success') {
                        setDeepAnalysis(data.data);
                    }
                } catch(e) { console.error(e); }
                setLoading(false);
            };
            
            if(portfolio && portfolio.positions) {
                fetchAnalysis();
            }
        }, [portfolio]);

        if (!portfolio || !portfolio.positions) return null;

        return (
            <div className="space-y-6 animate-fadeIn section-transition section-enter">
                <div className="flex items-center justify-between mb-6">
                   <div>
                      <h2 className="text-2xl font-bold text-slate-900">Analyse 360° des Actifs</h2>
                      <p className="text-slate-500">Croisement Insiders, Politique & Smart Money pour chaque ligne</p>
                   </div>
                   <div className="flex gap-3">
                       <button onClick={onClose} className="px-5 py-2.5 text-sm font-bold text-slate-600 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 shadow-sm transition-all hover:shadow-md flex items-center gap-2">
                          <ArrowRight className="w-4 h-4 rotate-180" />
                          Retour au Portfolio
                       </button>
                   </div>
                </div>

                {loading ? (
                    <div className="p-16 text-center text-slate-500 bg-white rounded-2xl border border-slate-200 shadow-sm">
                        <div className="w-12 h-12 border-4 border-slate-200 border-t-indigo-600 rounded-full animate-spin mx-auto mb-4"></div>
                        <h3 className="text-lg font-bold text-slate-800">Scan Approfondi en cours...</h3>
                        <p className="text-sm text-slate-400 mt-2 max-w-md mx-auto">
                            Notre IA interroge les bases de données du Sénat US, les déclarations SEC des Insiders et les positions des Hedge Funds.
                        </p>
                    </div>
                ) : (
                    <div className="grid gap-6">
                        {portfolio.positions.map((pos, idx) => {
                            const ticker = (pos.ticker || pos.symbol || '').toUpperCase();
                            const data = deepAnalysis ? deepAnalysis[ticker] : null;
                            const isLoadingItem = !deepAnalysis;
                            
                            return (
                                <div key={idx} className="bg-white border border-slate-200 rounded-xl p-6 shadow-sm hover:shadow-md transition-all group">
                                    <div className="flex flex-col md:flex-row md:items-start justify-between mb-6 gap-4">
                                        <div className="flex items-center gap-4">
                                            {/* Stock Logo Placeholder or Component */}
                                            <div className="w-14 h-14 bg-slate-50 border border-slate-100 rounded-xl flex items-center justify-center font-bold text-xl text-slate-700 shadow-sm">
                                                {StockLogo ? <StockLogo isin={pos.isin} name={pos.name} /> : (ticker ? ticker.substring(0,2) : '??')}
                                            </div>
                                            <div>
                                                <h3 className="font-bold text-xl text-slate-900 group-hover:text-indigo-600 transition-colors">{pos.name}</h3>
                                                <div className="flex items-center gap-3 text-sm text-slate-500 mt-1">
                                                    <span className="font-mono font-bold bg-slate-100 px-1.5 py-0.5 rounded text-slate-600">{ticker}</span>
                                                    <span>•</span>
                                                    <span className={pos.pnlPercent >= 0 ? 'text-emerald-600 font-bold' : 'text-red-500 font-bold'}>
                                                        {pos.pnlPercent > 0 ? '+' : ''}{pos.pnlPercent ? pos.pnlPercent.toFixed(2) : '0.00'}%
                                                    </span>
                                                    <span>•</span>
                                                    <span className="text-slate-400">{pos.qty?.toFixed(4)} titres</span>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="text-right bg-slate-50 px-4 py-2 rounded-lg border border-slate-100">
                                            <div className="text-xl font-bold text-slate-900 font-mono">
                                               {(pos.value || pos.marketValue || 0).toLocaleString('fr-FR', {style:'currency', currency:'EUR'})}
                                            </div>
                                            <div className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Valeur Actuelle</div>
                                        </div>
                                    </div>

                                    {/* ANALYSIS GRID */}
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        
                                        {/* 1. US SENATE / CONGRESS */}
                                        <div className="bg-slate-50/50 rounded-lg p-4 border border-slate-100 relative overflow-hidden">
                                            <div className="absolute top-0 right-0 p-2 opacity-5"><Star className="w-12 h-12" /></div>
                                            <div className="flex items-center gap-2 mb-3 relative z-10">
                                                <div className="p-1.5 bg-amber-100 rounded-md text-amber-600"><Star className="w-4 h-4" /></div>
                                                <h4 className="font-bold text-slate-700 text-xs uppercase tracking-wider">Congrès US</h4>
                                            </div>
                                            
                                            {data?.senate?.stats?.total_trades > 0 ? (
                                                <div className="space-y-3 relative z-10">
                                                    <div className="flex justify-between items-center text-sm">
                                                        <span className="text-slate-600 font-medium">Démocrates</span>
                                                        <div className="flex gap-2 text-xs font-bold">
                                                            <span className="text-emerald-600 bg-emerald-50 px-1.5 rounded">+{data.senate.stats.democrats.buy}</span>
                                                            <span className="text-red-500 bg-red-50 px-1.5 rounded">-{data.senate.stats.democrats.sell}</span>
                                                        </div>
                                                    </div>
                                                    <div className="flex justify-between items-center text-sm">
                                                        <span className="text-slate-600 font-medium">Républicains</span>
                                                        <div className="flex gap-2 text-xs font-bold">
                                                            <span className="text-emerald-600 bg-emerald-50 px-1.5 rounded">+{data.senate.stats.republicans.buy}</span>
                                                            <span className="text-red-500 bg-red-50 px-1.5 rounded">-{data.senate.stats.republicans.sell}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            ) : (
                                                <div className="text-xs text-slate-400 italic py-2 relative z-10">Aucune activité politique récente détectée sur ce titre.</div>
                                            )}
                                        </div>

                                        {/* 2. INSIDERS */}
                                        <div className="bg-slate-50/50 rounded-lg p-4 border border-slate-100 relative overflow-hidden">
                                            <div className="absolute top-0 right-0 p-2 opacity-5"><Briefcase className="w-12 h-12" /></div>
                                            <div className="flex items-center gap-2 mb-3 relative z-10">
                                                <div className="p-1.5 bg-indigo-100 rounded-md text-indigo-600"><Briefcase className="w-4 h-4" /></div>
                                                <h4 className="font-bold text-slate-700 text-xs uppercase tracking-wider">Insiders (CEO/CFO)</h4>
                                            </div>
                                            {data?.insiders?.length > 0 ? (
                                                <div className="space-y-2 relative z-10">
                                                    {data.insiders.slice(0, 3).map((tx, i) => (
                                                        <div key={i} className="flex justify-between items-center text-xs border-b border-slate-200/50 pb-1 last:border-0 last:pb-0">
                                                            <div>
                                                                <div className="font-bold text-slate-700 truncate max-w-[120px]" title={tx.insider}>{tx.insider}</div>
                                                                <div className="text-[10px] text-slate-400">{tx.date}</div>
                                                            </div>
                                                            <div className={`font-mono font-bold px-1.5 py-0.5 rounded ${
                                                                (tx.transaction||'').toLowerCase().includes('buy') ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'
                                                            }`}>
                                                                {(tx.transaction||'').substring(0,1).toUpperCase()}{(tx.transaction||'').substring(1).toLowerCase()}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            ) : (
                                                <div className="text-xs text-slate-400 italic py-2 relative z-10">Aucune transaction insider récente (6 mois).</div>
                                            )}
                                        </div>

                                        {/* 3. SMART MONEY */}
                                        <div className="bg-slate-50/50 rounded-lg p-4 border border-slate-100 relative overflow-hidden">
                                            <div className="absolute top-0 right-0 p-2 opacity-5"><TrendingUp className="w-12 h-12" /></div>
                                            <div className="flex items-center gap-2 mb-3 relative z-10">
                                                <div className="p-1.5 bg-emerald-100 rounded-md text-emerald-600"><TrendingUp className="w-4 h-4" /></div>
                                                <h4 className="font-bold text-slate-700 text-xs uppercase tracking-wider">Smart Money</h4>
                                            </div>
                                            {data?.institutions?.smart_money_score ? (
                                                <div className="space-y-3 relative z-10">
                                                     <div className="flex justify-between items-end">
                                                         <div>
                                                            <span className="text-xs text-slate-500 block">Score Inst.</span>
                                                            <span className="font-bold text-slate-900 text-xl">{data.institutions.smart_money_score}</span>
                                                            <span className="text-xs text-slate-400">/100</span>
                                                         </div>
                                                         <div className={`text-xs font-bold px-2 py-1 rounded ${data.institutions.institutions_change_pct >= 0 ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}`}>
                                                             {data.institutions.institutions_change_pct > 0 ? '+' : ''}{data.institutions.institutions_change_pct}%
                                                         </div>
                                                     </div>
                                                     <div className="h-1.5 w-full bg-slate-200 rounded-full overflow-hidden">
                                                         <div className={`h-full rounded-full ${data.institutions.smart_money_score > 60 ? 'bg-emerald-500' : data.institutions.smart_money_score > 40 ? 'bg-amber-500' : 'bg-red-500'}`} style={{width: `${data.institutions.smart_money_score}%`}}></div>
                                                     </div>
                                                     <div className="text-[10px] text-slate-400 flex justify-between">
                                                         <span>{data.institutions.hedge_funds_count || 0} Hedge Funds</span>
                                                         <span>Flux Trimestriel</span>
                                                     </div>
                                                </div>
                                            ) : (
                                                <div className="text-xs text-slate-400 italic py-2 relative z-10">Données institutionnelles indisponibles.</div>
                                            )}
                                        </div>

                                    </div>
                                </div>
                            );
                        })}
                    </div>
                )}
            </div>
        );
    };

    const PortfolioDrivers = ({ portfolioMetrics }) => {
        const [drivers, setDrivers] = useState([]);
        const [loading, setLoading] = useState(true);

        useEffect(() => {
            fetch(API_BASE + '/api/market/correlations')
                .then(res => res.json())
                .then(data => {
                    if(data.status === 'success') setDrivers(data.data);
                    setLoading(false);
                })
                .catch(() => setLoading(false));
        }, []);

        if (loading) return <div className="animate-pulse h-24 bg-slate-100 rounded-xl w-full"></div>;
        if (!drivers || drivers.length === 0) return null;

        return (
            <div className="mb-8 p-6 bg-white border border-slate-200 rounded-2xl shadow-sm">
                <div className="flex items-center gap-2 mb-6 border-b border-slate-100 pb-4">
                     <span className="p-1.5 bg-indigo-100 text-indigo-600 rounded-lg">
                        <Activity className="w-4 h-4" />
                     </span>
                     <h3 className="text-lg font-bold text-slate-800">Radars & Allocation Stratégique</h3>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                     {/* --- RADARS DE MARCHE (List View) --- */}
                     <div className="lg:col-span-1 lg:border-r lg:border-slate-100 lg:pr-8">
                        <h4 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Indicateurs Clés</h4>
                        
                        <div className="space-y-3">
                            {drivers.slice(0, 5).map((driver, idx) => {
                                const isPositive = (driver.change_pct || 0) >= 0;
                                let colorClass = isPositive ? 'text-emerald-600' : 'text-red-600';
                                let bgClass = isPositive ? 'bg-emerald-50' : 'bg-red-50';
                                
                                // Inversion for VIX / Yields
                                if (driver.type === 'yield' || (driver.type === 'index' && driver.symbol === '^VIX')) {
                                    colorClass = isPositive ? 'text-red-600' : 'text-emerald-600';
                                    bgClass = isPositive ? 'bg-red-50' : 'bg-emerald-50';
                                }
                                
                                return (
                                    <div key={idx} className="flex items-center justify-between p-3 hover:bg-slate-50 rounded-xl transition-colors group cursor-default border border-transparent hover:border-slate-100">
                                        <div className="flex items-center gap-3">
                                            <div className={`w-8 h-8 rounded-lg ${bgClass} flex items-center justify-center text-lg shadow-sm group-hover:scale-110 transition-transform`}>
                                                {driver.type === 'commodity' && '📦'}
                                                {driver.type === 'index' && '🌍'}
                                                {driver.type === 'forex' && '💱'}
                                                {driver.type === 'crypto' && '₿'}
                                                {driver.type === 'yield' && '🏦'}
                                                {driver.type === 'spread' && '⚠️'}
                                            </div>
                                            <div>
                                                <div className="font-bold text-sm text-slate-800 line-clamp-1" title={driver.name}>{driver.name}</div>
                                                <div className="text-[10px] text-slate-400 font-mono">{driver.symbol}</div>
                                            </div>
                                        </div>
                                        <div className="text-right">
                                            <div className="font-mono font-bold text-slate-900 text-sm">
                                                {typeof driver.price === 'number' ? driver.price.toFixed(driver.type === 'forex' ? 4 : 2) : driver.price}
                                            </div>
                                            <div className={`text-[10px] font-bold px-1.5 py-0.5 rounded-md inline-block mt-0.5 ${bgClass} ${colorClass}`}>
                                                {driver.change_pct > 0 ? '+' : ''}{driver.change_pct ? driver.change_pct.toFixed(2) : 0}%
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                     </div>

                     {/* --- ALLOCATIONS (SECTOR & GEO) --- */}
                     <div className="lg:col-span-2">
                        <PortfolioAllocation positions={portfolioMetrics?.positions || []} />
                     </div>
                </div>
            </div>
        );
    };

    /* --------------- Global Market Dashboard (Compact) --------------- */
    const GlobalMarketDashboard = ({ data, onRefresh }) => {
        if (!data) return (
            <div className="flex flex-col items-center justify-center p-6 text-slate-400 bg-white rounded-xl border border-slate-200 mb-6 transition-all">
                <div className="animate-spin rounded-full h-5 w-5 border-b-2 border-indigo-600 mb-2"></div>
                <p className="text-xs">Chargement marchés...</p>
            </div>
        );

        const { commodities, forex, treasury_yields, indices } = data;
        
        // Configuration "Minimum" - Whitelists
        const keyMap = {
            'Indices': ['S&P_500', 'NASDAQ', 'CAC_40', 'VIX'],
            'Devises': ['EUR/USD', 'GBP/USD', 'USD/JPY'],
            'Matières': ['Gold', 'Silver', 'Crude_Oil_WTI'],
            'Taux': ['10_Year', '2_Year']
        };

        const renderSection = (title, items, type, whitelist) => {
             // Filter items based on whitelist
             const filteredKeys = Object.keys(items || {}).filter(k => whitelist.includes(k));
             
             return (
                 <div className="flex-1 min-w-[140px]">
                     <h4 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 border-b border-slate-100 pb-1">{title}</h4>
                     <div className="space-y-1">
                        {filteredKeys.map(key => {
                             const item = items[key];
                             if (!item || item.error) return null;
                             
                             const isPositive = (item.change_pct || item.change || 0) >= 0;
                             let color = isPositive ? 'text-emerald-600' : 'text-red-500';
                             if (title.includes('Indices') && key === 'VIX') color = isPositive ? 'text-red-500' : 'text-emerald-600';

                             let valueDisplay = item.price;
                             if (type === 'rate') valueDisplay = item.rate;
                             if (type === 'yield') valueDisplay = item.yield + '%';
                             
                             // Noms simplifiés
                             const displayName = key.replace(/_/g, ' ')
                                .replace('Crude Oil WTI', 'Pétrole')
                                .replace('Gold', 'Or')
                                .replace('Silver', 'Argent')
                                .replace('10 Year', '10 Ans').replace('2 Year', '2 Ans');

                             return (
                                <div key={key} className="flex justify-between items-center py-1 group hover:bg-slate-50 rounded px-1 transition-colors cursor-default">
                                    <div className="flex items-center gap-1.5">
                                        <span className={`w-1 h-3 rounded-full ${isPositive ? 'bg-emerald-400' : 'bg-red-400'}`}></span>
                                        <span className="text-xs font-semibold text-slate-700 truncate" title={key}>{displayName}</span>
                                    </div>
                                    <div className="text-right flex items-center gap-2">
                                        <span className="font-mono text-xs text-slate-600">{valueDisplay}</span>
                                        <span className={`text-[10px] font-bold px-1 rounded ${isPositive ? 'bg-emerald-50' : 'bg-red-50'} ${color}`}>
                                            {isPositive ? '+' : ''}{item.change_pct}%
                                        </span>
                                    </div>
                                </div>
                             )
                        })}
                     </div>
                 </div>
             );
        };

        return (
            <div className="bg-white rounded-xl border border-slate-200 shadow-sm mb-6 overflow-hidden">
                <div className="flex justify-between items-center px-4 py-3 bg-slate-50/50 border-b border-slate-100">
                    <div className="flex items-center gap-2">
                        <Activity className="w-4 h-4 text-indigo-600" />
                        <h3 className="text-sm font-bold text-slate-800">Vue Globale Marché</h3>
                        <span className="text-[10px] text-slate-400 font-mono hidden sm:inline-block">Updated: {data.timestamp ? new Date(data.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '--:--'}</span>
                    </div>
                    <button 
                        onClick={onRefresh}
                        className="p-1.5 bg-white hover:bg-slate-50 text-slate-500 hover:text-indigo-600 rounded border border-slate-200 transition-colors shadow-sm"
                        title="Actualiser"
                    >
                        <RefreshCw className="w-3.5 h-3.5" />
                    </button>
                </div>
                
                <div className="p-4">
                    <div className="w-full grid grid-cols-2 lg:grid-cols-4 gap-6 text-sm">
                        {renderSection("Indices", indices, 'price', keyMap['Indices'])}
                        {renderSection("Devises", forex, 'rate', keyMap['Devises'])}
                        {renderSection("Matières", commodities, 'price', keyMap['Matières'])}
                        {renderSection("Taux", treasury_yields, 'yield', keyMap['Taux'])}
                    </div>
                </div>
            </div>
        );
    };


    /* ------------------- News Correlator Widget ------------------- */
    const NewsCorrelatorWidget = ({ portfolioPositions = [] }) => {
        const defaultTicker = React.useMemo(() => {
            const p = (portfolioPositions || []).find(p => p.ticker || p.symbol);
            return p ? (p.ticker || p.symbol) : '';
        }, [portfolioPositions]);

        const [ticker,    setTicker]    = React.useState('');
        const [period,    setPeriod]    = React.useState('1mo');
        const [threshold, setThreshold] = React.useState('1.0');
        const [result,    setResult]    = React.useState(null);
        const [loading,   setLoading]   = React.useState(false);
        const [error,     setError]     = React.useState('');
        const [expanded,  setExpanded]  = React.useState({});

        // Sync default ticker once positions load
        React.useEffect(() => {
            if (!ticker && defaultTicker) setTicker(defaultTicker);
        }, [defaultTicker]);

        const PERIODS = [
            { key: '1d',  label: '1J' },
            { key: '5d',  label: '5J' },
            { key: '1w',  label: '1S' },
            { key: '1mo', label: '1M' },
        ];

        const run = async () => {
            const t = ticker.trim().toUpperCase();
            if (!t) { setError('Entrez un ticker'); return; }
            setLoading(true); setError(''); setResult(null); setExpanded({});
            try {
                const th = parseFloat(threshold) || 1.0;
                const url = `${API_BASE}/api/news-correlator?ticker=${encodeURIComponent(t)}&period=${period}&threshold=${th}`;
                const r   = await fetch(url);
                const d   = await r.json();
                if (d.error) { setError(d.error); }
                else         { setResult(d); }
            } catch(e) { setError('Erreur réseau'); }
            setLoading(false);
        };

        const toggleMove = (i) => setExpanded(prev => ({ ...prev, [i]: !prev[i] }));

        const sentColor = (s) => s === 'positive'
            ? 'text-emerald-700 bg-emerald-50 border-emerald-200'
            : s === 'negative'
            ? 'text-red-700 bg-red-50 border-red-200'
            : 'text-slate-500 bg-slate-50 border-slate-200';

        const sentIcon = (s) => s === 'positive' ? '↑' : s === 'negative' ? '↓' : '–';

        return (
            <div className="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                {/* Header */}
                <div className="p-4 border-b border-slate-100 bg-slate-50 flex items-center justify-between">
                    <h3 className="font-bold text-slate-900 flex items-center gap-2 text-base">
                        <span className="p-1.5 bg-violet-50 rounded-lg text-violet-600 border border-violet-100">
                            <Activity className="w-4 h-4" />
                        </span>
                        Corrélateur News
                    </h3>
                    <span className="text-xs text-slate-400 font-medium">FinBERT · multi-sources</span>
                </div>

                {/* Controls */}
                <div className="p-4 border-b border-slate-100 flex flex-wrap items-center gap-2">
                    {/* Ticker input */}
                    <input
                        type="text"
                        value={ticker}
                        onChange={e => setTicker(e.target.value.toUpperCase())}
                        onKeyDown={e => e.key === 'Enter' && run()}
                        placeholder="NVDA, 000660.KS…"
                        className="border border-slate-200 rounded-lg px-3 py-1.5 text-sm font-mono font-bold text-slate-800 w-32 focus:outline-none focus:ring-2 focus:ring-violet-400"
                    />
                    {/* Threshold */}
                    <div className="flex items-center gap-1 border border-slate-200 rounded-lg px-2 py-1.5">
                        <span className="text-xs text-slate-400">Seuil</span>
                        <input
                            type="number" min="0.1" max="20" step="0.1"
                            value={threshold}
                            onChange={e => setThreshold(e.target.value)}
                            className="w-12 text-sm text-center font-bold text-slate-700 focus:outline-none"
                        />
                        <span className="text-xs text-slate-400">%</span>
                    </div>
                    {/* Period tabs */}
                    <div className="flex rounded-lg overflow-hidden border border-slate-200">
                        {[{key:'1d',label:'1J'},{key:'5d',label:'5J'},{key:'1w',label:'1S'},{key:'1mo',label:'1M'}].map(p => (
                            <button
                                key={p.key}
                                onClick={() => setPeriod(p.key)}
                                className={`px-3 py-1.5 text-xs font-bold transition-colors ${
                                    period === p.key
                                        ? 'bg-violet-600 text-white'
                                        : 'bg-white text-slate-500 hover:bg-slate-50'
                                }`}
                            >{p.label}</button>
                        ))}
                    </div>
                    {/* Run button */}
                    <button
                        onClick={run}
                        disabled={loading}
                        className="ml-auto flex items-center gap-1.5 bg-violet-600 hover:bg-violet-700 disabled:opacity-50 text-white text-xs font-bold px-4 py-1.5 rounded-lg transition-colors"
                    >
                        {loading ? (
                            <><div className="w-3 h-3 border-2 border-white/40 border-t-white rounded-full animate-spin"></div>Analyse…</>
                        ) : (
                            <><Activity className="w-3 h-3" />Analyser</>
                        )}
                    </button>
                </div>

                {/* Error */}
                {error && (
                    <div className="p-3 mx-4 mt-3 bg-red-50 border border-red-200 rounded-lg text-xs text-red-700">{error}</div>
                )}

                {/* Results */}
                {result && !loading && (
                    <div>
                        {/* Summary bar */}
                        <div className="px-4 py-3 border-b border-slate-100 flex flex-wrap items-center gap-3 bg-slate-50/60">
                            <span className="font-bold text-slate-800">{result.company}</span>
                            <span className="font-mono text-xs bg-slate-100 px-1.5 py-0.5 rounded text-slate-500">{result.ticker}</span>
                            <span className="text-xs text-slate-400">{result.period_label}</span>
                            <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${result.total_pct >= 0 ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}`}>
                                {result.total_pct >= 0 ? '+' : ''}{result.total_pct}%
                            </span>
                            <span className="text-xs text-slate-400 ml-auto">{result.stats.total} moves · seuil {result.threshold}%</span>
                        </div>

                        {/* Stats */}
                        {result.stats.total > 0 && (
                            <div className="grid grid-cols-4 divide-x divide-slate-100 border-b border-slate-100">
                                {[
                                    { label: 'Corrélés',  val: result.stats.correlated, color: 'text-emerald-600' },
                                    { label: 'Divergents',val: result.stats.divergent,  color: 'text-amber-600'   },
                                    { label: 'Sans news', val: result.stats.no_news,    color: 'text-slate-400'   },
                                    { label: 'Taux',      val: result.stats.rate + '%', color: result.stats.rate >= 50 ? 'text-emerald-600' : 'text-red-500' },
                                ].map(s => (
                                    <div key={s.label} className="py-2 text-center">
                                        <div className={`text-base font-bold ${s.color}`}>{s.val}</div>
                                        <div className="text-[10px] text-slate-400 font-medium">{s.label}</div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* Moves list */}
                        {result.moves.length === 0 ? (
                            <div className="p-6 text-center text-slate-400 text-sm">Aucun mouvement ≥ {result.threshold}% détecté.</div>
                        ) : (
                            <div className="divide-y divide-slate-50 max-h-[480px] overflow-y-auto">
                                {result.moves.map((mv, i) => {
                                    const isUp   = mv.change_pct > 0;
                                    const open   = expanded[i];
                                    const noData = mv.too_old || (!mv.articles?.length);
                                    return (
                                        <div key={i} className="hover:bg-slate-50 transition-colors">
                                            {/* Move row */}
                                            <button
                                                onClick={() => !noData && toggleMove(i)}
                                                className={`w-full flex items-center gap-3 px-4 py-2.5 text-left ${noData ? 'cursor-default' : 'cursor-pointer'}`}
                                            >
                                                {/* Direction badge */}
                                                <span className={`w-8 h-8 flex-shrink-0 flex items-center justify-center rounded-lg text-xs font-bold ${isUp ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}`}>
                                                    {isUp ? '↑' : '↓'}
                                                </span>
                                                <div className="flex-1 min-w-0">
                                                    <div className="flex items-center gap-2 flex-wrap">
                                                        <span className={`font-bold text-sm ${isUp ? 'text-emerald-700' : 'text-red-600'}`}>
                                                            {isUp ? '+' : ''}{mv.change_pct}%
                                                        </span>
                                                        <span className="text-xs text-slate-400 font-mono">{mv.timestamp}</span>
                                                        <span className="text-[10px] text-slate-400">({mv.age_days}j)</span>
                                                        {mv.too_old && <span className="text-[10px] px-1.5 py-0.5 bg-amber-50 border border-amber-200 text-amber-600 rounded">trop ancien</span>}
                                                        {!mv.too_old && mv.articles?.length > 0 && (
                                                            mv.is_correlated
                                                                ? <span className="text-[10px] px-1.5 py-0.5 bg-emerald-50 border border-emerald-200 text-emerald-700 rounded font-bold">✓ Corrélé</span>
                                                                : <span className="text-[10px] px-1.5 py-0.5 bg-amber-50 border border-amber-200 text-amber-700 rounded">? Divergent</span>
                                                        )}
                                                        {!mv.too_old && mv.articles?.length === 0 && (
                                                            <span className="text-[10px] px-1.5 py-0.5 bg-slate-50 border border-slate-200 text-slate-400 rounded">sans news</span>
                                                        )}
                                                    </div>
                                                    {mv.articles?.length > 0 && !mv.too_old && (
                                                        <div className="flex items-center gap-2 mt-0.5">
                                                            <span className="text-[10px] text-emerald-600">↑{mv.bull}</span>
                                                            <span className="text-[10px] text-red-500">↓{mv.bear}</span>
                                                            <span className="text-[10px] text-slate-400">–{mv.neutral}</span>
                                                            <span className="text-[10px] text-slate-300">·</span>
                                                            <span className="text-[10px] text-slate-400">{mv.date_confirmed}/{mv.articles.length} datés</span>
                                                        </div>
                                                    )}
                                                </div>
                                                {!noData && (
                                                    <span className="text-slate-300 text-xs">{open ? '▲' : '▼'}</span>
                                                )}
                                            </button>

                                            {/* Article detail */}
                                            {open && mv.articles?.length > 0 && (
                                                <div className="px-4 pb-3 space-y-1.5 bg-slate-50/60">
                                                    {mv.articles.map((art, j) => (
                                                        <div key={j} className={`flex items-start gap-2 p-2 rounded-lg border text-xs ${sentColor(art.sentiment)}`}>
                                                            <span className="font-bold flex-shrink-0 mt-0.5">{sentIcon(art.sentiment)}</span>
                                                            <div className="flex-1 min-w-0">
                                                                <div className="font-medium leading-snug">{art.title}</div>
                                                                <div className="flex items-center gap-2 mt-0.5 opacity-70">
                                                                    <span>{art.source}</span>
                                                                    <span>·</span>
                                                                    <span className={art.date_ok ? 'font-bold' : ''}>{art.date || '—'}</span>
                                                                    {art.date_ok
                                                                        ? <span className="text-emerald-600 font-bold">✓</span>
                                                                        : <span className="text-amber-500">?</span>}
                                                                    <span>· {art.sentiment_display} {Math.round(art.sentiment_score * 100)}%</span>
                                                                </div>
                                                            </div>
                                                            {art.url && (
                                                                <a href={art.url} target="_blank" rel="noopener noreferrer"
                                                                   className="flex-shrink-0 opacity-50 hover:opacity-100 transition-opacity">↗</a>
                                                            )}
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                )}

                {/* Empty state */}
                {!result && !loading && !error && (
                    <div className="p-8 text-center text-slate-400 text-sm">
                        <Activity className="w-8 h-8 mx-auto mb-2 opacity-20" />
                        <p>Sélectionnez un ticker et une période, puis cliquez sur <b>Analyser</b>.</p>
                        <p className="text-xs mt-1 opacity-70">Analyse les mouvements ≥ seuil et corrèle avec Google News · Reuters · MarketWatch · Seeking Alpha via FinBERT.</p>
                    </div>
                )}
            </div>
        );
    };


    /* ------------------- Portfolio Events Calendar ------------------- */
    const PortfolioEventsCalendar = React.memo(({ positions }) => {
        const [events, setEvents] = React.useState([]);
        const [loading, setLoading] = React.useState(false);
        const [fetched, setFetched] = React.useState(false);

        const tickerKey = React.useMemo(() =>
            (positions || []).map(p => p.ticker || p.symbol || p.isin).filter(Boolean).sort().join(','),
        [positions]);

        const doFetch = React.useCallback((force = false) => {
            if (!tickerKey) return;
            const CACHE_KEY = 'portfolio_events_cache';
            const TTL = 3600000; // 1h — only cache non-empty results
            if (!force) {
                try {
                    const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
                    if (cached && cached.key === tickerKey && cached.events && cached.events.length > 0 && (Date.now() - cached.ts) < TTL) {
                        setEvents(cached.events);
                        setFetched(true);
                        return;
                    }
                } catch(e) {}
            }
            const tickers = tickerKey.split(',');
            setLoading(true);
            fetch(API_BASE + '/api/portfolio-events', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ tickers })
            })
            .then(r => r.json())
            .then(d => {
                const evts = d.events || [];
                setEvents(evts);
                setFetched(true);
                // Only cache non-empty results so empty results are always re-fetched
                if (evts.length > 0) {
                    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ key: tickerKey, ts: Date.now(), events: evts })); } catch(e) {}
                }
            })
            .catch(() => setFetched(true))
            .finally(() => setLoading(false));
        }, [tickerKey]);

        React.useEffect(() => { doFetch(false); }, [tickerKey]);

        const today = new Date();
        today.setHours(0,0,0,0);
        const in7 = new Date(today); in7.setDate(in7.getDate() + 7);
        const in30 = new Date(today); in30.setDate(in30.getDate() + 30);

        const badge = (evt) => {
            const d = new Date(evt.date);
            d.setHours(0,0,0,0);
            const diff = Math.round((d - today) / 86400000);
            if (diff < 0) return null;
            if (diff === 0) return <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-red-100 text-red-700 border border-red-200">Aujourd'hui</span>;
