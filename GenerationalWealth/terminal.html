                  <div className="space-y-3">
                      {Object.entries(loadingSteps).map(([key, step]) => {
                          let icon = <div className="w-2 h-2 rounded-full bg-slate-300"></div>;
                          let colorClass = "text-slate-500";
                          let statusText = "En attente...";
                          let bgClass = "bg-slate-50 border-slate-100";
                          
                          if (step.status === 'running') {
                              icon = <div className="w-4 h-4 rounded-full border-2 border-indigo-500 border-t-transparent animate-spin"></div>;
                              colorClass = "text-indigo-600 font-medium";
                              statusText = "Chargement...";
                              bgClass = "bg-indigo-50 border-indigo-100";
                          } else if (step.status === 'success') {
                              icon = <svg className="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>;
                              colorClass = "text-emerald-600";
                              statusText = "Terminé";
                              bgClass = "bg-emerald-50/50 border-emerald-100";
                          } else if (step.status === 'error') {
                              icon = <svg className="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>;
                              colorClass = "text-red-600";
                              statusText = "Erreur";
                              bgClass = "bg-red-50 border-red-100";
                          }
                          
                          return (
                              <div key={key} className={`flex items-center justify-between p-3 rounded-lg border transition-colors ${bgClass}`}>
                                  <div className="flex items-center gap-3">
                                      <div className="w-6 flex justify-center items-center">{icon}</div>
                                      <span className={`text-sm ${colorClass}`}>{step.label}</span>
                                  </div>
                                  <span className="text-xs text-slate-400 font-mono hidden sm:block">{statusText}</span>
                              </div>
                          );
                      })}
                  </div>
              </div>
          </div>
        );
      }
      if (error && !portfolioData) {
        return (
          <div className="min-h-screen cotality-theme flex items-center justify-center">
            <div className="text-red-700 text-xl text-center p-8 bg-white border border-red-200 rounded-2xl shadow-lg">
              <div className="mb-4">❌ {error}</div>
              <div className="text-sm text-slate-500">
                Impossible de charger les données initiales. Vérifiez la connexion au backend ou les logs.
              </div>
            </div>
          </div>
        );
      }

      /* ------------------- Rendu ------------------- */
      return (
        <div className="cotality-theme min-h-screen text-slate-900 p-3 sm:p-4 md:p-6 relative z-10 selection:bg-orange-100 resp-main">
          <div className="max-w-[1400px] mx-auto mb-6">
            <header className="flex flex-col md:flex-row items-center justify-between gap-6 mb-8 py-3 md:py-4 px-4 md:px-6 rounded-2xl border border-slate-200 bg-white" style={{boxShadow:'var(--c-shadow-sm)'}}>
              <div className="flex items-center gap-4 self-start md:self-center">
                 <div className="w-12 h-12 bg-gradient-to-br from-[#ec7e5e] to-[#d54f2b] border border-orange-200/70 rounded-2xl flex items-center justify-center shadow-lg shadow-orange-300/40">
                   <Activity className="w-6 h-6 text-white" />
                 </div>
                 <div>
                   <h1 className="text-xl sm:text-2xl md:text-3xl font-bold text-slate-900 tracking-tight leading-none">
                     GENERATIONAL<span className="text-[#d14d2b]">WEALTH</span>
                   </h1>
                   <div className="flex items-center gap-2 mt-1">
                      <span className="relative flex h-2 w-2">
                        <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                      </span>
                      <p className="text-[10px] text-slate-500 uppercase tracking-[0.2em] font-bold">
                        Connected • Trade Republic
                      </p>
                   </div>
                 </div>
              </div>

              <div className="flex items-center gap-4 w-full md:w-auto justify-end resp-header-right">
                
                {/* Search Bar Intégrée */}
                <div className="block w-full sm:w-48 md:w-64 lg:w-72 relative resp-search-wrap">
                    <StockSearch 
                        sectorTrends={sectorTrends} 
                        onSelect={handleExecuteSearch} 
                        isLoading={manualSearchLoading}
                        query={searchQuery}
                        setQuery={setSearchQuery}
                    />
                </div>

                <div className="h-8 w-px bg-slate-200 hidden md:block"></div>

                <NotificationCenter
                  notifications={notifications}
                  onDismiss={dismissNotification}
                  onClearAll={clearAllNotifications}
                />

                {/* USER MENU */}
                <div className="relative">
                    <button 
                      onClick={() => setShowUserMenu(!showUserMenu)}
                      className="w-10 h-10 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-50 hover:text-[#d14d2b] transition-colors shadow-sm"
                      title="Mon Compte"
                    >
                       <User className="w-5 h-5" />
                    </button>
                    
                    {showUserMenu && (
                        <div className="absolute right-0 mt-2 w-64 bg-white rounded-xl shadow-xl border border-slate-100 py-2 z-50 animate-fadeIn origin-top-right">
                           {/* App-level user */}
                           {authUser && (
                               <div className="px-4 py-3 border-b border-slate-100 mb-1">
                                  <div className="text-xs text-slate-400 uppercase tracking-wider font-bold mb-1">Compte</div>
                                  <div className="text-sm font-bold text-slate-900">👤 {authUser.username}</div>
                                  {authUser.is_admin && <span className="text-[10px] bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded font-bold uppercase tracking-wide">Admin</span>}
                               </div>
                           )}
                           {/* TR profile info */}
                           {userProfile && (
                               <div className="px-4 py-2 border-b border-slate-100 mb-1">
                                  <div className="text-xs text-slate-400 uppercase tracking-wider font-bold mb-1">Trade Republic</div>
                                  <div className="text-sm font-semibold text-slate-700">{userProfile.firstName} {userProfile.lastName}</div>
                                  <div className="text-xs text-slate-400 font-mono mt-0.5">{userProfile.phone}</div>
                               </div>
                           )}
                           <button 
                              onClick={() => { setShowAccountSettings(true); setShowUserMenu(false); }}
                              className="w-full text-left px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2"
                           >
                              <Settings className="w-4 h-4" /> Paramètres du compte
                           </button>
                           <button 
                              onClick={handleLogout}
                              className="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2"
                           >
                              <LogOut className="w-4 h-4" /> Déconnexion
                           </button>
                        </div>
                    )}
                    
                    
                </div>
                
                <div className="text-right pl-2 resp-portfolio-val">
                  <div className="text-[10px] text-slate-500 uppercase tracking-widest font-bold mb-1 resp-pv-label">Portfolio Value</div>
                  <div className="text-lg sm:text-xl md:text-3xl font-bold font-mono text-slate-900 tracking-tight leading-none resp-pv-amount">
                    €{(portfolioMetrics.totalValue + portfolioData.cash).toLocaleString('fr-FR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}
                  </div>
                </div>
              </div>
            </header>

            {/* Navigation Deck (Modern Floating Dock) */}
            <div className="sticky top-2 md:top-6 z-40 flex justify-center mb-4 md:mb-12 px-2 md:px-4">
              <div className="bg-white border border-slate-200 p-1.5 md:p-2 rounded-2xl flex items-center gap-1 md:gap-2 overflow-x-auto max-w-full resp-nav-dock" style={{boxShadow:'var(--c-shadow)'}}>  
                {[
                  { id: 'portfolio', icon: DollarSign, label: 'Portfolio' },
                  { id: 'technique', icon: Activity, label: 'Market View' },
                  { id: 'forex', icon: Calendar, label: 'Calendar' },
                  { id: 'insiders', icon: Users, label: 'Assets' },
                  { id: 'news', icon: Globe, label: 'News & Social' },
                  { id: 'cash', icon: PieChart, label: 'Cash Flow' }
                ].map((tab) => {
                   const isActive = activeTab === tab.id;
                   const Icon = tab.icon;
                   return (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`
                        relative px-3 py-2 md:px-5 md:py-2.5 rounded-xl text-xs md:text-sm font-medium transition-colors duration-150 flex items-center gap-1.5 md:gap-2.5 whitespace-nowrap resp-nav-tab
                        ${isActive 
                          ? 'bg-[#0F2443] text-white shadow-sm' 
                          : 'text-slate-600 hover:text-slate-900 hover:bg-slate-50'}
                      `}
                    > 
                      <Icon className="w-4 h-4" />
                      <span className={`hidden md:block tracking-wide ${isActive ? 'font-semibold' : ''}`}>
                        {tab.label}
                      </span>
                    </button>
                   );
                })}
              </div>
            </div>

            {/* Chat Button Flottant (Indépendant du menu) */}
            <button
                onClick={() => setIsChatOpen(!isChatOpen)}
                className={`fixed bottom-4 right-4 md:bottom-8 md:right-8 w-12 h-12 md:w-14 md:h-14 rounded-full shadow-lg flex items-center justify-center transition-all duration-150 z-50 hover:scale-105 active:scale-95 ${
                  isChatOpen 
                    ? 'bg-slate-700 hover:bg-slate-800 rotate-90 text-white' 
                    : 'bg-[#e35f3b] hover:bg-[#bd4625] text-white'
                }`}
                style={{ boxShadow: isChatOpen ? '0 10px 30px -10px rgba(0,0,0,0.5)' : '0 10px 30px -10px rgba(227, 95, 59, 0.55)' }}
            >
                {isChatOpen ? (
                  <X className="w-6 h-6 text-white" />
                ) : (
                  <MessageSquare className="w-6 h-6 text-white" />
                )}
            </button>

            {/* Composant Chat AI */}
            <AIChatPanel 
                isOpen={isChatOpen} 
                onClose={() => setIsChatOpen(false)}
                portfolioData={portfolioData}
                portfolioMetrics={portfolioMetrics}
                forexData={forexData}
                insiderData={insiderData}
                newsData={newsData}
                optionsData={optionsData}
                seasonalityData={seasonalityData}
                sectorTrends={sectorTrends}
                bloombergNews={bloombergNews}
                filteredInsiders={filteredInsiders}
                portfolioTickers={Array.from(portfolioTickers)}
                onInsiderCacheUpdate={setInsiderData}
                bloombergLiveStatus={bloombergLiveStatus}
            />

            {/* Modale Détails Stock */}
            <StockDetailsModal 
                stock={selectedStockDetails} 
                onClose={() => setSelectedStockDetails(null)} 
            />

            {/* Modale Détails Banque */}
            <BankDetailsModal
                forecast={selectedBankForecast}
                analyses={bankAnalyses}
                onClose={() => setSelectedBankForecast(null)}
            />

            {/* Modale Connexion */}
            <LoginModal 
                isOpen={showLoginModal} 
                onClose={() => setShowLoginModal(false)}
                onLoginSuccess={handleLoginSuccess}
            />

            {/* Modale Paramètres Compte */}
            {showAccountSettings && (
                <AccountSettingsModal onClose={() => setShowAccountSettings(false)} />
            )}

            {/* Portfolio Loader Overlay */}
            <PortfolioLoader 
                isOpen={isRefreshingPortfolio}
                steps={refreshSteps}
                currentStepIndex={currentRefreshStep}
            />
          </div>

          <div className="max-w-7xl mx-auto px-4 pb-20">
            {/* --------- ONGLET ASSETS (DEEP DIVE) --------- */}
            {activeTab === 'assets' && (
                <AssetsDeepDive 
                    portfolio={portfolioMetrics} 
                    onClose={() => setActiveTab('portfolio')} 
                />
            )}

            {/* --------- ONGLET PORTFOLIO --------- */}
            {activeTab === 'portfolio' && (
              <div className="space-y-6 section-transition section-enter">
                
                {/* Graphique de Performance Comparée */}
                <TRPortfolioChart />

                {/* --- ANALYSE 360° (Multi-Sources: Macro + News + Technique + Calendrier) --- */}
                <Analysis360
                    portfolioMetrics={portfolioMetrics}
                    globalMarketData={globalMarketData}
                    bloombergNews={bloombergNews}
                    earningsData={earningsData}
                    sectorTrends={sectorTrends}
                    bankForecasts={bankForecasts}
                />

                {/* --- MARKET DATA & METRICS SECTION (Unified) --- */}
                <PortfolioDrivers portfolioMetrics={portfolioMetrics} />

                {/* KPI Cards */}
                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                  <div className="bg-white border border-slate-200 rounded-xl p-5 shadow-sm relative overflow-hidden group hover:border-emerald-300 transition-colors">
                    <div className="absolute right-0 top-0 p-4 opacity-5 group-hover:opacity-10 transition-opacity">
                      <DollarSign className="w-16 h-16 text-emerald-600" />
                    </div>
                    <div className="text-sm text-slate-500 mb-2 font-medium uppercase tracking-wider">Liquidités</div>
                    <div className="text-3xl font-bold text-slate-900 tracking-tight">
                        <FlashNumber value={portfolioData.cash} prefix="€" />
                    </div>
                    <div className="mt-2 text-xs text-emerald-600 flex items-center gap-1 font-medium">
                      <div className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                      Disponible
                    </div>
                  </div>

                  <div className="bg-white border border-slate-200 rounded-xl p-5 shadow-sm relative overflow-hidden group hover:border-blue-300 transition-colors">
                    <div className="absolute right-0 top-0 p-4 opacity-5 group-hover:opacity-10 transition-opacity">
                      <PieChart className="w-16 h-16 text-blue-600" />
                    </div>
                    <div className="text-sm text-slate-500 mb-2 font-medium uppercase tracking-wider">Valeur Investie</div>
                    <div className="text-3xl font-bold text-slate-900 tracking-tight">
                        <FlashNumber value={portfolioMetrics.totalValue} prefix="€" />
                    </div>
                    <div className="mt-2 text-xs text-blue-600 font-medium">
                      {portfolioMetrics.positions.length} positions actives
                    </div>
                  </div>

                  <div className="bg-white border border-slate-200 rounded-xl p-5 shadow-sm relative overflow-hidden group hover:border-slate-300 transition-colors">
                    <div className="absolute right-0 top-0 p-4 opacity-5 group-hover:opacity-10 transition-opacity">
                      <TrendingUp className={`w-16 h-16 ${portfolioMetrics.totalPnl >= 0 ? 'text-emerald-600' : 'text-red-500'}`} />
                    </div>
                    <div className="text-sm text-slate-500 mb-2 font-medium uppercase tracking-wider">P&L Total</div>
                    <div className={`text-3xl font-bold tracking-tight flex items-center gap-2 ${portfolioMetrics.totalPnl >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>
                      <FlashNumber value={portfolioMetrics.totalPnl} prefix={portfolioMetrics.totalPnl >= 0 ? '+€' : '€'} />
                    </div>
                    <div className="mt-2 text-xs text-slate-400 font-medium">
                      Performance globale latente
                    </div>
                  </div>

                  <div className="bg-white border border-slate-200 rounded-xl p-5 shadow-sm relative overflow-hidden group hover:border-slate-300 transition-colors">
                    <div className="absolute right-0 top-0 p-4 opacity-5 group-hover:opacity-10 transition-opacity">
                      <Activity className={`w-16 h-16 ${portfolioMetrics.totalPnlPercent >= 0 ? 'text-emerald-600' : 'text-red-500'}`} />
                    </div>
                    <div className="text-sm text-slate-500 mb-2 font-medium uppercase tracking-wider">Rendement</div>
                    <div className={`text-3xl font-bold tracking-tight ${portfolioMetrics.totalPnlPercent >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>
                      <FlashNumber value={portfolioMetrics.totalPnlPercent} prefix={portfolioMetrics.totalPnlPercent >= 0 ? '+' : ''} suffix="%" />
                    </div>
                    <div className="mt-2 text-xs text-slate-400 font-medium">
                      Depuis l'achat (latent)
                    </div>
                  </div>
                </div>

                {/* Positions Table */}
                <div className="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                  <div className="p-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
                    <h3 className="font-bold text-lg text-slate-900 flex items-center gap-2">
                      <span className="p-1.5 bg-indigo-50 rounded-lg text-indigo-600 border border-indigo-100"><Target className="w-5 h-5" /></span>
                      Positions Actives
                    </h3>
                    <span className="text-xs font-mono text-slate-500 bg-white px-2 py-1 rounded border border-slate-200 shadow-sm">
                      {portfolioMetrics.positions.length} TITRES
                    </span>
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full">
                      <thead className="bg-slate-50 text-xs uppercase tracking-wider border-b border-slate-200">
                        <tr className="text-left text-slate-500">
                          <th className="p-4 font-semibold">Titre</th>
                          <th className="p-4 font-semibold text-right">Qté</th>
                          <th className="p-4 font-semibold text-right">Prix Moyen</th>
                          <th className="p-4 font-semibold text-right">Prix Actuel</th>
                          <th className="p-4 font-semibold text-right">Valeur</th>
                          <th className="p-4 font-semibold text-right">P&L €</th>
                          <th className="p-4 font-semibold text-right">P&L %</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {portfolioMetrics.positions.map((position, idx) => (
                          <tr key={idx} className="hover:bg-slate-50 transition-colors group">
                            <td className="p-4">
                              <div className="flex items-center gap-3">
                                <StockLogo isin={position.isin} name={position.name} />
                                <div>
                                  <div className="font-bold text-slate-800 group-hover:text-indigo-600 transition-colors">{position.name}</div>
                                  <div className="text-[10px] text-slate-400 font-mono">{position.isin}</div>
                                </div>
                              </div>
                            </td>
                            <td className="p-4 text-right font-mono text-slate-600">{position.qty.toFixed(6)}</td>
                            <td className="p-4 text-right font-mono text-slate-500">{position.avgPrice.toFixed(2)}€</td>
                            <td className="p-4 text-right">
                              <div className="flex items-center justify-end gap-2">
                                <FlashNumber 
                                    className="text-slate-800 font-mono font-medium" 
                                    value={position.currentPrice} 
                                    suffix="€" 
                                />
                              </div>
                            </td>
                            <td className="p-4 text-right font-bold text-slate-900 font-mono">
                                <FlashNumber 
                                    value={position.marketValue} 
                                    suffix="€" 
                                />
                            </td>
                            <td className={`p-4 text-right font-medium font-mono ${position.pnl >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>
                              <FlashNumber 
                                value={Math.abs(position.pnl)} 
                                prefix={position.pnl >= 0 ? '+' : '-'} 
                                suffix="€"
                              />
                            </td>
                            <td className="p-4 text-right">
                              <span className={`px-2 py-1 rounded text-xs font-bold ${
                                position.pnlPercent >= 0 
                                  ? 'bg-emerald-50 text-emerald-700 border border-emerald-100' 
                                  : 'bg-red-50 text-red-700 border border-red-100'
                              }`}>
                                <FlashNumber 
                                    value={position.pnlPercent} 
                                    prefix={position.pnlPercent >= 0 ? '+' : ''} 
                                    suffix="%"
                                />
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* --- SECTIONS SECTORIELLES (Selection Bar) --- */}
                {/* Watchlist & Events Calendar */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <PortfolioEventsCalendar positions={portfolioMetrics?.positions || []} />
                    <WatchlistComponent portfolioPositions={portfolioMetrics?.positions || []} />
                </div>

                {sectorTrends && (
                  <div className="mb-6">
                    <div className="flex items-center justify-between mb-3">
                      <h3 className="text-lg font-bold text-slate-900 flex items-center gap-2 flex-wrap">
                        <PieChart className="w-5 h-5 text-indigo-600" />
                        Top Secteurs
                        {(() => {
                          const lastUpdates = Object.values(sectorTrends)
                            .map(d => d.last_updated).filter(Boolean).map(d => new Date(d));
                          if (lastUpdates.length === 0) return null;
                          const mostRecent = new Date(Math.max(...lastUpdates));
                          const hoursSince = (Date.now() - mostRecent.getTime()) / (1000 * 60 * 60);
                          const label = mostRecent.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
                          return (
                            <span className={`text-xs font-normal px-2 py-0.5 rounded-full ${hoursSince >= 4 ? 'bg-orange-100 text-orange-600' : 'bg-slate-100 text-slate-500'}`}>
                              {hoursSince >= 4 ? '⚠ ' : ''}Màj : {label}
                            </span>
                          );
                        })()}
                      </h3>
                      <div className="flex items-center gap-2">
                        <button
                          onClick={refreshSectorTrends}
                          disabled={sectorRefreshLoading}
                          className="flex items-center gap-1.5 text-xs text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-2 py-1 rounded-lg transition-colors disabled:opacity-50 font-medium"
                        >
                          <RefreshCw className={`w-3 h-3 ${sectorRefreshLoading ? 'animate-spin' : ''}`} />
                          {sectorRefreshLoading ? 'Mise à jour...' : 'Actualiser'}
                        </button>
                        {selectedSector && (
                            <button 
                               onClick={() => setSelectedSector(null)}
                               className="text-xs text-indigo-600 hover:text-indigo-800 transition-colors font-medium border-b border-transparent hover:border-indigo-600"
                            >
                              Reset Filtres
                            </button>
                        )}
                      </div>
                    </div>
                    
                    <div className="relative z-20">
                        {sectorTrends && (
                            <CustomSelect 
                                value={selectedSector}
                                onChange={(val) => setSelectedSector(val)}
                                placeholder="Sélectionnez un secteur..."
                                options={Object.entries(sectorTrends)
                                    .filter(([_, data]) => data && data.monthly_trend !== null)
                                    .sort(([,a], [,b]) => b.monthly_trend - a.monthly_trend)
                                    .map(([sectorName, data]) => ({
                                        value: sectorName,
                                        label: `${sectorName} (${data.stocks_analyzed || data.count})`,
                                        trend: data.monthly_trend,
                                        count: data.stocks_analyzed || data.count
                                    }))
                                }
                            />
                        )}
                    </div>
                  </div>
                )}

                {/* Investment Suggestions Section (Validées) - Toujours visible */}
                <div className="bg-white border border-slate-200 shadow-sm p-6 rounded-2xl relative overflow-hidden transition-all duration-500 hover:shadow-md">
                    <div className="absolute top-0 right-0 p-8 opacity-5 pointer-events-none">
                      <Brain className="w-32 h-32 text-indigo-600" />
                    </div>
                    
                    <div className="flex justify-between items-end mb-6 relative z-10">
                      <div>
                        <h3 className="text-xl font-bold text-slate-900 flex items-center gap-2">
                           <Brain className="w-6 h-6 text-indigo-600" />
                           Opportunités IA & Fondamentaux
                        </h3>
                        <p className="text-slate-500 text-sm mt-1">
                           {aiAnalysisMode === 'sector' 
                             ? "Algorithme: Momentum Technique + Validation Fondamentale Stricte"
                             : "Analyse Sémantique des Actualités de Marché (Groq LLM)"}
                        </p>
                      </div>

                       {/* Toggle Mode */}
                      <div className="flex bg-slate-100 p-1 rounded-lg">
                          <button 
                            onClick={() => setAiAnalysisMode('sector')}
                            className={`px-3 py-1.5 text-xs font-bold rounded-md transition-all ${aiAnalysisMode === 'sector' ? 'bg-white shadow text-indigo-600' : 'text-slate-500 hover:text-slate-700'}`}
                          >
                              Secteurs
                          </button>
                          <button 
                            onClick={() => {
                                setAiAnalysisMode('news');
                                if (newsRecommendations.length === 0) fetchNewsRecommendations();
                            }}
                            className={`px-3 py-1.5 text-xs font-bold rounded-md transition-all ${aiAnalysisMode === 'news' ? 'bg-white shadow text-indigo-600' : 'text-slate-500 hover:text-slate-700'}`}
                          >
                              Actualités 📰
                          </button>
                      </div>
                    </div>

                    {aiAnalysisMode === 'news' ? (
                         <div className="relative z-10 min-h-[300px]">
                            {newsRecsLoading ? (
                                <div className="text-center py-20 flex flex-col items-center justify-center space-y-6">
                                    <div className="modern-loader">
                                       <div className="loader-core"></div>
                                    </div>
                                    <p className="text-slate-500 animate-pulse font-medium">L'IA analyse les dernières actualités Bloomberg...</p>
                                </div>
                            ) : newsRecommendations.length === 0 ? (
                                <div className="text-center py-20 flex flex-col items-center gap-4 bg-slate-50 rounded-2xl border border-slate-200">
                                    <span className="text-4xl">🗞️</span>
                                    <div className="text-slate-500 italic">
                                        Aucune actualité pertinente identifiée pour le moment via l'IA.
                                        <br/>Essayez de rafraichir ou revenez plus tard.
                                    </div>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 max-h-[800px] overflow-y-auto pr-2 custom-scrollbar pb-4">
                                {newsRecommendations.map((stock, idx) => (
                                    <div key={idx} className="bg-white border border-slate-200 hover:border-indigo-300 rounded-xl p-5 relative group shadow-sm hover:shadow-md transition-all h-full flex flex-col">
                                        <div className="flex justify-between items-start mb-3">
                                            <div>
                                                 <h4 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                                                     {stock.ticker}
                                                     <span className={`text-[10px] px-2 py-0.5 rounded-full ${stock.sentiment === 'Bullish' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600'}`}>
                                                         {stock.sentiment}
                                                     </span>
                                                 </h4>
                                                 <div className="text-xs text-slate-500 font-medium">{stock.name}</div>
                                            </div>
                                            <div className="bg-indigo-50 text-indigo-700 text-xs font-bold px-2 py-1 rounded-lg">
                                                {stock.score}/10
                                            </div>
                                        </div>
                                        
                                        <p className="text-sm text-slate-600 leading-relaxed mb-4 flex-grow border-t border-slate-50 pt-2 mt-1">
                                            {stock.reason}
                                        </p>
                                        
                                        <div className="mt-auto">
                                            <button className="w-full py-1.5 text-xs font-semibold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded transition-colors">
                                                Voir Détails
                                            </button>
                                        </div>
                                    </div>
                                ))}
                                </div>
                            )}
                         </div>
                    ) : (
                        /* EXISTING SECTOR LOGIC WRAPPER - START */
                        !selectedSector ? (
                        <div className="text-center py-20 flex flex-col items-center gap-6 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-200 hover:border-indigo-300 transition-colors group">
                            <div className="p-6 bg-white rounded-full group-hover:bg-indigo-50 transition-colors duration-300 shadow-sm border border-slate-100">
                                <PieChart className="w-12 h-12 text-slate-300 group-hover:text-indigo-500 transition-colors duration-300" />
                            </div>
                            <div className="max-w-md space-y-2">
                                <p className="text-lg font-medium text-slate-700 group-hover:text-slate-900 transition-colors">Sélectionnez un secteur pour commencer l'analyse</p>
                                <p className="text-sm text-slate-500 leading-relaxed">
                                    Notre Intelligence Artificielle va scanner l'univers sélectionné pour identifier les opportunités à haute probabilité.
                                </p>
                            </div>
                        </div>
                    ) : !suggestionsLoading && validatedSuggestions.length === 0 ? (
                        <div className="text-center py-16 flex flex-col items-center gap-4 bg-slate-50 rounded-2xl border border-slate-200">
                            <span className="text-4xl">🤷‍♂️</span>
                            <div className="text-slate-500 italic">
                                Aucune opportunité ne correspond aux critères stricts (Tendance 3 UT + Fondamentaux) dans ce secteur pour le moment.
                            </div>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 relative z-10 max-h-[800px] overflow-y-auto pr-2 custom-scrollbar pb-4">
                        {suggestionsLoading 
                            ? (
                              <div className="col-span-full py-16 flex flex-col items-center justify-center space-y-8">
                                <div className="modern-loader">
                                   <div className="loader-core"></div>
                                </div>
                                <div className="space-y-3 text-center max-w-md">
                                  <div className="text-lg font-medium text-slate-700 tracking-wide">{loadingStep}</div>
                                  <p className="text-sm text-slate-500 font-mono">Analyse approfondie de {investmentSuggestions.length} actifs en cours...</p>
                                </div>
                              </div>
                            )
                            : validatedSuggestions.map((stock, idx) => (
                            <div 
                                key={idx} 
                                onClick={() => setSelectedStockDetails(stock)}
                                className="bg-white border border-slate-200 hover:border-indigo-300 rounded-xl p-5 cursor-pointer relative overflow-hidden flex flex-col justify-between h-full transition-all duration-300 group hover:shadow-md"
                            >
                                {/* Background Gradient Effect on Hover */}
                                <div className="absolute inset-0 bg-gradient-to-br from-indigo-50/0 via-transparent to-transparent group-hover:from-indigo-50/30 transition-all duration-500"></div>

                                {/* Badge Recommendation Analyste */}
                                {stock.recommendation && (stock.recommendation === 'buy' || stock.recommendation === 'strong_buy') && (
                                    <div className="absolute top-0 right-0 bg-emerald-600 text-white text-[9px] font-bold px-2 py-0.5 rounded-bl-lg shadow-sm z-20">
                                        BUY
                                    </div>
                                )}

                            <div>
                                <div className="flex justify-between items-start mb-3">
                                    <div className="w-10 h-10 rounded-lg bg-slate-50 border border-slate-100 p-1 flex items-center justify-center overflow-hidden shrink-0">
                                        <img 
                                        src={`https://assets.traderepublic.com/img/logos/${stock.isin}/dark.svg`} 
                                        onError={(e) => {
                                            e.target.style.display='none';
                                            e.target.parentElement.innerHTML='<span class="text-xs font-bold text-slate-800">'+stock.name.substr(0,2)+'</span>';
                                        }}
                                        className="w-full h-full object-contain" 
                                        />
                                    </div>
                                    <div className="flex flex-col items-end gap-1">
                                        {/* Affichage Compact des 3 Timeframes */}
                                        <div className="flex gap-1">
                                            {stock.perfs && (
                                                <>
                                                 <span className={`text-[9px] font-mono px-1 rounded ${stock.perfs['1w'] > 0 ? 'text-emerald-700 bg-emerald-50 border border-emerald-100' : 'text-red-700 bg-red-50 border border-red-100'}`}>
                                                     W:{(stock.perfs['1w']*100).toFixed(0)}%
                                                 </span>
                                                 <span className={`text-[9px] font-mono px-1 rounded ${stock.perfs['1m'] > 0 ? 'text-emerald-700 bg-emerald-50 border border-emerald-100' : 'text-red-700 bg-red-50 border border-red-100'}`}>
                                                     M:{(stock.perfs['1m']*100).toFixed(0)}%
                                                 </span>
                                                 {stock.perfs['6m'] !== undefined && (
                                                     <span className={`text-[9px] font-mono px-1 rounded ${stock.perfs['6m'] > 0 ? 'text-emerald-700 bg-emerald-50 border border-emerald-100' : 'text-red-700 bg-red-50 border border-red-100'}`}>
                                                         6M:{(stock.perfs['6m']*100).toFixed(0)}%
                                                     </span>
                                                 )}
                                                </>
                                            )}
                                        </div>
                                    </div>
                                </div>
                                
                                <h4 className="font-bold text-slate-800 mb-0.5 truncate group-hover:text-indigo-600 transition-colors text-sm" title={stock.name}>{stock.name}</h4>
                                <div className="text-[10px] text-slate-500 mb-2 truncate font-mono">{stock.ticker} • {stock.sector}</div>
                                
                                {/* Events & Funda Tags */}
                                <div className="flex flex-wrap gap-1 mb-3">
                                    {stock.events && stock.events.length > 0 && stock.events.map((evt, i) => (
                                         <span key={'evt'+i} className="text-[9px] px-1.5 py-0.5 rounded bg-amber-50 text-amber-600 border border-amber-200 font-bold whitespace-nowrap">
                                            🔔 {evt}
                                        </span>
                                    ))}
                                    {stock.validations.slice(0, 4).map((val, vIdx) => (
                                        <span key={vIdx} className="text-[9px] px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-600 border border-indigo-100 font-medium whitespace-nowrap">
                                            {val}
                                        </span>
                                    ))}
                                </div>
                            </div>
                            
                            <div className="pt-2 border-t border-slate-100 flex justify-between items-center mt-auto">
                                <div className="flex flex-col">
                                    <span className="text-[9px] text-slate-400">Target</span>
                                    <span className="text-xs font-bold text-slate-700">{stock.targetPrice ? `€${stock.targetPrice}` : '-'}</span>
                                </div>
                                
                                <div className="text-right flex flex-col items-end">
                                    <div className="flex gap-0.5 mt-0.5">
                                        {Array(5).fill(0).map((_, i) => (
                                            <div key={i} className={`w-1.5 h-1.5 rounded-full ${i < stock.score/2 ? 'bg-indigo-500' : 'bg-slate-200'}`}></div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                            </div>
                        ))}
                        </div>
                    ))}
                  </div>
              </div>
            )}

            {/* --------- ONGLET FOREX / CALENDRIER --------- */}
            {activeTab === 'forex' && (
              <div className="space-y-6 section-transition section-enter h-[calc(100vh-140px)] flex flex-col">
                <div className="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm flex flex-col h-full">
                  {/* Header & Controls */}
                  <div className="p-4 border-b border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4 bg-slate-50">
                    <div className="flex items-center gap-4">
                        <h3 className="text-xl font-bold text-slate-900 flex items-center gap-3">
                          <span className="p-1.5 bg-indigo-100 rounded-lg text-indigo-600 border border-indigo-200"><Calendar className="w-5 h-5" /></span>
                          Calendrier Global
                        </h3>
                        <div className="flex items-center bg-white rounded-lg p-1.5 border border-slate-200 shadow-sm">
                            <button onClick={() => setCalendarDate(new Date(calendarDate.setMonth(calendarDate.getMonth() - 1)))} className="p-1 hover:bg-slate-50 rounded text-slate-400 hover:text-indigo-600 transition-colors">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" /></svg>
                            </button>
                            <span className="px-3 font-mono font-bold text-slate-700 min-w-[140px] text-center">
                                {calendarDate.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }).toUpperCase()}
                            </span>
                            <button onClick={() => setCalendarDate(new Date(calendarDate.setMonth(calendarDate.getMonth() + 1)))} className="p-1 hover:bg-slate-50 rounded text-slate-400 hover:text-indigo-600 transition-colors">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" /></svg>
                            </button>
                        </div>
                        <button onClick={() => { setCalendarDate(new Date()); setSelectedDate(new Date()); }} className="text-xs px-3 py-1.5 bg-white hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-200 border border-slate-200 rounded-lg text-slate-600 font-medium shadow-sm transition-all">
                            Aujourd'hui
                        </button>
                    </div>
                    
                    <button
                      onClick={async () => {
                        try {
                          const [earningsRes, forexRes] = await Promise.all([
                            fetch(API_BASE + '/api/refresh/earnings', { method: 'POST' }),
                            fetch(API_BASE + '/api/refresh/forex', { method: 'POST' })
                          ]);
                          const earningsResult = await earningsRes.json();
                          const forexResult = await forexRes.json();
                          setEarningsData(earningsResult.data || []);
                          const filteredForex = forexResult.data.events.filter(e => e.impact === 'High' || e.impact === 'Medium');
                          setForexData(filteredForex);
                          addNotification('Calendrier mis à jour', 'success');
                        } catch (err) {
                          console.error('Erreur refresh Calendar:', err);
                          addNotification('Erreur lors de la mise à jour', 'error');
                        }
                      }}
                      className="flex items-center gap-2 px-4 py-2 bg-[#cb3c1d] hover:bg-[#b03419] text-white rounded-lg transition-all shadow-md shadow-orange-200 text-sm font-medium"
                    >
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="animate-reverse-spin"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M21 21v-5h-5"/></svg>
                      Actualiser
                    </button>
                  </div>

                  <div className="flex flex-1 overflow-hidden bg-white">
                    {/* CALENDAR GRID */}
                    <div className="flex-1 p-4 overflow-y-auto border-r border-slate-200">
                        {(() => {
                            const year = calendarDate.getFullYear();
                            const month = calendarDate.getMonth();
                            const firstDay = new Date(year, month, 1);
                            const lastDay = new Date(year, month + 1, 0);
                            let startDay = firstDay.getDay(); 
                            if (startDay === 0) startDay = 7;
                            
                            const days = [];
                            const prevMonthLastDay = new Date(year, month, 0).getDate();
                            for (let i = startDay - 1; i > 0; i--) {
                                days.push({ date: new Date(year, month - 1, prevMonthLastDay - i + 1), isCurrentMonth: false });
                            }
                            for (let i = 1; i <= lastDay.getDate(); i++) {
                                days.push({ date: new Date(year, month, i), isCurrentMonth: true });
                            }
                            const remaining = 42 - days.length;
                            for (let i = 1; i <= remaining; i++) {
                                days.push({ date: new Date(year, month + 1, i), isCurrentMonth: false });
                            }

                            // Prepare events map
                            const eventsByDay = {};
                            const addToMap = (date, type, data) => {
                                const key = date.toISOString().split('T')[0];
                                if (!eventsByDay[key]) eventsByDay[key] = { forex: [], earnings: [], portfolio: [] };
                                if (type === 'forex') eventsByDay[key].forex.push(data);
                                else if (type === 'portfolio') eventsByDay[key].portfolio.push(data);
                                else eventsByDay[key].earnings.push(data);
                            };

                            if (forexData) forexData.forEach(e => addToMap(new Date(e.date), 'forex', e));
                            if (earningsData) earningsData.forEach(e => addToMap(new Date(e.date), 'earning', e));
                            if (portfolioCalEvents) portfolioCalEvents.forEach(e => addToMap(new Date(e.date), 'portfolio', e));

                            const weekDays = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];

                            return (
                                <div className="h-full flex flex-col">
                                    <div className="grid grid-cols-7 mb-2">
                                        {weekDays.map(d => <div key={d} className="text-center text-xs font-bold text-slate-400 uppercase py-2 tracking-wider">{d}</div>)}
                                    </div>
                                    <div className="grid grid-cols-7 grid-rows-6 gap-2 flex-1">
                                        {days.map((dayObj, idx) => {
                                            const dateKey = dayObj.date.toISOString().split('T')[0];
                                            const dayEvents = eventsByDay[dateKey];
                                            const isSelected = selectedDate && dayObj.date.toDateString() === selectedDate.toDateString();
                                            const isToday = dayObj.date.toDateString() === new Date().toDateString();
                                            
                                            const hasHighImpact = dayEvents?.forex.some(e => e.impact === 'High');
                                            const earningsCount = dayEvents?.earnings.length || 0;
                                            const forexCount = dayEvents?.forex.length || 0;
                                            const portfolioCount = dayEvents?.portfolio.length || 0;

                                            return (
                                                <div 
                                                    key={idx}
                                                    onClick={() => setSelectedDate(dayObj.date)}
                                                    className={`
                                                        relative p-2 rounded-lg border cursor-pointer transition-all flex flex-col justify-between
                                                        ${!dayObj.isCurrentMonth ? 'opacity-30 bg-slate-50 border-transparent' : ''}
                                                        ${isSelected 
                                                            ? 'ring-2 ring-indigo-500 bg-indigo-50 border-indigo-200 z-10 shadow-md' 
                                                            : 'bg-white border-slate-200 hover:bg-slate-50 hover:border-indigo-200 hover:shadow-sm'}
                                                    `}
                                                >
                                                    <div className="flex justify-between items-start">
                                                        <span className={`text-sm font-mono ${isToday ? 'text-indigo-600 font-bold bg-indigo-100 px-1.5 rounded' : 'text-slate-500'}`}>
                                                            {dayObj.date.getDate()}
                                                        </span>
                                                        {hasHighImpact && <div className="w-2 h-2 rounded-full bg-red-500 shadow-[0_0_5px_rgba(239,68,68,0.4)] animate-pulse"></div>}
                                                    </div>
                                                    
                                                    <div className="flex gap-1 mt-1 flex-wrap content-end">
                                                        {earningsCount > 0 && (
                                                            <div className="text-[10px] bg-purple-50 text-purple-600 px-1 rounded border border-purple-100 flex-1 text-center truncate font-medium">
                                                                {earningsCount} Res.
                                                            </div>
                                                        )}
                                                        {forexCount > 0 && (
                                                            <div className="text-[10px] bg-sky-50 text-sky-600 px-1 rounded border border-sky-100 flex-1 text-center truncate font-medium">
                                                                {forexCount} Eco.
                                                            </div>
                                                        )}
                                                        {portfolioCount > 0 && (
                                                            <div className="text-[10px] bg-amber-50 text-amber-700 px-1 rounded border border-amber-200 flex-1 text-center truncate font-bold">
                                                                ★ {portfolioCount}
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            );
                        })()}
                    </div>

                    {/* DETAILS PANEL */}
                    <div className="w-96 bg-slate-50/50 p-0 flex flex-col">
                        <div className="p-4 border-b border-slate-200 bg-white">
                            <h4 className="text-lg font-bold text-slate-800 capitalize">
                                {selectedDate.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })}
                            </h4>
                            <p className="text-xs text-slate-500 mt-1 font-medium">Détails des événements</p>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-4 space-y-4">
                            {(() => {
                                const dateKey = selectedDate.toISOString().split('T')[0];
                                const events = [];
                                if (forexData) forexData.filter(e => new Date(e.date).toISOString().split('T')[0] === dateKey).forEach(e => events.push({...e, type: 'forex'}));
                                if (earningsData) earningsData.filter(e => e.date === dateKey).forEach(e => events.push({...e, type: 'earning'}));
                                if (portfolioCalEvents) portfolioCalEvents.filter(e => e.date === dateKey).forEach(e => events.push({...e, type: 'portfolio'}));
                                
                                if (events.length === 0) {
                                    return (
                                        <div className="text-center py-10 text-slate-400">
                                            <div className="mb-2 text-2xl opacity-20">📅</div>
                                            Aucun événement ce jour
                                        </div>
                                    );
                                }

                                // Sort by time (if available) or type
                                events.sort((a, b) => {
                                    if (a.type === 'forex' && b.type === 'forex') return new Date(a.date) - new Date(b.date);
                                    return 0;
                                });

                                return events.map((item, idx) => {
                                    if (item.type === 'forex') {
                                        return (
                                            <div key={idx} className="bg-white border border-slate-200 rounded-xl p-4 hover:border-indigo-300 transition-all shadow-sm group">
                                                <div className="flex items-center justify-between mb-2">
                                                    <span className="text-xs font-mono text-slate-400 font-medium group-hover:text-indigo-600">{new Date(item.date).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})}</span>
                                                    <div className="flex items-center gap-2">
                                                        <span className="text-lg drop-shadow-sm">{getCountryFlag(item.country)}</span>
                                                        <span className={`text-[10px] px-2 py-0.5 rounded font-bold border ${getImpactColor(item.impact)}`}>{item.impact}</span>
                                                    </div>
                                                </div>
                                                <div className="font-bold text-sm text-slate-800 mb-2">{item.title}</div>
                                                {(item.forecast || item.previous) && (
                                                    <div className="flex justify-between text-xs text-slate-500 bg-slate-50 p-2 rounded-lg border border-slate-100">
                                                        <div>Prev: <span className="text-slate-700 font-mono">{item.previous}</span></div>
                                                        <div>Est: <span className="text-indigo-600 font-mono font-bold">{item.forecast}</span></div>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    } else if (item.type === 'earning') {
                                        return (
                                            <div key={idx} className="bg-white border border-purple-100 rounded-xl p-3 hover:border-purple-300 transition-all relative overflow-hidden shadow-sm group">
                                                <div className="absolute left-0 top-0 bottom-0 w-1 bg-purple-500"></div>
                                                <div className="flex items-center gap-3 mb-3 pl-2">
                                                    <StockLogo ticker={item.ticker} name={item.name} className="w-10 h-10 border border-slate-100 shadow-sm" />
                                                    <div>
                                                        <div className="font-bold text-slate-900 text-sm group-hover:text-purple-700">{item.ticker}</div>
                                                        <div className="text-[10px] text-slate-500 truncate w-32">{item.name}</div>
                                                    </div>
                                                </div>
                                                <div className="grid grid-cols-2 gap-2 text-xs pl-2">
                                                    <div className="bg-purple-50/50 p-2 rounded-lg border border-purple-50">
                                                        <div className="text-purple-400 font-bold uppercase tracking-wider text-[9px] mb-1">EPS Est.</div>
                                                        <div className="font-mono text-slate-700 font-bold">{item.eps_estimate !== 'N/A' ? `$${item.eps_estimate}` : '-'}</div>
                                                    </div>
                                                    <div className="bg-slate-50 p-2 rounded-lg border border-slate-100">
                                                        <div className="text-slate-400 font-bold uppercase tracking-wider text-[9px] mb-1">Mkt Cap</div>
                                                        <div className="font-mono text-slate-600">{item.market_cap ? `$${(item.market_cap/1e9).toFixed(0)}B` : '-'}</div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    } else if (item.type === 'portfolio') {
                                        return (
                                            <div key={idx} className="bg-white border border-amber-100 rounded-xl p-3 hover:border-amber-300 transition-all relative overflow-hidden shadow-sm group">
                                                <div className="absolute left-0 top-0 bottom-0 w-1 bg-amber-400"></div>
                                                <div className="flex items-center gap-3 pl-2">
                                                    <div className={`w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0 ${(item.label||'').includes('Dividende') ? 'bg-emerald-50 border border-emerald-100' : 'bg-indigo-50 border border-indigo-100'}`}>
                                                        <span className="text-base">{(item.label||'').includes('Dividende') ? '💰' : '📊'}</span>
                                                    </div>
                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex items-center gap-1.5 flex-wrap">
                                                            <span className="font-bold text-slate-900 text-sm">{item.name || item.ticker}</span>
                                                            <span className="font-mono text-[10px] bg-amber-50 border border-amber-100 px-1.5 rounded text-amber-700 font-bold">{item.ticker}</span>
                                                            <span className="text-[10px] bg-slate-50 border border-slate-100 px-1.5 rounded text-slate-500">★ Portfolio</span>
                                                        </div>
                                                        <div className="text-xs text-slate-500 mt-0.5">
                                                            {item.label}
                                                            {item.eps_estimate != null && <span className="ml-2 text-indigo-600 font-medium">EPS est. ${item.eps_estimate}</span>}
                                                            {item.dividend_amount != null && <span className="ml-2 text-emerald-600 font-medium">{item.dividend_amount}$/action</span>}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    } else {
                                        return null;
                                    }
                                });
                            })()}
                        </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            
            {activeTab === 'technique' && (
              <div className="space-y-8 section-transition section-enter">
                
                {/* NEW: GLOBAL MARKET DASHBOARD */}
                <GlobalMarketDashboard data={globalMarketData} onRefresh={updateMarketData} />

                {/* --- POLYMARKET INTEGRATION --- */}
                <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm relative overflow-hidden mt-8">
                     <div className="flex items-center justify-between mb-6">
                        <div className="flex items-center gap-3">
                            <div className="w-12 h-12 bg-slate-900 rounded-xl flex items-center justify-center overflow-hidden shadow-lg shadow-slate-200">
                               <img src="https://cdn.brandfetch.io/idnft8znqj/w/512/h/512/theme/dark/icon.png?c=1bxid64Mup7aczewSAYMX&t=1769217214974" alt="Polymarket" className="w-full h-full object-cover" />
                            </div>
                            <div>
                                <h3 className="text-lg font-bold text-slate-900">Signaux de Prédiction</h3>
                                <p className="text-slate-500 text-xs">Probabilités de marché liées au Portfolio & Macro</p>
                            </div>
                        </div>
                        <button 
                            onClick={fetchPortfolioPredictions} 
                            disabled={predictionsLoading}
                            className={`p-2 rounded-lg transition-colors ${predictionsLoading ? 'bg-slate-100 text-slate-400' : 'bg-indigo-50 text-indigo-600 hover:bg-indigo-100'}`}
                        >
                            <RefreshCw className={`w-4 h-4 ${predictionsLoading ? 'animate-spin' : ''}`} />
                        </button>
                     </div>

                     {predictionsLoading && !portfolioPredictions ? (
                        <div className="py-8 text-center flex flex-col items-center justify-center space-y-3 bg-slate-50/30 rounded-xl border border-dashed border-slate-200">
                            <div className="w-5 h-5 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                            <p className="text-sm text-slate-400">Analyse des marchés de prédiction en cours...</p>
                        </div>
                     ) : (
                        portfolioPredictions && (portfolioPredictions.macro || portfolioPredictions.portfolio) ? (
                            <div className="space-y-8">
                                {/* MACRO SECTION */}
                                {portfolioPredictions.macro && portfolioPredictions.macro.length > 0 && (
                                    <div>
                                        <h4 className="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4 flex items-center gap-2 border-b border-slate-100 pb-2">
                                            <Globe className="w-4 h-4 text-indigo-400"/> Macro & Indices
                                        </h4>
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                            {portfolioPredictions.macro.map((market, idx) => (
                                                <a key={`macro-${idx}`} href={market.url} target="_blank" rel="noopener noreferrer" className="block bg-slate-50/80 p-5 rounded-xl border border-slate-200 hover:border-indigo-400 hover:shadow-md transition-all group relative overflow-hidden flex flex-col h-full">
                                                    <div className="flex justify-between items-start gap-2 mb-3">
                                                        <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md bg-indigo-50 text-indigo-700 text-[10px] font-bold uppercase tracking-wider border border-indigo-100 flex-shrink-0">
                                                            {market.source_keyword}
                                                        </span>
                                                        <span className="text-[10px] text-slate-400 font-medium whitespace-nowrap">
                                                            Vol: ${market.volume_usd ? Math.round(market.volume_usd).toLocaleString() : '0'}
                                                        </span>
                                                    </div>
                                                    
                                                    <p className="font-bold text-sm text-slate-800 leading-normal mb-4 min-h-[3rem]" title={market.question}>
                                                        {market.question}
                                                    </p>
                                                    
                                                    {(() => {
                                                        const expandKey = `macro-${idx}`;
                                                        const isExp = expandedPredictions.has(expandKey);
                                                        const sorted = (market.outcomes || []).slice().sort((a, b) => parseFloat(b.price || 0) - parseFloat(a.price || 0));
                                                        const shown = isExp ? sorted : sorted.slice(0, 3);
                                                        return (
                                                        <div className="space-y-2 mb-3 flex-grow">
                                                            {shown.length > 0 ? shown.map((outcome, oIdx) => {
                                                                const pct = Math.round(parseFloat(outcome.price || 0) * 100);
                                                                return (
                                                                <div key={oIdx} className="relative">
                                                                    <div className="flex justify-between text-xs font-semibold text-slate-700 mb-1 z-10 relative">
                                                                        <span className="truncate max-w-[72%]" title={outcome.name}>{outcome.name}</span>
                                                                        <span className={pct >= 50 ? 'text-indigo-600' : 'text-slate-500'}>{pct}%</span>
                                                                    </div>
                                                                    <div className="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
                                                                        <div className={`h-full ${pct >= 50 ? 'bg-indigo-500' : 'bg-indigo-300'}`} style={{width: `${pct}%`}}></div>
                                                                    </div>
                                                                </div>
                                                            )}) : (
                                                                <div className="w-full bg-slate-200 h-1.5 rounded-full mt-2" />
                                                            )}
                                                            {sorted.length > 3 && (

                                'Morgan Stanley':  'https://logo.clearbit.com/morganstanley.com',
                                'UBS':             'https://logo.clearbit.com/ubs.com',
                                'Deutsche Bank':   'https://logo.clearbit.com/db.com',
                                'HSBC':            'https://logo.clearbit.com/hsbc.com',
                                'Credit Suisse':   'https://logo.clearbit.com/credit-suisse.com',
                                'Citi':            'https://logo.clearbit.com/citigroup.com',
                              };
                              const logoUrlT = bankIconsT[forecast.bank];
                              const tPalette = ['#1e40af','#065f46','#6d28d9','#92400e','#1e3a5f','#7f1d1d','#064e3b','#312e81'];
