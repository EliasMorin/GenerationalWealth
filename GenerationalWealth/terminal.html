            if (diff <= 7) return <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-orange-100 text-orange-700 border border-orange-200">J-{diff}</span>;
            if (diff <= 30) return <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-amber-50 text-amber-700 border border-amber-200">J-{diff}</span>;
            return <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-500">J-{diff}</span>;
        };

        return (
            <div className="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                <div className="p-4 border-b border-slate-100 bg-slate-50 flex items-center justify-between">
                    <h3 className="font-bold text-slate-900 flex items-center gap-2 text-base">
                        <span className="p-1.5 bg-indigo-50 rounded-lg text-indigo-600 border border-indigo-100">
                            <Calendar className="w-4 h-4" />
                        </span>
                        Événements Portfolio (90j)
                    </h3>
                    <div className="flex items-center gap-2">
                        <span className="text-xs text-slate-400 font-medium">{events.length} événement{events.length !== 1 ? 's' : ''}</span>
                        <button onClick={() => doFetch(true)} disabled={loading}
                            className="p-1 rounded-md hover:bg-slate-200 text-slate-400 disabled:opacity-40 transition-colors" title="Forcer le rechargement">
                            <svg xmlns="http://www.w3.org/2000/svg" className={`w-3.5 h-3.5 ${loading ? 'animate-spin' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                            </svg>
                        </button>
                    </div>
                </div>
                {loading ? (
                    <div className="p-6 flex items-center justify-center gap-3 text-slate-500 text-sm">
                        <div className="w-5 h-5 border-2 border-slate-200 border-t-indigo-500 rounded-full animate-spin"></div>
                        Chargement des événements…
                    </div>
                ) : events.length === 0 ? (
                    <div className="p-6 text-center text-slate-400 text-sm">
                        {fetched
                            ? <span>Aucun événement prévu dans les 90 prochains jours.{' '}
                                <button onClick={() => doFetch(true)} className="text-indigo-500 hover:underline text-xs">Réessayer</button>
                              </span>
                            : 'Aucune position détectée.'}
                    </div>
                ) : (
                    <div className="divide-y divide-slate-50">
                        {events.map((evt, i) => (
                            <div key={i} className={`flex items-center gap-4 px-4 py-3 hover:bg-slate-50 transition-colors ${new Date(evt.date) <= in7 ? 'bg-orange-50/40' : ''}`}>
                                <div className={`w-10 h-10 rounded-xl flex flex-col items-center justify-center flex-shrink-0 text-center ${evt.type === 'earnings' ? 'bg-indigo-50 border border-indigo-100' : 'bg-emerald-50 border border-emerald-100'}`}>
                                    <span className={`text-[10px] font-bold uppercase ${evt.type === 'earnings' ? 'text-indigo-500' : 'text-emerald-500'}`}>
                                        {new Date(evt.date).toLocaleDateString('fr-FR', {month:'short'}).replace('.','').toUpperCase()}
                                    </span>
                                    <span className={`text-base font-bold leading-none ${evt.type === 'earnings' ? 'text-indigo-700' : 'text-emerald-700'}`}>
                                        {new Date(evt.date).getDate()}
                                    </span>
                                </div>
                                <div className="flex-1 min-w-0">
                                    <div className="flex items-center gap-2 flex-wrap">
                                        <span className="font-bold text-slate-800 text-sm">{evt.name}</span>
                                        <span className="font-mono text-[10px] bg-slate-100 px-1.5 py-0.5 rounded text-slate-500 font-bold">{evt.ticker}</span>
                                        {badge(evt)}
                                    </div>
                                    <div className="text-xs text-slate-400 mt-0.5 flex items-center gap-2">
                                        <span className={`font-medium ${evt.type === 'earnings' ? 'text-indigo-500' : 'text-emerald-500'}`}>
                                            {evt.type === 'earnings' ? '📊 ' : '💰 '}{evt.label}
                                        </span>
                                        {evt.eps_estimate != null && <span className="text-slate-400">· EPS est. <b className="text-slate-600">{evt.eps_estimate > 0 ? '+' : ''}{evt.eps_estimate}</b></span>}
                                        {evt.dividend_amount != null && <span className="text-slate-400">· <b className="text-slate-600">{evt.dividend_amount}$/action</b></span>}
                                    </div>
                                </div>
                                <div className="text-xs text-slate-400 font-mono flex-shrink-0">
                                    {new Date(evt.date).toLocaleDateString('fr-FR')}
                                </div>
                            </div>
                        ))}
                    </div>
                )}

                {/* ── Corrélateur News intégré ── */}
                <NewsCorrelatorWidget portfolioPositions={positions} />
            </div>
        );
    });

    /* ------------------- Watchlist ------------------- */
    const WatchlistComponent = ({ portfolioPositions = [] }) => {
        const [watchlist, setWatchlist] = React.useState([]);
        const [prices, setPrices] = React.useState({});
        const [input, setInput] = React.useState('');
        const [adding, setAdding] = React.useState(false);
        const [loadingPrices, setLoadingPrices] = React.useState(false);
        const [error, setError] = React.useState('');
        const [suggestions, setSuggestions] = React.useState([]);
        const [showSuggestions, setShowSuggestions] = React.useState(false);
        const [loadingSuggestions, setLoadingSuggestions] = React.useState(false);
        const debounceRef = React.useRef(null);
        const inputRef = React.useRef(null);

        // Live search via Yahoo Finance autocomplete (debounced 300ms)
        React.useEffect(() => {
            const q = input.trim();
            if (!q) { setSuggestions([]); setShowSuggestions(false); return; }
            clearTimeout(debounceRef.current);
            debounceRef.current = setTimeout(async () => {
                setLoadingSuggestions(true);
                try {
                    const r = await fetch(`${API_BASE}/api/watchlist/search?q=${encodeURIComponent(q)}`);
                    const data = await r.json();
                    const existingTickers = new Set(watchlist.map(w => w.ticker));
                    setSuggestions((data || []).filter(s => !existingTickers.has(s.ticker)));
                    setShowSuggestions(true);
                } catch(e) { setSuggestions([]); }
                setLoadingSuggestions(false);
            }, 300);
            return () => clearTimeout(debounceRef.current);
        }, [input, watchlist]);

        const loadWatchlist = () => {
            fetch(API_BASE + '/api/watchlist')
                .then(r => r.json())
                .then(data => { setWatchlist(data || []); })
                .catch(() => {});
        };

        const loadPrices = (list) => {
            const tickers = list.map(w => w.ticker);
            if (!tickers.length) return;
            setLoadingPrices(true);
            fetch(API_BASE + '/api/watchlist/prices', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ tickers })
            })
            .then(r => r.json())
            .then(d => setPrices(d || {}))
            .catch(() => {})
            .finally(() => setLoadingPrices(false));
        };

        React.useEffect(() => {
            loadWatchlist();
        }, []);

        React.useEffect(() => {
            if (watchlist.length) loadPrices(watchlist);
        }, [watchlist]);

        const handleAdd = async (tickerOverride) => {
            const ticker = (tickerOverride || input).trim().toUpperCase();
            if (!ticker) return;
            setAdding(true); setError(''); setShowSuggestions(false);
            try {
                const res = await fetch(API_BASE + '/api/watchlist', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ ticker })
                });
                const data = await res.json();
                if (data.error) { setError(data.error); }
                else { setWatchlist(data.watchlist || []); setInput(''); }
            } catch(e) { setError('Erreur réseau'); }
            setAdding(false);
        };

        const handleRemove = async (ticker) => {
            try {
                const res = await fetch(`${API_BASE}/api/watchlist/${ticker}`, { method: 'DELETE' });
                const data = await res.json();
                setWatchlist(data.watchlist || []);
            } catch(e) {}
        };

        return (
            <div className="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                <div className="p-4 border-b border-slate-100 bg-slate-50 flex items-center justify-between">
                    <h3 className="font-bold text-slate-900 flex items-center gap-2 text-base">
                        <span className="p-1.5 bg-amber-50 rounded-lg text-amber-600 border border-amber-100">
                            <Star className="w-4 h-4" />
                        </span>
                        Watchlist
                    </h3>
                    <div className="flex items-center gap-2">
                        <div className="relative">
                            <input
                                ref={inputRef}
                                type="text"
                                value={input}
                                onChange={e => { setInput(e.target.value.toUpperCase()); setShowSuggestions(true); }}
                                onKeyDown={e => {
                                    if (e.key === 'Enter') { handleAdd(); }
                                    if (e.key === 'Escape') { setShowSuggestions(false); }
                                }}
                                onFocus={() => { if (suggestions.length) setShowSuggestions(true); }}
                                onBlur={() => setTimeout(() => setShowSuggestions(false), 150)}
                                placeholder="AAPL, MSFT…"
                                className="text-xs px-3 py-1.5 border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-400 font-mono w-36 bg-white"
                            />
                            {showSuggestions && (suggestions.length > 0 || loadingSuggestions) && (
                                <div className="absolute right-0 top-full mt-1 bg-white border border-slate-200 rounded-lg shadow-lg z-50 min-w-[260px] overflow-hidden">
                                    {loadingSuggestions && suggestions.length === 0 ? (
                                        <div className="px-3 py-2 text-xs text-slate-400 flex items-center gap-2">
                                            <div className="w-3 h-3 border-2 border-slate-200 border-t-indigo-400 rounded-full animate-spin"/>
                                            Recherche…
                                        </div>
                                    ) : suggestions.map((s, i) => (
                                        <button
                                            key={i}
                                            onMouseDown={e => { e.preventDefault(); setInput(s.ticker); handleAdd(s.ticker); }}
                                            className="w-full flex items-center gap-3 px-3 py-2 hover:bg-indigo-50 transition-colors text-left border-b border-slate-50 last:border-0"
                                        >
                                            <span className="font-mono font-bold text-xs text-indigo-700 w-16 shrink-0">{s.ticker}</span>
                                            <span className="text-xs text-slate-600 truncate flex-1">{s.name}</span>
                                            {s.exchange && <span className="text-[10px] text-slate-300 shrink-0">{s.exchange}</span>}
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>
                        <button
                            onClick={() => handleAdd()}
                            disabled={adding || !input.trim()}
                            className="text-xs px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-bold transition-all disabled:opacity-50 flex items-center gap-1"
                        >
                            {adding ? <div className="w-3 h-3 border-2 border-white/30 border-t-white rounded-full animate-spin"/> : '+'}
                            Ajouter
                        </button>
                    </div>
                </div>
                {error && <div className="px-4 py-2 text-xs text-red-600 bg-red-50 border-b border-red-100">{error}</div>}
                {watchlist.length === 0 ? (
                    <div className="p-8 text-center text-slate-400 text-sm">
                        <Star className="w-8 h-8 mx-auto mb-2 opacity-20" />
                        <p>Ajoutez des titres à surveiller.</p>
                        <p className="text-xs mt-1 text-slate-300">Ex: AAPL, TSLA, MSFT, NVDA…</p>
                    </div>
                ) : (
                    <div className="overflow-x-auto">
                        <table className="w-full">
                            <thead className="bg-slate-50 text-[10px] uppercase tracking-wider text-slate-400 border-b border-slate-100">
                                <tr>
                                    <th className="p-3 text-left font-semibold">Titre</th>
                                    <th className="p-3 text-right font-semibold">Prix</th>
                                    <th className="p-3 text-right font-semibold">Var. %</th>
                                    <th className="p-3 text-right font-semibold">P/E</th>
                                    <th className="p-3 text-right font-semibold">Secteur</th>
                                    <th className="p-3 text-right font-semibold w-8"></th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-50">
                                {watchlist.map((w, i) => {
                                    const p = prices[w.ticker];
                                    const chg = p?.change_pct;
                                    return (
                                        <tr key={i} className="hover:bg-slate-50 transition-colors group">
                                            <td className="p-3">
                                                <div className="font-bold text-slate-800 text-sm">{p?.name || w.name || w.ticker}</div>
                                                <div className="font-mono text-[10px] text-slate-400">{w.ticker}</div>
                                            </td>
                                            <td className="p-3 text-right font-mono font-bold text-slate-800 text-sm">
                                                {loadingPrices ? <span className="text-slate-300">…</span> : p?.price != null ? `${p.price}` : '–'}
                                            </td>
                                            <td className="p-3 text-right">
                                                {chg != null ? (
                                                    <span className={`text-xs font-bold px-2 py-0.5 rounded ${chg >= 0 ? 'bg-emerald-50 text-emerald-700 border border-emerald-100' : 'bg-red-50 text-red-600 border border-red-100'}`}>
                                                        {chg >= 0 ? '+' : ''}{chg}%
                                                    </span>
                                                ) : <span className="text-slate-300 text-xs">–</span>}
                                            </td>
                                            <td className="p-3 text-right text-xs text-slate-500 font-mono">
                                                {p?.pe != null ? p.pe : <span className="text-slate-300">–</span>}
                                            </td>
                                            <td className="p-3 text-right text-xs text-slate-400 max-w-[120px] truncate">
                                                {p?.sector || <span className="text-slate-300">–</span>}
                                            </td>
                                            <td className="p-3 text-right">
                                                <button
                                                    onClick={() => handleRemove(w.ticker)}
                                                    className="opacity-0 group-hover:opacity-100 transition-opacity text-slate-300 hover:text-red-500 p-1 rounded"
                                                    title="Retirer de la watchlist"
                                                >
                                                    <X className="w-3.5 h-3.5" />
                                                </button>
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                )}
            </div>
        );
    };

    /* ------------------- Portfolio Allocation Charts ------------------- */
    const PortfolioAllocation = React.memo(({ positions }) => {
        const chartRefSector = useRef(null);
        const chartRefCountry = useRef(null);
        const canvasRefSector = useRef(null);
        const canvasRefCountry = useRef(null);
        
        const data = useMemo(() => {
            if (!positions || positions.length === 0) return null;
            
            const sectors = {};
            const countries = {};
            let total = 0;
            
            positions.forEach(p => {
                const val = p.marketValue || p.totalValue || 0;
                total += val;
                
                const s = (p.sector && p.sector !== 'Unknown') ? p.sector : 'Autre';
                const c = (p.country && p.country !== 'Unknown') ? p.country : 'Global';
                
                if (!sectors[s]) sectors[s] = { value: 0, refIndex: p.reference_index_name };
                sectors[s].value += val;
                
                countries[c] = (countries[c] || 0) + val;
            });
            
            const toArray = (obj) => Object.entries(obj)
                .map(([k, v]) => ({ 
                    label: k, 
                    value: typeof v === 'object' ? v.value : v,
                    ref: typeof v === 'object' ? v.refIndex : null
                }))
                .sort((a,b) => b.value - a.value);
                
            return {
                sectors: toArray(sectors),
                countries: toArray(countries),
                total
            };
        }, [positions]);

        useEffect(() => {
            if (!data) return;
            
            const createChart = (canvasRef, chartRef, items) => {
                if (!canvasRef.current) return;
                
                if (chartRef.current) chartRef.current.destroy();
                
                const ctx = canvasRef.current.getContext('2d');
                
                // Color Palette
                const palette = [
                    '#4f46e5', // Indigo
                    '#06b6d4', // Cyan
                    '#10b981', // Emerald
                    '#f59e0b', // Amber
                    '#ef4444', // Red
                    '#8b5cf6', // Violet
                    '#ec4899', // Pink
                    '#64748b'  // Slate
                ];

                chartRef.current = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: items.map(i => i.label),
                        datasets: [{
                            data: items.map(i => i.value),
                            backgroundColor: palette,
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: (ctx) => {
                                        const val = ctx.raw;
                                        const pct = ((val / data.total) * 100).toFixed(1);
                                        return ` ${ctx.label}: ${pct}%`;
                                    },
                                    afterLabel: (ctx) => {
                                       const idx = ctx.dataIndex;
                                       const item = items[idx];
                                       if(item.ref) return `Index: ${item.ref}`;
                                    }
                                }
                            }
                        },
                        cutout: '70%',
                        layout: { padding: 0 }
                    }
                });
            };

            const palette = [
                '#6366f1', '#06b6d4', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#64748b'
            ];

            createChart(canvasRefSector, chartRefSector, data.sectors);
            
            // --- CUSTOM GEOGRAPHY CHART WITH FLAGS ---
            if (canvasRefCountry.current) {
                const ctx = canvasRefCountry.current.getContext('2d');
                const items = data.countries;
                
                // Helper to load image
                const loadImage = (src) => {
                    return new Promise((resolve) => {
                        const img = new Image();
                        img.src = src;
                        img.onload = () => resolve(img);
                        img.onerror = () => resolve(null); // Fallback
                    });
                };
                
                // Drapeau mapping (ISO 2 -> flag CDN)
                // On utilise flagcdn.com 
                // Mapping simple noms -> code ISO
                const countryCodeMap = {
                    'Etats Unis': 'us', 'États-Unis': 'us', 'USA': 'us', 'United States': 'us',
                    'France': 'fr', 'Germany': 'de', 'Allemagne': 'de',
                    'Netherlands': 'nl', 'Pays-Bas': 'nl',
                    'United Kingdom': 'gb', 'Royaume-Uni': 'gb',
                    'China': 'cn', 'Chine': 'cn',
                    'Japan': 'jp', 'Japon': 'jp',
                    'Canada': 'ca',
                    'Switzerland': 'ch', 'Suisse': 'ch',
                    'Italy': 'it', 'Italie': 'it',
                    'Spain': 'es', 'Espagne': 'es',
                    'Ireland': 'ie', 'Irlande': 'ie',
                    'Luxembourg': 'lu',
                    'Belgium': 'be', 'Belgique': 'be',
                    'Sweden': 'se', 'Suède': 'se',
                    'Denmark': 'dk', 'Danemark': 'dk',
                    'Norway': 'no', 'Norvège': 'no',
                    'Brazil': 'br', 'Brésil': 'br',
                    'India': 'in', 'Inde': 'in',
                    'Korea': 'kr', 'Corée': 'kr',
                    'Taiwan': 'tw',
                    'Australia': 'au', 'Australie': 'au'
                };
                
                const getFlag = (countryName) => {
                    // Nettoyage basique
                    let name = countryName.trim();
                    let code = countryCodeMap[name];
                    if (!code) {
                        // Essai de split si "Pays-Bas (NL)"
                        const parts = name.split(' ');
                        if (countryCodeMap[parts[0]]) code = countryCodeMap[parts[0]];
                        else code = 'un'; // United Nations (generic) default
                    }
                    return `https://flagcdn.com/w40/${code}.png`;
                };

                const labels = items.map(i => i.label);
                
                // Custom plugin for center flag (optional) or just tooltip
                // Ici on veut afficher les drapeaux DANS la légende ou le tooltip c'est dur en canvas pur chartjs
                // Solution: On remplace le Doughnut par une liste HTML avec drapeaux pour la géo
                // MAIS l'utilisateur demande "DANS LE GRAPHIQUE".
                // ChartJS ne supporte pas nativement les images dans les segments.
                // Workaround: Afficher les drapeaux à côté en légende HTML personnalisée.
                
                // Render Chart normally first
                chartRefCountry.current = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: items.map(i => i.value),
                            backgroundColor: palette,
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true, 
                        maintainAspectRatio: false,
                        animation: false,
                        cutout: '70%',
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                enabled: false, // On désactive le tooltip natif pour le custom HTML external si besoin, mais restons simple
                                external: function(context) {
                                    // Tooltip Logic could go here
                                }
                            }
                        },
                        layout: { padding: 0 }
                    }
                });
            }

            return () => {
                if (chartRefSector.current) chartRefSector.current.destroy();
                if (chartRefCountry.current) chartRefCountry.current.destroy();
            };
        }, [data]);

        if (!data) return null;

        return (
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 h-full">
                {/* Sector Chart */}
                <div className="bg-white rounded-xl border border-slate-100 p-4 flex flex-col items-center justify-center relative shadow-sm hover:shadow transition-shadow">
                    <h3 className="text-[11px] font-bold text-slate-500 uppercase tracking-widest absolute top-3 left-3 mb-2">
                        Secteurs
                    </h3>
                    <div className="w-full h-32 relative mt-4">
                        <canvas ref={canvasRefSector} />
                    </div>
                     <div className="mt-2 text-[10px] text-slate-400 font-medium">
                        {data.sectors.length} Secteurs
                    </div>
                </div>

                {/* Geography Chart - REPLACED WITH LIST + FLAGS + MINI CHART */}
                 <div className="bg-white rounded-xl border border-slate-100 p-4 flex flex-col relative shadow-sm hover:shadow transition-shadow overflow-hidden">
                    <h3 className="text-[11px] font-bold text-slate-500 uppercase tracking-widest absolute top-3 left-3 mb-2">
                        Géographie
                    </h3>
                    
                    <div className="flex items-center h-full mt-6 gap-6">
                        {/* LEFT: Mini Donut */}
                        <div className="w-32 h-32 flex-shrink-0 relative">
                             <canvas ref={canvasRefCountry} />
                        </div>

                        {/* RIGHT: List with Flags */}
                        <div className="flex-1 overflow-y-auto max-h-32 custom-scrollbar pr-1">
                             <div className="space-y-1.5">
                                 {data.countries.map((c, idx) => {
                                     // Helper Flag Logic (Reduplicated because scope issue in render)
                                     const countryCodeMap = {
                                        'Etats Unis': 'us', 'États-Unis': 'us', 'USA': 'us', 'United States': 'us',
                                        'France': 'fr', 'Germany': 'de', 'Allemagne': 'de',
                                        'Netherlands': 'nl', 'Pays-Bas': 'nl',
                                        'United Kingdom': 'gb', 'Royaume-Uni': 'gb',
                                        'China': 'cn', 'Chine': 'cn',
                                        'Japan': 'jp', 'Japon': 'jp',
                                        'Canada': 'ca', 'Switzerland': 'ch', 'Suisse': 'ch', 'Italy': 'it', 'Italie': 'it',
                                        'Spain': 'es', 'Espagne': 'es', 'Ireland': 'ie', 'Irlande': 'ie',
                                        'Luxembourg': 'lu', 'Belgium': 'be', 'Belgique': 'be', 'Sweden': 'se',
                                        'Denmark': 'dk', 'Norway': 'no', 'Brazil': 'br', 'India': 'in', 'Korea': 'kr',
                                        'Taiwan': 'tw', 'Australia': 'au'
                                     };
                                     const getFlag = (name) => {
                                         let code = countryCodeMap[name.trim()] || 'un';
                                         return `https://flagcdn.com/w20/${code}.png`;
                                     };
                                     const palette = [
                                        '#6366f1', '#06b6d4', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#64748b'
                                     ];
                                     const color = palette[idx % palette.length];
                                     const pct = (c.value / data.total * 100).toFixed(0);

                                     return (
                                         <div key={idx} className="flex items-center text-xs group pr-2">
                                             <div className="flex items-center gap-2 overflow-hidden w-32">
                                                 <img src={getFlag(c.label)} alt={c.label} className="w-4 h-3 rounded-sm object-cover shadow-sm flex-shrink-0" />
                                                 <span className="truncate text-slate-600 font-medium group-hover:text-slate-900 transition-colors" title={c.label}>{c.label}</span>
                                             </div>
                                             <div className="flex items-center gap-1.5 flex-shrink-0">
                                                <span className="font-mono font-bold text-slate-700">{pct}%</span>
                                                <div className="w-1.5 h-1.5 rounded-full" style={{backgroundColor: color}}></div>
                                             </div>
                                         </div>
                                     );
                                 })}
                             </div>
                        </div>
                    </div>
                </div>
            </div>
        );
    });

    const TRPortfolioChart = React.memo(() => {
        const RANGES = [
            { id: '1d', label: '1J' },
            { id: '5d', label: '5J' },
            { id: '1m', label: '1M' },
            { id: '6m', label: '6M' },
            { id: '1y', label: '1A' },
            { id: 'max', label: 'MAX' },
        ];
        const [range, setRange] = React.useState('5d');
        const [data, setData] = React.useState(null);
        const [loading, setLoading] = React.useState(false);
        const [error, setError] = React.useState(null);
        const [showCookieModal, setShowCookieModal] = React.useState(false);
        const [cookieInput, setCookieInput] = React.useState('');
        const [savingCookie, setSavingCookie] = React.useState(false);
        const [hoverVal, setHoverVal] = React.useState(null);
        const [refreshing, setRefreshing] = React.useState(false);
        const canvasRef = React.useRef(null);
        const chartRef = React.useRef(null);
        const autoRefreshRef = React.useRef(null);

        const fetchChart = React.useCallback(async (r, silent = false) => {
            if (!silent) { setLoading(true); setError(null); setHoverVal(null); }
            try {
                const res = await fetch(`${API_BASE}/api/portfolio-chart?range=${r}`);
                const json = await res.json();
                if (json.error === 'auth') { setError('auth'); setData(null); }
                else if (json.error === 'auth') {
                    // Auto-try a silent session refresh before showing error
                    if (!silent) {
                        try {
                            const rr = await fetch(API_BASE + '/api/tr/refresh-session', { method: 'POST' });
                            const rj = await rr.json();
                            if (rj.status === 'ok') {
                                // Retry once after refresh
                                const res2 = await fetch(`${API_BASE}/api/portfolio-chart?range=${r}`);
                                const json2 = await res2.json();
                                if (!json2.error) { setData(json2); setLoading(false); return; }
                            }
                        } catch (_) {}
                    }
                    setError('auth'); setData(null);
                }
                else if (json.error) { setError('fetch'); setData(null); }
                else { setError(null); setData(json); }
            } catch (e) { if (!silent) setError('fetch'); }
            finally { if (!silent) setLoading(false); }
        }, []);

        // Initial load + auto-refresh every 5 minutes
        React.useEffect(() => {
            fetchChart(range);
            autoRefreshRef.current = setInterval(() => fetchChart(range, true), 5 * 60 * 1000);
            return () => clearInterval(autoRefreshRef.current);
        }, [range]);

        // Manual refresh handler
        const handleManualRefresh = React.useCallback(async () => {
            setRefreshing(true);
            try {
                await fetch(API_BASE + '/api/tr/refresh-session', { method: 'POST' });
            } catch (_) {}
            await fetchChart(range);
            setRefreshing(false);
        }, [range, fetchChart]);

        // Draw chart whenever data changes
        React.useEffect(() => {
            if (!data || !canvasRef.current) return;
            const items = (data.points || data.items || []);
            if (items.length === 0) return;
            // TR API: { timestamp (Unix ms), netValue (string) }
            const labels = items.map(p => p.timestamp ?? p.time);
            const values = items.map(p => parseFloat(p.netValue ?? p.portfolioValue));
            const ref = values[0];
            const lastVal = values[values.length - 1];
            const isUp = lastVal >= ref;
            const color = isUp ? '#10b981' : '#ef4444';
            const ctx = canvasRef.current.getContext('2d');
            if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
            const grad = ctx.createLinearGradient(0, 0, 0, 240);
            grad.addColorStop(0, isUp ? 'rgba(16,185,129,0.15)' : 'rgba(239,68,68,0.15)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');

            // ── Market session event markers — auto-detected from data ────────────
            // TR only returns data points during active trading hours — there are simply
            // no data points for nights, weekends, and holidays (gaps in the timestamp array).
            // So the reliable way to find session boundaries is to detect *time gaps* between
            // consecutive labels, not value changes (which would be zero when markets are open
            // but TR sends a flat price, which never happens — they just skip the night entirely).
            //
            // Algorithm:
            //  1. Compute the median interval between consecutive timestamps.
            //  2. Any gap ≥ 4× the median = closed market (overnight / weekend / holiday).
            //  3. Start of a gap = 🌙 close, end of a gap = 🔔 open.
            //  Only enabled for 1J / 5J (intraday resolution required).
            const sessionEvents = [];
            if (['1d','5d'].includes(range) && labels.length >= 4) {
                const n = labels.length;

                // Step 1 — all inter-point intervals (ms)
                const intervals = [];
                for (let i = 1; i < n; i++) intervals.push(labels[i] - labels[i - 1]);

                // Step 2 — median interval (normal data cadence)
                const sorted = [...intervals].sort((a, b) => a - b);
                const medianInterval = sorted[Math.floor(sorted.length / 2)];

                // Step 3 — gap threshold: 4× median, minimum 90 min
                const gapThreshold = Math.max(medianInterval * 4, 90 * 60 * 1000);

                // Step 4 — walk intervals, emit events at boundaries
                for (let i = 0; i < intervals.length; i++) {
                    if (intervals[i] >= gapThreshold) {
                        sessionEvents.push({ ts: labels[i],     type: 'close', label: '🌙' });
                        sessionEvents.push({ ts: labels[i + 1], type: 'open',  label: '🔔' });
                    }
                }
            }
            const marketEventsPlugin = {
                id: 'marketEvents',
                afterDraw(chart) {
                    const { ctx: c, chartArea, scales } = chart;
                    if (!chartArea || sessionEvents.length === 0) return;
                    const xScale = scales.x;
                    sessionEvents.forEach(evt => {
                        const x = xScale.getPixelForValue(evt.ts);
                        if (x < chartArea.left || x > chartArea.right) return;
                        const lineColor = evt.type === 'open'    ? 'rgba(16,185,129,0.45)'
                                        : evt.type === 'close'   ? 'rgba(100,116,139,0.35)'
                                        : evt.type === 'pre'     ? 'rgba(245,158,11,0.35)'
                                        : /* holiday */            'rgba(239,68,68,0.35)';
                        c.save();
                        c.beginPath();
                        c.setLineDash([2, 4]);
                        c.strokeStyle = lineColor;
                        c.lineWidth = 1;
                        c.moveTo(x, chartArea.top + 4);
                        c.lineTo(x, chartArea.bottom - 14);
                        c.stroke();
                        c.setLineDash([]);
                        c.font = '9px sans-serif';
                        c.textAlign = 'center';
                        c.globalAlpha = 0.7;
                        c.fillText(evt.label, x, chartArea.bottom - 2);
                        c.globalAlpha = 1;
                        c.restore();
                    });
                }
            };
            // ────────────────────────────────────────────────────────────────────
            chartRef.current = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        data: values,
                        borderColor: color,
                        borderWidth: 2,
                        fill: true,
                        backgroundColor: grad,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        pointHoverBackgroundColor: color,
                        tension: 0.2,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    onHover: (evt, els, chart) => {
                        if (els && els.length > 0) {
                            const idx = els[0].index;
                            // labels are Unix ms timestamps from TR API
                            const ts = labels[idx];
                            const timeStr = (typeof ts === 'number') ? new Date(ts).toISOString() : ts;
                            setHoverVal({ time: timeStr, value: values[idx] });
                        } else {
                            setHoverVal(null);
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(15,23,42,0.85)',
                            titleColor: '#94a3b8',
                            bodyColor: '#f8fafc',
                            titleFont: { size: 10 },
                            bodyFont: { size: 13, weight: 'bold' },
                            padding: 10,
                            callbacks: {
                                label: (ctx) => `€${ctx.raw.toLocaleString('fr-FR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`,
                                title: (items) => {
                                    // label is a Unix ms timestamp (number)
                                    const raw = items[0].label;
                                    const d = new Date(typeof raw === 'number' ? raw : Number(raw));
                                    return isNaN(d) ? String(raw) : d.toLocaleString('fr-FR', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
                                }
                            }
                        }
                    },
                    scales: {
                        x: { display: false },
                        y: {
                            display: true,
                            position: 'right',
                            grid: { color: 'rgba(0,0,0,0.04)', drawBorder: false },
                            ticks: {
                                font: { size: 10 },
                                color: '#94a3b8',
                                maxTicksLimit: 5,
                                callback: (v) => `€${Math.round(v).toLocaleString('fr-FR')}`
                            },
                            border: { display: false }
                        }
                    }
                },
                plugins: [marketEventsPlugin],
            });
        }, [data]);

        const perf = React.useMemo(() => {
            const pts = data?.points || data?.items || [];
            if (pts.length < 2) return null;
            const vals = pts.map(p => parseFloat(p.netValue ?? p.portfolioValue));
            // Use first point of the day's session as reference baseline
            const ref = vals[0];
            const last = vals[vals.length - 1];
            return { pct: ((last - ref) / ref) * 100, diff: last - ref, last };
        }, [data]);

        const displayVal = hoverVal ? hoverVal.value : perf?.last;
        const isUp = perf ? perf.pct >= 0 : true;

        const saveCookies = async () => {
            if (!cookieInput.trim()) return;
            setSavingCookie(true);
            try {
                const r = await fetch(API_BASE + '/api/tr-cookies', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cookies: cookieInput })
                });
                if (r.ok) { setShowCookieModal(false); setCookieInput(''); fetchChart(range); }
            } finally { setSavingCookie(false); }
        };

        return (
            <div className="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden mb-6">
                {/* Header */}
                <div className="px-6 pt-5 pb-4 border-b border-slate-100">
                    <div className="flex items-start justify-between gap-4 flex-wrap">
                        <div className="min-w-0">
                            <div className="text-[10px] text-slate-400 uppercase tracking-wider font-bold mb-1">Valeur Portfolio — Trade Republic</div>
                            {loading ? (
                                <div className="h-8 w-44 bg-slate-100 rounded-lg animate-pulse mt-1"></div>
                            ) : displayVal != null ? (
                                <div className="flex items-end gap-3 flex-wrap">
                                    <span className="text-3xl font-bold text-slate-900 tracking-tight">
                                        €{displayVal.toLocaleString('fr-FR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}
                                    </span>
                                    {perf && !hoverVal && (
                                        <span className={`text-sm font-bold px-2 py-0.5 rounded-lg mb-0.5 ${isUp ? 'bg-emerald-50 text-emerald-600' : 'bg-red-50 text-red-600'}`}>
                                            {perf.pct >= 0 ? '+' : ''}{perf.pct.toFixed(2)}% &nbsp;({perf.diff >= 0 ? '+' : ''}€{Math.abs(perf.diff).toLocaleString('fr-FR', {minimumFractionDigits: 2, maximumFractionDigits: 2})})
                                        </span>
                                    )}
                                    {hoverVal && (
                                        <span className="text-xs text-slate-400 mb-1">{(() => { const d = new Date(hoverVal.time); return isNaN(d) ? hoverVal.time : d.toLocaleString('fr-FR', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); })()}</span>
                                    )}
                                </div>
                            ) : error === 'auth' ? (
                                <p className="text-sm text-amber-600 font-semibold mt-1">Session expirée — collez les cookies DevTools ↗</p>
                            ) : error ? (
                                <p className="text-sm text-red-500 mt-1">Erreur de connexion à Trade Republic</p>
                            ) : null}
                        </div>
                        <div className="flex items-center gap-2 flex-shrink-0">
                            <div className="flex bg-slate-100 p-0.5 rounded-lg">
                                {RANGES.map(r => (
                                    <button key={r.id} onClick={() => setRange(r.id)}
                                        className={`px-2.5 py-1 text-xs font-bold rounded-md transition-all ${range === r.id ? 'bg-white shadow text-slate-900' : 'text-slate-500 hover:text-slate-700'}`}>
                                        {r.label}
                                    </button>
                                ))}
                            </div>
                            {/* Manual refresh button */}
                            <button onClick={handleManualRefresh} disabled={refreshing || loading}
                                className="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-500 disabled:opacity-50 transition-colors" title="Rafraîchir (renouvelle aussi la session)">
                                <svg xmlns="http://www.w3.org/2000/svg" className={`w-4 h-4 ${refreshing ? 'animate-spin' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                </svg>
                            </button>
                            <button onClick={() => setShowCookieModal(true)}
                                className="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-500 transition-colors" title="Configurer les cookies Browser">
                                <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                {/* Chart */}
                <div className="relative" style={{height: '220px'}}>
                    {loading && (
                        <div className="absolute inset-0 flex items-center justify-center bg-white/80 z-10">
                            <div className="animate-spin rounded-full h-6 w-6 border-b-2 border-emerald-500"></div>
                        </div>
                    )}
                    {!loading && (error === 'auth' || error === 'fetch') && (
                        <div className="absolute inset-0 flex flex-col items-center justify-center gap-3">
                            <p className="text-sm text-slate-400">{error === 'auth' ? 'Session Trade Republic expirée.' : 'Impossible de charger le graphique TR.'}</p>
                            <button onClick={handleManualRefresh} disabled={refreshing}
                                className="px-4 py-1.5 bg-emerald-600 text-white text-xs font-bold rounded-lg hover:bg-emerald-700 disabled:opacity-50 transition-colors">
                                {refreshing ? 'Refresh en cours…' : '🔄 Renouveler la session auto'}
                            </button>
                            <button onClick={() => setShowCookieModal(true)}
                                className="px-4 py-1.5 bg-indigo-600 text-white text-xs font-bold rounded-lg hover:bg-indigo-700 transition-colors">
                                Coller les cookies du navigateur
                            </button>
                        </div>
                    )}
                    <canvas ref={canvasRef} style={{position: 'absolute', inset: 0, width: '100%', height: '100%', display: (loading || error) ? 'none' : 'block'}}></canvas>

                {/* Cookie modal */}
                {showCookieModal && (
                    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4"
                        onClick={(e) => e.target === e.currentTarget && setShowCookieModal(false)}>
                        <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6">

                            <textarea
                                className="w-full h-32 text-xs font-mono border border-slate-200 rounded-lg p-3 resize-none focus:outline-none focus:ring-2 focus:ring-indigo-400"
                                placeholder="tr_appearance=Light; tr_device=...; tr_session=eyJ...; aws-waf-token=..."
                                value={cookieInput}
                                onChange={(e) => setCookieInput(e.target.value)}
                                autoFocus
                            />
                            <div className="flex justify-end gap-2 mt-4">
                                <button onClick={() => setShowCookieModal(false)} className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">Annuler</button>
                                <button onClick={saveCookies} disabled={savingCookie || !cookieInput.trim()}
                                    className="px-4 py-2 text-sm bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 disabled:opacity-50 transition-colors">
                                    {savingCookie ? 'Sauvegarde...' : 'Sauvegarder & Recharger'}
