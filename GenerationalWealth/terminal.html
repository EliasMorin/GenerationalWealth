<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Terminal Financier</title>
  <!-- Librairies -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Date adapter required for Chart.js time scale -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

    /* ─────────────────────────────────────────────
       COTALITY DESIGN SYSTEM — Performance-First
       Aucun backdrop-filter. Aucune animation déco.
       Fond blanc, ombres subtiles, transitions 150ms.
    ───────────────────────────────────────────── */

    :root {
      --c-bg:        #F8FAFC;       /* page background */
      --c-surface:   #FFFFFF;       /* cards, panels */
      --c-surface2:  #F1F5F9;       /* alt surface */
      --c-border:    #E2E8F0;       /* borders */
      --c-border2:   #CBD5E1;       /* stronger border */
      --c-navy:      #0F2443;       /* primary dark */
      --c-navy2:     #1B3A6B;       /* secondary nav */
      --c-orange:    #E8541E;       /* accent */
      --c-orange2:   #C94217;       /* accent dark */
      --c-text:      #111827;       /* body text */
      --c-text2:     #4B5563;       /* muted text */
      --c-text3:     #9CA3AF;       /* subtle text */
      --c-success:   #059669;
      --c-danger:    #DC2626;
      --c-warn:      #D97706;
      --c-shadow-sm: 0 1px 3px rgba(15,36,67,0.06), 0 1px 2px rgba(15,36,67,0.04);
      --c-shadow:    0 4px 12px rgba(15,36,67,0.08), 0 1px 3px rgba(15,36,67,0.05);
      --c-shadow-lg: 0 8px 24px rgba(15,36,67,0.10), 0 2px 6px rgba(15,36,67,0.06);
      --c-radius-sm: 6px;
      --c-radius:    10px;
      --c-radius-lg: 14px;
      --c-transition: 150ms ease;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: var(--c-bg);
      color: var(--c-text);
      font-family: 'Inter', 'Space Grotesk', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Supprimé: body::before grid (coûteux) */

    h1, h2, h3, h4 {
      letter-spacing: -0.02em;
      color: var(--c-navy);
      font-weight: 600;
    }

    .font-mono { font-family: 'IBM Plex Mono', monospace; }

    ::selection { background: rgba(232, 84, 30, 0.15); color: var(--c-orange2); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--c-border2); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

    /* ── Cartes ── */
    .c-card {
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--c-radius-lg);
      box-shadow: var(--c-shadow-sm);
    }
    .c-card:hover {
      box-shadow: var(--c-shadow);
      border-color: var(--c-border2);
    }

    /* Alias rétro-compat */
    .glass-panel {
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      box-shadow: var(--c-shadow);
    }
    .glass-card-hover { transition: box-shadow var(--c-transition), border-color var(--c-transition); }
    .glass-card-hover:hover {
      box-shadow: var(--c-shadow-lg);
      border-color: rgba(232,84,30,0.35);
    }

    /* ── Navigation pills ── */
    .nav-pill-active {
      background: var(--c-navy);
      color: #fff;
      box-shadow: var(--c-shadow);
    }
    .nav-pill-inactive { color: var(--c-text2); }
    .nav-pill-inactive:hover { background: var(--c-surface2); color: var(--c-text); }

    /* ── Loading ── */
    .loading-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: var(--c-bg);
      z-index: 9999;
    }

    .modern-loader { width: 52px; height: 52px; position: relative; }
    .modern-loader::before,
    .modern-loader::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2.5px solid transparent;
      border-top-color: var(--c-orange);
      animation: spin 1.6s linear infinite;
    }
    .modern-loader::after {
      border-top-color: var(--c-navy);
      inset: 6px;
      animation-duration: 2.4s;
      animation-direction: reverse;
    }
    .loader-core {
      position: absolute;
      inset: 18px;
      background: var(--c-orange);
      border-radius: 50%;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Ticker tape */
    @keyframes tickerScroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .ticker-tape {
      display: flex;
      align-items: center;
      white-space: nowrap;
      animation: tickerScroll 90s linear infinite;
      will-change: transform;
    }
    .ticker-tape:hover { animation-play-state: paused; }

    .loading-text {
      margin-top: 1.5rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: var(--c-text3);
      text-transform: uppercase;
    }

    /* ── cotality-theme (conteneur principal — sans décorations coûteuses) ── */
    .cotality-theme { position: relative; }

    /* Supprimé: ::before / ::after blurs animés (perf killer) */

    /* Overrides Tailwind dans le thème */
    .cotality-theme .bg-white {
      background-color: var(--c-surface) !important;
    }
    .cotality-theme .border-slate-200,
    .cotality-theme .border-slate-100 {
      border-color: var(--c-border) !important;
    }
    .cotality-theme .text-slate-900 { color: var(--c-text) !important; }
    .cotality-theme .text-indigo-600 { color: var(--c-orange2) !important; }
    .cotality-theme .shadow-sm { box-shadow: var(--c-shadow-sm) !important; }

    /* ── Animations utilitaires ── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn { animation: fadeIn 0.2s ease-out both; }

    .section-enter {
      animation: sectionIn 0.2s ease-out both;
    }
    @keyframes sectionIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes toastSlideIn {
      from { transform: translateX(110%); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }
    .toast-slide-in { animation: toastSlideIn 0.28s cubic-bezier(0.34,1.3,0.64,1) both; }

    .loading-dots::after {
      content: '.';
      animation: dots 1.4s steps(4, end) infinite;
    }
    @keyframes dots {
      0%,20%    { content: '.'; }
      40%       { content: '..'; }
      60%       { content: '...'; }
      80%,100%  { content: ''; }
    }

    /* ── Flash cours temps-réel ── */
    @keyframes flashGreen {
      0%   { background-color: rgba(5,150,105,0.18); }
      100% { background-color: transparent; }
    }
    @keyframes flashRed {
      0%   { background-color: rgba(220,38,38,0.18); }
      100% { background-color: transparent; }
    }
    .flash-up   { animation: flashGreen 0.8s ease-out; }
    .flash-down { animation: flashRed   0.8s ease-out; }

    /* ── Header Cotality ── */
    .c-header {
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--c-radius-lg);
      box-shadow: var(--c-shadow-sm);
    }

    /* ── Nav dock ── */
    .c-nav-dock {
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--c-radius-lg);
      box-shadow: var(--c-shadow);
    }
    .c-nav-tab {
      border-radius: var(--c-radius);
      font-weight: 500;
      font-size: 0.8125rem;
      color: var(--c-text2);
      transition: background var(--c-transition), color var(--c-transition);
      white-space: nowrap;
    }
    .c-nav-tab:hover { background: var(--c-surface2); color: var(--c-text); }
    .c-nav-tab.active {
      background: var(--c-navy);
      color: #fff;
      box-shadow: var(--c-shadow);
    }

    /* ── Boutons Cotality ── */
    .c-btn-primary {
      background: var(--c-navy);
      color: #fff;
      border-radius: var(--c-radius);
      font-weight: 600;
      transition: background var(--c-transition);
    }
    .c-btn-primary:hover { background: var(--c-navy2); }

    .c-btn-orange {
      background: var(--c-orange);
      color: #fff;
      border-radius: var(--c-radius);
      font-weight: 600;
      transition: background var(--c-transition);
    }
    .c-btn-orange:hover { background: var(--c-orange2); }

    /* ── Badge / Tag ── */
    .c-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 2px 8px;
      border-radius: 99px;
      border: 1px solid;
    }
    .c-badge-green  { background:#ECFDF5; color:var(--c-success); border-color:#A7F3D0; }
    .c-badge-red    { background:#FEF2F2; color:var(--c-danger);  border-color:#FCA5A5; }
    .c-badge-orange { background:#FFF7ED; color:var(--c-orange2); border-color:#FED7AA; }
    .c-badge-navy   { background:#EFF6FF; color:var(--c-navy);    border-color:#BFDBFE; }

    /* ── Inputs ── */
    .c-input {
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--c-radius-sm);
      color: var(--c-text);
      font-size: 0.875rem;
      padding: 0.5rem 0.75rem;
      transition: border-color var(--c-transition), box-shadow var(--c-transition);
      outline: none;
    }
    .c-input:focus {
      border-color: var(--c-orange);
      box-shadow: 0 0 0 3px rgba(232,84,30,0.12);
    }

    /* ── Divider ── */
    .c-divider { height: 1px; background: var(--c-border); }

    /* ── Section spacing ── */
    .c-section { margin-bottom: 2rem; }

    /* ======================================================
       RESPONSIVE — Mobile & Tablet
    ====================================================== */

    /* Tables : scroll horizontal */
    table { width: 100%; }
    @media (max-width: 767px) {
      table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    }

    /* Protection overflow global */
    .cotality-theme { overflow-x: hidden; }

    /* ── Mobile < 640px ── */
    @media (max-width: 639px) {
      /* Nav dock : réduction de l'espacement */
      .resp-nav-dock { gap: 0.25rem !important; padding: 0.375rem !important; }
      .resp-nav-tab  { padding: 0.5rem 0.625rem !important; }

      /* Contenu principal : moins de padding */
      .resp-main { padding: 0.75rem !important; }

      /* Sections : espacement réduit */
      .c-section { margin-bottom: 1rem; }

      /* Cards : padding réduit */
      .c-card  { padding: 0.875rem !important; }

      /* Height fixe Truth Social : adaptative */
      .resp-ts-feed { height: 340px !important; }

      /* Chat modal : plein écran */
      .resp-chat-modal { width: 100vw !important; max-width: 100vw !important; height: 90vh !important; }
    }

    /* ── Tablet 640–1023px ── */
    @media (min-width: 640px) and (max-width: 1023px) {
      .resp-ts-feed { height: 440px !important; }
      .resp-chat-modal { width: 90vw !important; max-width: 90vw !important; }
    }

    /* ── Portrait phone : empêcher débordement des cartes ── */
    @media (max-width: 480px) {
      .resp-overflow-hide { display: none !important; }
      .resp-text-xs  { font-size: 0.7rem !important; }
    }

    /* ── Header portfolio value : masqué sur mobile, compact sur tablette ── */
    .resp-portfolio-val { display: none; }
    @media (min-width: 640px) {
      .resp-portfolio-val { display: block; }
    }
    @media (min-width: 640px) and (max-width: 1023px) {
      .resp-portfolio-val .resp-pv-label { display: none; }
      .resp-portfolio-val .resp-pv-amount { font-size: 0.9rem !important; }
    }

    /* ── Header droit : empêcher débordement sur mobile ── */
    @media (max-width: 639px) {
      .resp-header-right { flex-wrap: wrap; gap: 0.5rem !important; }
      .resp-search-wrap  { width: 100% !important; order: 10; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading-container">
      <div class="modern-loader">
        <div class="loader-core"></div>
      </div>
      <div class="loading-text">
        Initialisation du système<span class="loading-dots"></span>
      </div>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useCallback, useRef, useReducer, memo } = React;

    // Dynamic API base — works both on localhost and on the public server
    const API_BASE = window.location.origin;

    /* ------------------- UTILS: ROBUST FETCH & STATE ------------------- */
    
    // Robust fetch with retry logic and exponential backoff
    const fetchWithRetry = async (url, options = {}, retries = 3, backoff = 500) => {
        // Always include credentials so session cookie is sent
        options = { credentials: 'include', ...options };
        try {
            const res = await fetch(url, options);
            if (!res.ok) {
                // Don't retry 4xx errors generally, only 5xx
                if (res.status < 500 && res.status !== 429) {
                     throw new Error(`HTTP ${res.status}`);
                }
                throw new Error(`HTTP ${res.status}`);
            }
            return res;
        } catch (err) {
            if (retries > 0) {
                await new Promise(r => setTimeout(r, backoff));
                return fetchWithRetry(url, options, retries - 1, backoff * 2);
            }
            throw err;
        }
    };

    // Rate limiter for frequent updates
    const useDebounce = (value, delay) => {
      const [debouncedValue, setDebouncedValue] = useState(value);
      useEffect(() => {
        const handler = setTimeout(() => setDebouncedValue(value), delay);
        return () => clearTimeout(handler);
      }, [value, delay]);
      return debouncedValue;
    };

    /* ------------------- Icônes (Memoized) ------------------- */
    
    const Briefcase = React.memo(({ className = "w-5 h-5", ...props }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
      </svg>
    ));

    const Star = React.memo(({ className = "w-5 h-5", ...props }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
    ));

const BloombergIcon = React.memo(({ className = "w-5 h-5" }) => (
      <img
        src="https://cdn.brandfetch.io/idy68RSCip/w/400/h/400/theme/dark/icon.jpeg?c=1bxid64Mup7aczewSAYMX&t=1675835450168"
        alt="Bloomberg"
        className={className}
      />
    ));

    const ConsoleIcon = React.memo(({ className = "w-5 h-5" }) => (
      <img
        src="https://img.icons8.com/3d-fluency/94/console.png"
        alt="console"
        className={className}
      />
    ));

    const OptionsIcon = React.memo(({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} 
          d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
      </svg>
    ));

    const SeasonalityIcon = React.memo(({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} 
          d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
    ));
    
    const Shield = React.memo(({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} 
          d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
      </svg>
    ));

    const AlertTriangle = React.memo(({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} 
          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
    ));

    const PieChart = React.memo(({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} 
          d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z" />
      </svg>
    ));

    const Target = ({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} 
          d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );

    const Smile = ({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );


    
    const ChartIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
          d="M3 3v18h18M7 15l3-3 4 4 5-7" />
      </svg>
    );

    const CreditCard = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
      </svg>
    );
    
    const RefreshCw = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
         <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
    );

    const MessageSquare = ({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} 
          d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
      </svg>
    );

    const Send = ({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} 
          d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
      </svg>
    );

    const ChevronDown = ({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" />
      </svg>
    );

    const X = ({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} 
          d="M6 18L18 6M6 6l12 12" />
      </svg>
    );

    const Sparkles = ({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} 
          d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
      </svg>
    );

    const Brain = ({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3M3.364 6.364l.707.707M11.996 21.01l.008-.008M20.636 6.364l-.707.707M3.5 12a8.5 8.5 0 018.5-8.5v0a8.5 8.5 0 018.5 8.5v0a8.5 8.5 0 01-8.5 8.5v0a8.5 8.5 0 01-8.5-8.5v0z" />
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 16a4 4 0 100-8 4 4 0 000 8z" />
      </svg>
    );

    const TrendingUp = ({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
      </svg>
    );
    const TrendingDown = ({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6" />
      </svg>
    );
    const Calendar = ({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
    );
    const DollarSign = ({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );
    
    const User = ({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
    );

    const LogOut = ({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
         <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
    );
    const Activity = ({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />
      </svg>
    );
    const Zap = ({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />
      </svg>
    );
    const BarChart2 = ({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <rect x="18" y="3" width="4" height="18" rx="1" strokeWidth={2} strokeLinecap="round" />
        <rect x="10" y="9" width="4" height="12" rx="1" strokeWidth={2} strokeLinecap="round" />
        <rect x="2"  y="14" width="4" height="7"  rx="1" strokeWidth={2} strokeLinecap="round" />
      </svg>
    );
    const Check = ({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
         <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
      </svg>
    );
    const Globe = ({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );

    const Users = ({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 8.646 4 4 0 010-8.646M19 1H5a4 4 0 00-4 4v14a4 4 0 004 4h14a4 4 0 004-4V5a4 4 0 00-4-4zm-5.5 16a4 4 0 11-8 0 4 4 0 018 0zM19 16a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
    );

    const Landmark = ({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z" />
      </svg>
    );

    const Loader2 = ({className}) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
      </svg>
    );

    const Search = ({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    );

    /* ------------------- SYSTÈME DE NOTIFICATIONS ------------------- */
    const Bell = ({className}) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} 
          d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
      </svg>
    );

    const NotificationCenter = ({ notifications, onDismiss, onClearAll }) => {
      const [isOpen, setIsOpen] = useState(false);
      const unreadCount = notifications.filter(n => !n.read).length;

      const getSeverityStyles = (severity) => {
        switch(severity) {
          case 'critical': return 'bg-red-100 border-red-200 text-red-600';
          case 'error':    return 'bg-red-50  border-red-200  text-red-500';
          case 'high':     return 'bg-orange-100 border-orange-200 text-orange-600';
          case 'medium':   return 'bg-yellow-100 border-yellow-200 text-yellow-600';
          case 'success':  return 'bg-emerald-50 border-emerald-200 text-emerald-600';
          default:         return 'bg-[#f0f4f8] border-[#112849]/15 text-[#112849]';
        }
      };

      const getSeverityIcon = (severity) => {
        switch(severity) {
          case 'critical': case 'high': case 'error':
            return <AlertTriangle className="w-5 h-5" />;
          case 'medium':
            return <Activity className="w-5 h-5" />;
          case 'success':
            return <Check className="w-5 h-5" />;
          default:
            return <Bell className="w-5 h-5" />;
        }
      };

      return (
        <div className="relative">
          {/* Bouton notification */}
          <button
            onClick={() => setIsOpen(!isOpen)}
            className="relative p-2 rounded-xl bg-white border border-slate-200 hover:border-[#e35f3b]/50 hover:bg-orange-50/30 transition-all duration-200 shadow-sm"
          >
            <Bell className="w-5 h-5 text-[#112849]" />
            {unreadCount > 0 && (
              <span className="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-xs font-bold rounded-full flex items-center justify-center animate-pulse">
                {unreadCount}
              </span>
            )}
          </button>

          {/* Panel notifications */}
          {isOpen && (
            <div className="absolute right-0 top-12 w-96 max-h-[600px] bg-white border border-slate-200 rounded-lg shadow-2xl z-50 overflow-hidden">
              <div className="p-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <Bell className="w-5 h-5 text-indigo-500" />
                  <h3 className="font-semibold text-indigo-900">Notifications</h3>
                  {unreadCount > 0 && (
                    <span className="px-2 py-0.5 bg-red-100 text-red-600 text-xs rounded-full border border-red-200">
                      {unreadCount} non lues
                    </span>
                  )}
                </div>
                <div className="flex gap-2">
                  {notifications.length > 0 && (
                    <button
                      onClick={onClearAll}
                      className="text-xs text-slate-500 hover:text-slate-800 transition-colors"
                    >
                      Tout effacer
                    </button>
                  )}
                  <button
                    onClick={() => setIsOpen(false)}
                    className="text-slate-400 hover:text-slate-600"
                  >
                    <X className="w-4 h-4" />
                  </button>
                </div>
              </div>

              <div className="overflow-y-auto max-h-[500px]">
                {notifications.length === 0 ? (
                  <div className="p-8 text-center text-slate-500">
                    <Bell className="w-12 h-12 mx-auto mb-3 opacity-20" />
                    <p>Aucune notification</p>
                  </div>
                ) : (
                  <div className="divide-y divide-slate-100">
                    {notifications.map((notif) => (
                      <div
                        key={notif.id}
                        className={`p-4 hover:bg-slate-50/60 transition-colors ${
                          !notif.read ? 'bg-orange-50/25' : ''
                        }`}
                      >
                        <div className="flex gap-3">
                          <div className={`flex-shrink-0 w-10 h-10 rounded-lg border flex items-center justify-center ${getSeverityStyles(notif.severity)}`}>
                            {getSeverityIcon(notif.severity)}
                          </div>
                          <div className="flex-1 min-w-0">
                            <div className="flex items-start justify-between gap-2">
                              <div className="flex-1">
                                <div className={`font-semibold text-sm mb-1 ${
                                  notif.severity === 'critical' || notif.severity === 'error' ? 'text-red-700' :
                                  notif.severity === 'high' ? 'text-orange-700' :
                                  notif.severity === 'medium' ? 'text-yellow-700' :
                                  notif.severity === 'success' ? 'text-emerald-700' :
                                  'text-[#112849]'
                                }`}>
                                  {notif.title}
                                </div>
                                <div className="text-sm text-slate-600 leading-relaxed">
                                  {notif.message}
                                </div>
                                <div className="text-xs text-slate-400 mt-2">
                                  {new Date(notif.timestamp).toLocaleString('fr-FR')}
                                </div>
                              </div>
                              <button
                                onClick={() => onDismiss(notif.id)}
                                className="text-slate-400 hover:text-slate-600 transition-colors"
                              >
                                <X className="w-4 h-4" />
                              </button>
                            </div>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Toast / Popup Notifications (Fixed on the right side) */}
          <div className="fixed top-24 right-6 z-[9999] flex flex-col gap-3 pointer-events-none w-96">
            {notifications.filter(n => !n.read && n.isPopup).slice(0, 5).map(notif => (
              <div 
                 key={notif.id} 
                 className="pointer-events-auto toast-slide-in"
              >
                  <div className="bg-white rounded-2xl shadow-lg shadow-slate-200/40 border border-slate-100/80 overflow-hidden relative">
                    {/* Top Accent Line */}
                    <div className={`h-[3px] w-full ${
                       notif.severity === 'critical' || notif.severity === 'error' ? 'bg-gradient-to-r from-red-500 to-rose-400' :
                       notif.severity === 'high' ? 'bg-gradient-to-r from-orange-400 to-amber-400' :
                       notif.severity === 'success' ? 'bg-gradient-to-r from-emerald-500 to-teal-400' :
                       'bg-gradient-to-r from-[#112849] to-[#e35f3b]'
                    }`} />
                    
                    <div className="p-5 flex gap-4">
                       <div className={`mt-1 flex-shrink-0 w-10 h-10 rounded-xl flex items-center justify-center ${
                          notif.severity === 'critical' || notif.severity === 'error' ? 'bg-red-50 text-red-500' :
                          notif.severity === 'high' ? 'bg-orange-50 text-orange-500' :
                          notif.severity === 'success' ? 'bg-emerald-50 text-emerald-500' :
                          'bg-[#112849]/8 text-[#112849]'
                       }`}>
                          {getSeverityIcon(notif.severity)}
                       </div>
                       
                       <div className="flex-1">
                          <div className="flex justify-between items-start">
                             <h4 className="text-sm font-bold text-slate-800">{notif.title}</h4>
                             <button 
                               onClick={() => onDismiss(notif.id)}
                               className="text-slate-300 hover:text-slate-500 transition-colors"
                             >
                                <X className="w-4 h-4" />
                             </button>
                          </div>
                          
                          <p className="text-sm text-slate-500 mt-1 leading-relaxed">
                             {notif.message}
                          </p>
                          
                          <p className="text-xs text-slate-400 mt-3 font-medium">
                             {new Date(notif.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                          </p>
                       </div>
                    </div>
                  </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    /* ------------------- COMPOSANT ANIMÉ FLASH NUMBER ------------------- */
    const FlashNumber = ({ value, prefix = "", suffix = "", className = "", decimals = 2 }) => {
        const [flashClass, setFlashClass] = useState("");
        const prevValueRef = useRef(value);

        useEffect(() => {
            if (prevValueRef.current !== value) {
                if (value > prevValueRef.current) {
                    setFlashClass("flash-up");
                } else if (value < prevValueRef.current) {
                    setFlashClass("flash-down");
                }
                prevValueRef.current = value;

                const timer = setTimeout(() => {
                    setFlashClass("");
                }, 1000);
                return () => clearTimeout(timer);
            }
        }, [value]);

        const formattedValue = typeof value === 'number' ? value.toFixed(decimals) : value;

        return (
            <span className={`${className} ${flashClass} transition-colors duration-200 px-1 inline-block`}>
                {prefix}{formattedValue}{suffix}
            </span>
        );
    };

    /* ------------------- MODAL LOGIN ------------------- */
    const LoginModal = ({ isOpen, onClose, onLoginSuccess }) => {
      const [step, setStep] = useState(1); // 1: Phone/Pin, 2: SMS
      const [formData, setFormData] = useState({ phone: '', pin: '', processId: '', code: '' });
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [countdown, setCountdown] = useState(0);

      // Reset state when modal opens
      useEffect(() => {
        if (isOpen) {
           const loadRemembered = async () => {
               try {
                   const res = await fetch(API_BASE + '/api/auth/remembered');
                   const data = await res.json();
                   setFormData({ 
                       phone: data.phone || '', 
                       pin: data.pin || '', 
                       processId: '', 
                       code: '' 
                   });
               } catch (e) {
                   setFormData({ phone: '', pin: '', processId: '', code: '' });
               }
           };
           setStep(1);
           loadRemembered();
           setError(null);
        }
      }, [isOpen]);

      const handleInitLogin = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError(null);
        try {
          const res = await fetch(API_BASE + '/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ phone: formData.phone, pin: formData.pin })
          });
          const data = await res.json();
          if (data.success && data.processId) {
            setFormData(prev => ({ ...prev, processId: data.processId }));
            if (data.countdown) setCountdown(data.countdown);
            setStep(2);
          } else {
             setError(data.error || 'Erreur inconnue');
          }
        } catch (err) {
          setError('Erreur réseau');
        } finally {
          setLoading(false);
        }
      };

      const handleVerify = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError(null);
        try {
          const res = await fetch(API_BASE + '/api/auth/verify', {
             method: 'POST',
             headers: {'Content-Type': 'application/json'},
             body: JSON.stringify({ processId: formData.processId, code: formData.code })
          });
          const data = await res.json();
          if (data.success) {
            onLoginSuccess();
            onClose();
          } else {
             setError(data.error || 'Code invalide');
          }
        } catch (err) {
           setError('Erreur réseau');
        } finally {
           setLoading(false);
        }
      };
      
      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm animate-fadeIn">
           <div className="bg-white rounded-xl shadow-2xl p-8 max-w-md w-full m-4">
              <div className="flex justify-between items-center mb-6">
                 <h2 className="text-xl font-bold text-slate-900">Connexion Trade Republic</h2>
                 <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
                    <X className="w-5 h-5"/>
                 </button>
              </div>
              
              {step === 1 ? (
                <form onSubmit={handleInitLogin} className="space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">Numéro de téléphone</label>
                    <input 
                       type="tel" 
                       placeholder="+33612345678"
                       className="w-full rounded-lg border-slate-300 p-2.5 text-sm focus:ring-[#e35f3b] focus:border-[#e35f3b] border transition-colors"
                       value={formData.phone}
                       onChange={e => setFormData({...formData, phone: e.target.value})}
                       required
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">Code PIN</label>
                    <input 
                       type="password" 
                       placeholder="****"
                       maxLength="4"
                       className="w-full rounded-lg border-slate-300 p-2.5 text-sm focus:ring-[#e35f3b] focus:border-[#e35f3b] border transition-colors"
                       value={formData.pin}
                       onChange={e => setFormData({...formData, pin: e.target.value})}
                       required
                    />
                  </div>
                  {error && <div className="text-red-500 text-sm bg-red-50 p-2 rounded">{error}</div>}
                  <button 
                    type="submit" 
                    disabled={loading}
                    className="w-full bg-slate-900 text-white rounded-lg py-3 font-medium hover:bg-slate-800 disabled:opacity-50 transition-colors shadow-lg shadow-slate-200"
                  >
                    {loading ? 'Connexion...' : 'Suivant'}
                  </button>
                </form>
              ) : (
                <form onSubmit={handleVerify} className="space-y-4">
                   <div className="bg-[#f0f4f8] text-[#112849] p-3 rounded-lg text-sm mb-4 border border-[#112849]/12">
                      Un code a été envoyé au <strong>{formData.phone}</strong>. 
                      {countdown > 0 && <span className="font-bold ml-1">({countdown}s)</span>}
                   </div>
                   <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">Code SMS</label>
                    <input 
                       type="text" 
                       placeholder="Ex: 1234"
                       className="w-full rounded-lg border-slate-300 p-2.5 text-sm focus:ring-[#e35f3b] focus:border-[#e35f3b] border text-center tracking-widest text-lg font-mono transition-colors"
                       value={formData.code}
                       onChange={e => setFormData({...formData, code: e.target.value})}
                       required
                       autoFocus
                    />
                   </div>
                   {error && <div className="text-red-500 text-sm bg-red-50 p-2 rounded">{error}</div>}
                   <button 
                    type="submit" 
                    disabled={loading}
                    className="w-full bg-emerald-600 text-white rounded-lg py-3 font-medium hover:bg-emerald-700 disabled:opacity-50 transition-colors shadow-lg shadow-emerald-200"
                  >
                    {loading ? 'Vérification...' : 'Valider'}
                  </button>
                  <button 
                    type="button" 
                    onClick={() => setStep(1)}
                    className="w-full text-slate-500 text-sm hover:text-slate-800 mt-2"
                  >
                    Retour
                  </button>
                </form>
              )}
           </div>
        </div>
      );
    };

    /* ---------------- Composants Insiders ---------------- */
    const StockLogo = React.memo(({ isin, ticker, name, className = "w-10 h-10" }) => {
      const [error, setError] = useState(false);
      const identifier = isin || ticker;
      const type = isin ? 'isin' : 'symbol';
      
      if (error || !identifier) {
        return (
          <div className={`${className} rounded-lg bg-slate-100 flex items-center justify-center text-xs font-bold text-slate-500 border border-slate-200 shadow-sm`}>
            {name ? name.substring(0, 2).toUpperCase() : (ticker || '??')}
          </div>
        );
      }

      return (
        <div className={`${className} rounded-lg bg-white overflow-hidden border border-slate-200 shadow-sm relative group-hover:border-indigo-400 transition-colors`}>
          <img 
            src={`https://api.elbstream.com/logos/${type}/${identifier}`} 
            alt={name || ticker}
            className="w-full h-full object-contain"
            onError={() => setError(true)}
          />
        </div>
      );
    });

    const InsiderScopeToggle = () => {
      const [scope, setScope] = useState('all'); // 'all' | 'recent7'
      useEffect(() => {
        const ev = new CustomEvent('insider-scope', { detail: scope });
        window.dispatchEvent(ev);
      }, [scope]);
      return (
        <div className="flex items-center gap-2 bg-white border border-slate-200 rounded-lg p-1 shadow-sm">
          <button
            className={`px-4 py-2 text-sm rounded-md font-medium transition-all ${scope==='all' ? 'bg-[#1e293b] text-white shadow-md' : 'text-slate-500 hover:text-slate-800 hover:bg-slate-50'}`}
            onClick={() => setScope('all')}
          >Tous</button>
          <button
            className={`px-4 py-2 text-sm rounded-md font-medium transition-all ${scope==='recent7' ? 'bg-[#1e293b] text-white shadow-md' : 'text-slate-500 hover:text-slate-800 hover:bg-slate-50'}`}
            onClick={() => setScope('recent7')}
          >7 derniers jours</button>
        </div>
      );
    };

    const InsiderTables = ({ filteredInsiders, formatInsiderDate, numberWithSpaces }) => {
      const [scope, setScope] = useState('all');
      useEffect(() => {
        const handler = (e) => setScope(e.detail);
        window.addEventListener('insider-scope', handler);
        return () => window.removeEventListener('insider-scope', handler);
      }, []);
      if (!filteredInsiders || filteredInsiders.length === 0) {
        return (

      const calculatePortfolioRisk = (positions, totalValue) => {
        // Mapping des positions aux secteurs et indices
        const sectorMapping = {
          'Alphabet': { sector: 'Technology', subsector: 'Internet Services', index: 'NASDAQ-100', beta: 1.05 },
          'Google': { sector: 'Technology', subsector: 'Internet Services', index: 'NASDAQ-100', beta: 1.05 },
          'NVIDIA': { sector: 'Technology', subsector: 'Semiconductors', index: 'NASDAQ-100', beta: 1.7 },
          'Broadcom': { sector: 'Technology', subsector: 'Semiconductors', index: 'NASDAQ-100', beta: 1.3 },
          'Apple': { sector: 'Technology', subsector: 'Consumer Electronics', index: 'NASDAQ-100', beta: 1.2 },
          'Taiwan Semiconductor': { sector: 'Technology', subsector: 'Semiconductors', index: 'Taiwan Stock Exchange', beta: 1.4 },
          'TSMC': { sector: 'Technology', subsector: 'Semiconductors', index: 'Taiwan Stock Exchange', beta: 1.4 },
          'Microsoft': { sector: 'Technology', subsector: 'Software', index: 'NASDAQ-100', beta: 1.1 },
          'Amazon': { sector: 'Consumer Cyclical', subsector: 'E-commerce', index: 'NASDAQ-100', beta: 1.15 },
          'Meta': { sector: 'Technology', subsector: 'Social Media', index: 'NASDAQ-100', beta: 1.25 },
          'Tesla': { sector: 'Consumer Cyclical', subsector: 'Automotive', index: 'NASDAQ-100', beta: 2.0 },
          'Netflix': { sector: 'Communication Services', subsector: 'Streaming', index: 'NASDAQ-100', beta: 1.3 },
        };

        // Enrichir les positions avec les métadonnées
        const enrichedPositions = positions.map(pos => {
          let metadata = { sector: 'Unknown', subsector: 'Unknown', index: 'Unknown', beta: 1.0 };
          
          // Recherche du mapping
          for (const [key, value] of Object.entries(sectorMapping)) {
            if (pos.name.includes(key)) {
              metadata = value;
              break;
            }
          }

          return {
            ...pos,
            ...metadata,
            weight: (pos.marketValue / totalValue) * 100
          };
        });

        // 1. Exposition sectorielle
        const sectorExposure = {};
        enrichedPositions.forEach(pos => {
          if (!sectorExposure[pos.sector]) {
            sectorExposure[pos.sector] = { value: 0, weight: 0, count: 0 };
          }
          sectorExposure[pos.sector].value += pos.marketValue;
          sectorExposure[pos.sector].weight += pos.weight;
          sectorExposure[pos.sector].count += 1;
        });

        // 2. Exposition par sous-secteur
        const subsectorExposure = {};
        enrichedPositions.forEach(pos => {
          if (!subsectorExposure[pos.subsector]) {
            subsectorExposure[pos.subsector] = { value: 0, weight: 0, count: 0 };
          }
          subsectorExposure[pos.subsector].value += pos.marketValue;
          subsectorExposure[pos.subsector].weight += pos.weight;
          subsectorExposure[pos.subsector].count += 1;
        });

        // 3. Exposition par indice
        const indexExposure = {};
        enrichedPositions.forEach(pos => {
          if (!indexExposure[pos.index]) {
            indexExposure[pos.index] = { value: 0, weight: 0, count: 0 };
          }
          indexExposure[pos.index].value += pos.marketValue;
          indexExposure[pos.index].weight += pos.weight;
          indexExposure[pos.index].count += 1;
        });

        // 4. Calcul du Beta pondéré du portfolio
        const portfolioBeta = enrichedPositions.reduce((sum, pos) => 
          sum + (pos.beta * pos.weight / 100), 0
        );

        // 5. Concentration risk (Herfindahl Index)
        const herfindahlIndex = enrichedPositions.reduce((sum, pos) => 
          sum + Math.pow(pos.weight, 2), 0
        );

        // 6. Top positions concentration
        const sortedByWeight = [...enrichedPositions].sort((a, b) => b.weight - a.weight);
        const top3Concentration = sortedByWeight.slice(0, 3).reduce((sum, pos) => sum + pos.weight, 0);
        const top5Concentration = sortedByWeight.slice(0, 5).reduce((sum, pos) => sum + pos.weight, 0);

        // 7. Corrélation estimée (simplifiée - même secteur = corrélation élevée)
        const correlationMatrix = {};
        enrichedPositions.forEach(pos1 => {
          correlationMatrix[pos1.name] = {};
          enrichedPositions.forEach(pos2 => {
            if (pos1.name === pos2.name) {
              correlationMatrix[pos1.name][pos2.name] = 1.0;
            } else if (pos1.subsector === pos2.subsector) {
              correlationMatrix[pos1.name][pos2.name] = 0.85; // Haute corrélation même sous-secteur
            } else if (pos1.sector === pos2.sector) {
              correlationMatrix[pos1.name][pos2.name] = 0.65; // Corrélation moyenne même secteur
            } else {
              correlationMatrix[pos1.name][pos2.name] = 0.3; // Corrélation faible secteurs différents
            }
          });
        });

        // 8. Volatilité estimée du portfolio (basée sur beta)
        const avgBeta = portfolioBeta;
        const estimatedVolatility = avgBeta * 15; // Estimation: marché à ~15% volatilité annuelle

        // 9. Risques identifiés
        const risks = [];
        
        if (top3Concentration > 60) {
          risks.push({
            level: 'high',
            type: 'Concentration',
            message: `Top 3 positions représentent ${top3Concentration.toFixed(1)}% du portfolio (>60%)`,
            recommendation: 'Envisager une diversification accrue'
          });
        }

        if (portfolioBeta > 1.3) {
          risks.push({
            level: 'high',
            type: 'Volatilité',
            message: `Beta portfolio élevé (${portfolioBeta.toFixed(2)}) - forte sensibilité au marché`,
            recommendation: 'Ajouter des actifs défensifs ou réduire l\'exposition aux valeurs volatiles'
          });
        }

        Object.entries(sectorExposure).forEach(([sector, data]) => {
          if (data.weight > 70) {
            risks.push({
              level: 'high',
              type: 'Secteur',
              message: `Exposition ${sector}: ${data.weight.toFixed(1)}% (>70%)`,
              recommendation: 'Diversifier vers d\'autres secteurs'
            });
          }
        });

        if (herfindahlIndex > 2500) {
          risks.push({
            level: 'medium',
            type: 'Diversification',
            message: `Indice Herfindahl élevé (${herfindahlIndex.toFixed(0)}) - portfolio concentré`,
            recommendation: 'Augmenter le nombre de positions'
          });
        }

        return {
          enrichedPositions,
          sectorExposure,
          subsectorExposure,
          indexExposure,
          portfolioBeta,
          herfindahlIndex,
          top3Concentration,
          top5Concentration,
          correlationMatrix,
          estimatedVolatility,
          risks,
          diversificationScore: Math.max(0, 100 - (herfindahlIndex / 50)) // Score sur 100
        };
      };

      const AIChatPanel = ({ isOpen, onClose, portfolioData, portfolioMetrics, forexData, insiderData, newsData, optionsData, seasonalityData, sectorTrends, bloombergNews, filteredInsiders, portfolioTickers, bloombergLiveStatus, onInsiderCacheUpdate }) => {

        const buildContextData = () => {
          const context = {

              cash: portfolioData.cash,
              positions: portfolioData.positions.map(p => ({
                name: p.name,
                isin: p.isin,
                quantity: p.qty,

                cashRatio: (portfolioData.cash / (portfolioMetrics.totalValue + portfolioData.cash) * 100).toFixed(1) + '%',
                concentrationTop3: ((portfolioMetrics.positions.sort((a,b) => b.marketValue - a.marketValue).slice(0,3).reduce((acc, p) => acc + p.marketValue, 0) / portfolioMetrics.totalValue) * 100).toFixed(1) + '%',
                profitablePositionsCount: portfolioMetrics.positions.filter(p => p.pnl > 0).length,
                losingPositionsCount: portfolioMetrics.positions.filter(p => p.pnl < 0).length
              },
              topPositions: portfolioMetrics.positions.slice(0, 5).map(p => ({
                name: p.name,
                marketValue: p.marketValue,
                weight: ((p.marketValue / portfolioMetrics.totalValue) * 100).toFixed(1) + '%',
                pnl: p.pnl,
                pnlPercent: p.pnlPercent
              }))
            } : null,
            forexEvents: forexData ? forexData.slice(0, 10).map(e => ({
              date: e.date,
              title: e.title,
              country: e.country,
              impact: e.impact,
              forecast: e.forecast,
              previous: e.previous
            })) : null,
            // include the full insider dataset (or the filtered insiders if provided)
            insiderTransactions: filteredInsiders && filteredInsiders.length > 0 ? filteredInsiders : (insiderData ? insiderData : null),
            optionsSummary: optionsData ? {
              ticker: optionsData.ticker,
              currentPrice: optionsData.current_price,
              sentiment: optionsData.sentiment_marche?.sentiment,
              putCallRatio: optionsData.sentiment_marche?.put_call_ratio_volume,
              volatilite: optionsData.volatilite_anticipee?.attente
            } : null,
            seasonalitySummary: seasonalityData ? {
              period: `${seasonalityData.metadata?.start_date} → ${seasonalityData.metadata?.end_date}`,
              indices: Object.keys(seasonalityData.data_summary || {})
            } : null,
            sectorTrendsSummary: sectorTrends ? Object.entries(sectorTrends).reduce((acc, [k,v]) => {
                if (v && v.monthly_trend != null && !isNaN(v.monthly_trend)) acc[k] = parseFloat(v.monthly_trend).toFixed(2);
                return acc;
            }, {}) : null,
            // calendar: include compact seasonality / calendar data the assistant can use
            calendar: seasonalityData ? (function(){
              try {
                const indices = Object.keys(seasonalityData.data_summary || {});
                const bestWorst = (seasonalityData.monthly_cycles || {});
                const best_months = {};
                const worst_months = {};
                for (const idx of indices) {
                  const entry = bestWorst[idx] || {};
                  best_months[idx] = (entry.best_months || []).slice(0,3);
                  worst_months[idx] = (entry.worst_months || []).slice(0,3);
                }

                // derive a small months ranking per index (top 3 by avg_return_pct)
                const months_summary = {};
                if (seasonalityData.months) {
                  for (const idx of indices) {
                    const monthsObj = seasonalityData.months[idx] || {};
                    const ranked = Object.entries(monthsObj)
                      .map(([m,v]) => ({ month: m, avg_return_pct: v.avg_return_pct, positive_days_pct: v.positive_days_pct }))
                      .sort((a,b) => (b.avg_return_pct || 0) - (a.avg_return_pct || 0))
                      .slice(0,3);
                    months_summary[idx] = ranked;
                  }
                }

                return {
                  period: `${seasonalityData.metadata?.start_date} → ${seasonalityData.metadata?.end_date}`,
                  indices,
                  best_months,
                  worst_months,
                  months_summary
                };
              } catch (e) {
                return null;

            })() : null,

            latestNews: newsData?.items ? newsData.items.slice(0, 10).map(n => ({

              ai_summary: n.ai_summary || null,
              authors: n.authors || null,
              tags: n.tags || null
            })) : null,
            // include Bloomberg segments with more details (up to 10 segments)
            bloombergNews: bloombergNews?.news_segments ? bloombergNews.news_segments.slice(0, 10).map(s => ({
              main_title: s.main_title,
              timestamp: s.timestamp,
              ai_summary: s.ai_summary,
              fragment_count: s.fragment_count,
              fragments: s.fragments || null
            })) : null,
            // small metadata to help the assistant know sizes / live status
            meta: {
              news_count: newsData?.items?.length || 0,
              bloomberg_segments_count: bloombergNews?.news_segments?.length || 0,
              insider_blocks_count: insiderData ? Object.keys(insiderData).length : (filteredInsiders ? filteredInsiders.length : 0),
              portfolio_tickers: portfolioTickers || [] ,
